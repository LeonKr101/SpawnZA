<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">

<title>Spawnza — Your gear. Your game.</title>
<meta name="description" content="Buy and sell second-hand games, consoles and tech across South Africa.">
<meta name="theme-color" content="#0E1013">
<meta name="color-scheme" content="dark">
<!-- Keep the prototype out of search results until launch (MASTERPLAN V28: remove this line then). -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%232DFF81'/%3E%3Cg fill='%2304150B'%3E%3Crect x='12.5' y='7.5' width='20' height='5'/%3E%3Crect x='7.5' y='12.5' width='5' height='5'/%3E%3Crect x='12.5' y='17.5' width='15' height='5'/%3E%3Crect x='27.5' y='22.5' width='5' height='5'/%3E%3Crect x='7.5' y='27.5' width='20' height='5'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* ===== SZ:CSS-TOKENS ===== */
:root{
  color-scheme: dark;
  --bg:#0E1013; --surface:#161A1F; --surface-2:#1E242B; --border:#2B323B;
  --text:#EAEEF2; --muted:#A0AAB5;
  --accent:#2DFF81; --accent-ink:#04150B; --accent-dim:#1FBF62;
  --danger:#FF5C6C; --warn:#FFB020; --info:#4CC9F0;
  --radius-sm:8px; --radius:14px; --radius-lg:20px;
  --shadow:0 6px 24px rgba(0,0,0,.35);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --maxw:1200px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px; --space-7:48px; --space-8:64px;
}
/* Layout sizes used by the shell (kept apart from the design tokens above) */
:root{ --header-h:56px; --tabbar-h:64px; --gutter:16px; }
@media (min-width:640px){ :root{ --gutter:24px; } }

/* ===== SZ:CSS-BASE ===== */
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
body{ margin:0; background:var(--bg); color:var(--text); font:400 1rem/1.5 var(--font); }
[hidden]{ display:none !important; }
h1,h2,h3,p{ margin:0; }
h1{ font-size:clamp(1.75rem,5vw,2.75rem); line-height:1.1; letter-spacing:-.02em; }
h2{ font-size:clamp(1.35rem,3.5vw,1.9rem); line-height:1.2; letter-spacing:-.01em; }
h3{ font-size:1.15rem; line-height:1.3; }
a{ color:inherit; text-decoration:none; }
ul{ list-style:none; margin:0; padding:0; }
button,input{ font:inherit; color:inherit; }
button{ cursor:pointer; }
svg{ flex:none; }
.icon{ width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.muted{ color:var(--muted); }
.accent{ color:var(--accent); }
.sr-only{ position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
.container{ width:100%; max-width:var(--maxw); margin-inline:auto; padding-inline:var(--gutter); }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
[tabindex="-1"]:focus{ outline:none; }
.skip-link{ position:absolute; left:var(--space-4); top:-120px; z-index:100; padding:var(--space-3) var(--space-4); background:var(--accent); color:var(--accent-ink); font-weight:700; border-radius:var(--radius-sm); }
.skip-link:focus{ top:var(--space-3); }
.sprite{ position:absolute; width:0; height:0; overflow:hidden; }
html.modal-open{ overflow:hidden; }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
}

/* ===== SZ:CSS-COMPONENTS ===== */
/* Button */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:var(--space-2); min-height:44px; padding:0 var(--space-5); border:1px solid transparent; border-radius:var(--radius-sm); font-weight:700; line-height:1.2; text-align:center; transition:background-color .15s,border-color .15s,color .15s; }
.btn--primary{ background:var(--accent); color:var(--accent-ink); }
.btn--primary:hover{ background:var(--accent-dim); }
.btn--secondary{ background:transparent; color:var(--text); border-color:var(--border); }
.btn--secondary:hover{ border-color:var(--accent); }
.btn--ghost{ background:transparent; color:var(--text); }
.btn--ghost:hover{ background:var(--surface-2); }
.btn--danger{ background:var(--danger); color:#1A0508; }
.btn--danger:hover{ filter:brightness(.92); }
.btn--lg{ min-height:52px; padding:0 var(--space-6); font-size:1.0625rem; }
.btn[disabled],.btn[aria-disabled="true"]{ opacity:.5; cursor:not-allowed; }
.icon-btn{ display:inline-grid; place-items:center; width:44px; height:44px; padding:0; border:0; border-radius:var(--radius-sm); background:transparent; color:var(--text); transition:background-color .15s; }
.icon-btn:hover{ background:var(--surface-2); }
/* Text field (search uses it now; forms reuse it from V07) */
.field{ width:100%; min-width:0; min-height:44px; padding:0 var(--space-4); border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); color:var(--text); }
.field::placeholder{ color:var(--muted); opacity:1; }
.field:focus-visible{ outline-offset:0; border-color:var(--accent); }
/* Badge: DEMO, SOLD, FEATURED, NEW, BUSINESS (self-declared) */
.badge{ display:inline-flex; align-items:center; padding:2px var(--space-2); border:1px solid var(--border); border-radius:999px; background:var(--surface-2); color:var(--text); font-size:.75rem; font-weight:700; letter-spacing:.04em; line-height:1.4; text-transform:uppercase; white-space:nowrap; }
.badge--demo{ color:var(--warn); border-color:rgba(255,176,32,.45); background:rgba(255,176,32,.1); }
.badge--sold{ color:var(--danger); border-color:rgba(255,92,108,.45); background:rgba(255,92,108,.1); }
.badge--featured{ color:var(--accent); border-color:rgba(45,255,129,.45); background:rgba(45,255,129,.1); }
.badge--new{ color:var(--info); border-color:rgba(76,201,240,.45); background:rgba(76,201,240,.1); }
.badge--business{ color:var(--text); }
/* Banner (Preview mode) */
.banner{ padding:var(--space-2) var(--space-4); background:rgba(255,176,32,.12); border-bottom:1px solid rgba(255,176,32,.5); font-size:.875rem; text-align:center; }
/* Toast */
.toasts{ position:fixed; left:50%; bottom:calc(var(--tabbar-h) + var(--space-4) + env(safe-area-inset-bottom,0px)); z-index:90; display:flex; flex-direction:column; gap:var(--space-2); width:min(92vw,420px); transform:translateX(-50%); pointer-events:none; }
.toast{ pointer-events:auto; padding:var(--space-3) var(--space-4); border:1px solid var(--border); border-left:4px solid var(--info); border-radius:var(--radius-sm); background:var(--surface-2); box-shadow:var(--shadow); opacity:0; transform:translateY(8px); transition:opacity .2s,transform .2s; }
.toast.is-in{ opacity:1; transform:none; }
.toast--success{ border-left-color:var(--accent); }
.toast--error{ border-left-color:var(--danger); }
.toast--warn{ border-left-color:var(--warn); }
/* Modal / sheet */
.modal-backdrop{ position:fixed; inset:0; z-index:80; display:flex; align-items:flex-end; justify-content:center; background:rgba(0,0,0,.6); opacity:0; transition:opacity .2s; }
.modal-backdrop.is-in{ opacity:1; }
.modal{ width:100%; max-height:85vh; max-height:85dvh; overflow:auto; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg) var(--radius-lg) 0 0; box-shadow:var(--shadow); padding:var(--space-4) var(--gutter) calc(var(--space-5) + env(safe-area-inset-bottom,0px)); transform:translateY(16px); transition:transform .2s; }
.modal-backdrop.is-in .modal{ transform:none; }
.modal__head{ display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); margin-bottom:var(--space-3); }
.modal__title{ font-size:1.25rem; }
@media (min-width:640px){
  .modal-backdrop{ align-items:center; padding:var(--space-5); }
  .modal{ max-width:480px; border-radius:var(--radius-lg); padding-bottom:var(--space-5); }
}

/* ===== SZ:CSS-VIEWS ===== */
/* Shell: header */
#app{ display:flex; flex-direction:column; min-height:100vh; min-height:100dvh; padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px)); }
.site-header{ position:sticky; top:0; z-index:40; background:var(--bg); border-bottom:1px solid var(--border); }
.site-header__bar{ display:grid; grid-template-columns:1fr auto; grid-template-areas:"logo actions" "search search"; align-items:center; column-gap:var(--space-3); min-height:var(--header-h); }
.logo{ grid-area:logo; display:inline-flex; align-items:center; gap:var(--space-2); justify-self:start; min-height:44px; }
.logo__word{ font-size:1.375rem; font-weight:800; letter-spacing:-.03em; }
.logo__za{ color:var(--accent); }
.header-actions{ grid-area:actions; display:flex; align-items:center; gap:var(--space-1); }
.search{ grid-area:search; display:none; gap:var(--space-2); padding-bottom:var(--space-3); }
.search.is-open{ display:flex; }
.nav-desktop{ grid-area:nav; display:none; }
.nav-link{ display:inline-flex; align-items:center; min-height:44px; padding:0 var(--space-3); border-radius:var(--radius-sm); color:var(--muted); font-weight:600; transition:background-color .15s,color .15s; }
.nav-link:hover{ color:var(--text); background:var(--surface-2); }
.nav-link[aria-current="page"]{ color:var(--text); background:var(--surface-2); }
.btn[aria-current="page"]{ box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent); }
/* Shell: bottom tab bar (mobile) */
.tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:50; padding-bottom:env(safe-area-inset-bottom,0px); background:var(--surface); box-shadow:0 -1px 0 var(--border); }
.tabbar ul{ display:grid; grid-template-columns:repeat(5,1fr); height:var(--tabbar-h); max-width:560px; margin-inline:auto; }
.tabbar a{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; height:100%; min-width:44px; color:var(--muted); font-size:.75rem; font-weight:600; transition:color .15s; }
.tabbar a:hover{ color:var(--text); }
.tabbar a[aria-current="page"]{ color:var(--accent); }
.tabbar__sell .sell-bubble{ display:grid; place-items:center; width:52px; height:52px; margin-top:-26px; border-radius:18px; background:var(--accent); color:var(--accent-ink); box-shadow:var(--shadow),0 0 0 4px var(--surface); }
.tabbar__sell a{ color:var(--text); }
/* Shell: footer */
.site-footer{ margin-top:var(--space-7); padding-block:var(--space-6); border-top:1px solid var(--border); color:var(--muted); font-size:.875rem; }
.site-footer__inner{ display:flex; flex-direction:column; gap:var(--space-1); }
.site-footer__nav{ display:flex; flex-wrap:wrap; margin:0 calc(var(--space-3) * -1) var(--space-2); }
.site-footer__nav a{ display:inline-flex; align-items:center; min-height:44px; padding:0 var(--space-3); color:var(--text); }
.prose{ max-width:65ch; }
.prose h2{ margin:var(--space-6) 0 var(--space-2); font-size:1.25rem; }
.prose p, .prose li{ overflow-wrap:anywhere; }
.prose ul, .prose ol{ margin:var(--space-2) 0; padding-left:var(--space-5); }
.prose ul{ list-style:disc; } .prose ol{ list-style:decimal; }
.prose li{ margin-bottom:var(--space-2); }
.prose__lead{ font-size:1.0625rem; }
.prose .note, .prose .banner{ margin:var(--space-4) 0; }
.prose h1{ margin-bottom:var(--space-3); }
.prose p{ margin:var(--space-2) 0; }
.prose > p:last-child{ margin-top:var(--space-5); }
.prose a, .note a, .banner a:not(.btn){ color:var(--accent); text-decoration:underline; text-underline-offset:2px; }
main{ flex:1 0 auto; }
/* Pages */
.page{ padding-block:var(--space-5) 0; }
.section{ margin-top:var(--space-7); }
.section > h2{ margin-bottom:var(--space-3); }
.hero{ display:flex; flex-direction:column; align-items:flex-start; gap:var(--space-4); padding-top:var(--space-6); max-width:720px; }
.hero__mark{ width:64px; height:64px; border-radius:16px; }
.eyebrow{ color:var(--accent); font-size:.8125rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
.lead{ color:var(--muted); font-size:1.125rem; max-width:34em; }
.cat-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--space-3); }
.cat{ display:flex; flex-direction:column; gap:var(--space-1); height:100%; min-height:44px; padding:var(--space-4); border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); transition:border-color .15s,background-color .15s; }
.cat:hover{ border-color:var(--accent); background:var(--surface-2); }
.cat__icon{ font-size:1.75rem; line-height:1.2; }
.cat__label{ font-weight:700; }
.cat__hint{ color:var(--muted); font-size:.8125rem; }
.card-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--space-3); }
.card{ height:100%; overflow:hidden; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); }
.card__media{ display:grid; place-items:center; aspect-ratio:4/3; background:linear-gradient(135deg,var(--surface-2),var(--surface)); font-size:3rem; }
.card__body{ display:flex; flex-direction:column; align-items:flex-start; gap:var(--space-1); padding:var(--space-3); }
.card__title{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere; }
.price{ font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
.card__price{ color:var(--accent); font-size:1.15rem; }
.card__meta{ color:var(--muted); font-size:.8125rem; }
.card--link{ display:block; color:inherit; text-decoration:none; transition:border-color .15s; }
.card--link:hover{ border-color:var(--accent); }
.card__media img{ display:block; width:100%; height:100%; object-fit:cover; }
.card__badges{ display:flex; flex-wrap:wrap; gap:var(--space-1); }
.chip{ display:inline-flex; align-items:center; padding:2px var(--space-2); border:1px solid var(--border); border-radius:999px; color:var(--muted); font-size:.75rem; line-height:1.4; white-space:nowrap; }
.dev-bar{ display:flex; flex-wrap:wrap; align-items:center; gap:var(--space-3); margin-block:var(--space-4); }
.card--link .card__title{ font-size:.9375rem; line-height:1.3; }
.skel{ background:linear-gradient(90deg,var(--surface-2) 0%,var(--border) 50%,var(--surface-2) 100%); background-size:200% 100%; animation:sz-shimmer 1.4s linear infinite; }
@keyframes sz-shimmer{ from{ background-position:200% 0; } to{ background-position:-200% 0; } }
.skel--line{ display:block; width:100%; height:14px; border-radius:6px; }
.skel--short{ width:55%; }
.skel--title{ width:45%; max-width:260px; height:28px; margin-bottom:var(--space-3); border-radius:8px; }
.skel--tile{ height:104px; border-radius:var(--radius); }
@media (prefers-reduced-motion:reduce){ .skel{ animation:none; } }
/* Homepage */
.field--lg{ min-height:52px; font-size:1.0625rem; }
.hero-search{ display:flex; gap:var(--space-2); width:100%; max-width:560px; }
.hero-search .btn{ padding-inline:var(--space-4); }
.qchips{ display:flex; flex-wrap:wrap; gap:var(--space-2); }
.chip--link{ min-height:44px; padding:0 var(--space-4); color:var(--text); font-size:.9375rem; transition:border-color .15s,background-color .15s; }
.chip--link:hover{ border-color:var(--accent); background:var(--surface-2); }
.section__head{ display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); margin-bottom:var(--space-3); }
.section__note{ margin-top:var(--space-3); font-size:.875rem; }
.link{ display:inline-flex; align-items:center; min-height:44px; color:var(--accent); font-weight:700; white-space:nowrap; }
.link:hover{ text-decoration:underline; }
.cat__count{ margin-top:auto; padding-top:var(--space-2); color:var(--accent); font-size:.8125rem; font-weight:700; }
.card-row{ overflow-x:auto; padding-bottom:var(--space-2); scroll-snap-type:x proximity; }
.card-row__list{ display:flex; gap:var(--space-3); }
.card-row__list > li{ flex:0 0 min(70%,250px); scroll-snap-align:start; }
.how{ display:grid; grid-template-columns:1fr; gap:var(--space-5); }
.how__col h3{ margin-bottom:var(--space-3); }
.steps{ display:flex; flex-direction:column; gap:var(--space-3); counter-reset:step; }
.steps li{ display:flex; align-items:flex-start; gap:var(--space-3); counter-increment:step; }
.steps li::before{ content:counter(step); flex:none; display:grid; place-items:center; width:28px; height:28px; border-radius:50%; background:var(--surface-2); border:1px solid var(--border); color:var(--accent); font-size:.875rem; font-weight:800; }
.cta{ display:flex; flex-direction:column; gap:var(--space-4); padding:var(--space-5); border:1px solid var(--border); border-radius:var(--radius-lg); background:linear-gradient(135deg,var(--surface-2),var(--surface)); }
.cta .btn{ align-self:flex-start; }
@media (min-width:640px){
  .how{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  .cta{ flex-direction:row; align-items:center; justify-content:space-between; }
}
@media (min-width:1024px){
  .card-row{ overflow:visible; }
  .card-row__list{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); }
}
/* Browse */
.icon--sm{ width:16px; height:16px; }
select{ font:inherit; }
.empty__actions{ display:flex; flex-wrap:wrap; gap:var(--space-3); }
#browse-root > h1{ margin-bottom:var(--space-4); }
.browse__layout{ display:block; }
.browse__side{ display:none; }
.browse__bar{ display:flex; flex-direction:column; gap:var(--space-3); }
.browse-search{ display:flex; gap:var(--space-2); }
.browse-search .btn{ padding-inline:var(--space-4); }
.browse__tools{ display:flex; align-items:flex-end; justify-content:space-between; gap:var(--space-3); }
.sortbox{ display:flex; flex-direction:column; gap:var(--space-1); flex:1 1 auto; min-width:0; max-width:240px; }
.flabel{ display:block; margin-bottom:var(--space-1); font-size:.875rem; font-weight:600; }
.sortbox .flabel{ margin-bottom:0; color:var(--muted); font-size:.8125rem; }
.ferror{ margin-top:var(--space-1); color:var(--danger); font-size:.8125rem; }
.field[aria-invalid="true"]{ border-color:var(--danger); }
.fchips{ display:flex; flex-wrap:wrap; align-items:center; gap:var(--space-2); margin-top:var(--space-3); }
.fchips:empty{ display:none; }
.chip--removable{ gap:var(--space-2); min-height:44px; padding:0 var(--space-3); background:var(--surface); color:var(--text); font:inherit; font-size:.875rem; cursor:pointer; transition:border-color .15s; }
.chip--removable:hover{ border-color:var(--accent); }
.link--btn{ padding:0 var(--space-2); border:0; background:none; font:inherit; font-weight:700; cursor:pointer; }
.results-head{ min-height:1.5em; margin-block:var(--space-4) var(--space-3); }
.filters{ display:flex; flex-direction:column; gap:var(--space-4); }
.filters__row2{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--space-3); }
.filters__actions{ display:flex; flex-wrap:wrap; gap:var(--space-3); }
.more{ display:flex; flex-direction:column; align-items:center; gap:var(--space-3); margin-top:var(--space-5); }
@media (min-width:1024px){
  .browse__layout{ display:grid; grid-template-columns:260px minmax(0,1fr); gap:var(--space-6); align-items:start; }
  .browse__side{ display:block; position:sticky; top:calc(var(--header-h) + var(--space-4)); padding:var(--space-4); border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); }
  .browse__side-title{ margin-bottom:var(--space-4); font-size:1.15rem; }
  [data-action="browse-open-filters"]{ display:none; }
  .browse__bar{ flex-direction:row; align-items:flex-end; }
  .browse-search{ flex:1; }
  .browse__tools{ flex:none; }
  .browse__main .card-grid{ grid-template-columns:repeat(3,minmax(0,1fr)); }
}
/* Listing page */
ol{ list-style:none; margin:0; padding:0; }
.listing{ padding-top:0; }
.breadcrumbs ol{ display:flex; flex-wrap:wrap; align-items:center; gap:0 var(--space-2); }
.breadcrumbs li{ display:flex; align-items:center; min-width:0; font-size:.875rem; }
.breadcrumbs li + li::before{ content:"\203A"; margin-right:var(--space-2); color:var(--muted); }
.breadcrumbs a{ display:inline-flex; align-items:center; min-height:44px; padding-inline:var(--space-2); color:var(--muted); }
.breadcrumbs a:hover{ color:var(--text); text-decoration:underline; }
.breadcrumbs [aria-current]{ max-width:60vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); }
.banner{ margin-bottom:var(--space-3); padding:var(--space-3) var(--space-4); border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); }
.banner--demo{ border-color:rgba(255,176,32,.45); background:rgba(255,176,32,.08); }
.banner--sold{ border-color:rgba(255,92,108,.45); background:rgba(255,92,108,.08); }
.banner--mod{ border-color:rgba(255,92,108,.6); background:rgba(255,92,108,.1); overflow-wrap:anywhere; }
.listing__grid{ display:grid; grid-template-columns:minmax(0,1fr); gap:var(--space-5); margin-top:var(--space-2); }

    const l = fresh().listings.find(function (x) { return x.id === id; });      // fresh: a moderator's change in another tab must apply at once
    if (l && (l.status === 'hidden' || l.status === 'removed')) {            // V12: only the owner and admins can open these (5.3)
      const sess = await api.getSession();
      if (sess && (sess.id === l.sellerId || sess.role === 'admin')) return clone(l);
      throw new SzError('NOT_FOUND', 'That listing could not be found.');
    }
    if (!l || !categoryOn(l.category) || (l.status !== 'active' && l.status !== 'sold')) {
      throw new SzError('NOT_FOUND', 'That listing could not be found.');
    }
    return clone(l);
  };

  // Public fields only. Never email, role or any contact detail.
  api.getSellerPublic = async function (id) {
    const u = db().users.find(function (x) { return x.id === id; });
    if (!u) throw new SzError('NOT_FOUND', 'That seller could not be found.');
    const active = db().listings.filter(function (l) { return l.sellerId === id && l.status === 'active' && categoryOn(l.category); }).length;
    return {
      id: u.id, displayName: u.displayName, bio: u.bio || '', province: u.province || '', city: u.city || '',
      sellerType: u.sellerType, createdAt: u.createdAt, isDemo: !!u.isDemo, activeListings: active,
    };
  };

  // Verified, currently running feature windows for publicly visible active listings.
  api.getActiveFeatures = async function () {
    const now = Date.now();
    const visible = {};
    db().listings.forEach(function (l) { if (l.status === 'active' && categoryOn(l.category)) visible[l.id] = true; });
    return db().features.filter(function (f) {
      return f.verifiedBy && visible[f.listingId] && Date.parse(f.startsAt) <= now && now < Date.parse(f.endsAt);
    }).map(function (f) { return { listingId: f.listingId, startsAt: f.startsAt, endsAt: f.endsAt }; });
  };

  // Every WRITE re-reads the stored data first and then saves it, so a second open tab (or a hand edit) is never overwritten
  // by an older in-memory copy. V06+ writes must go through fresh() too.
  function fresh() {
    const stored = SZ.store.get('db', null);
    if (stored && Array.isArray(stored.listings) && Array.isArray(stored.users) && Array.isArray(stored.features)) cache = stored;
    return db();
  }
  // Counts one view of an active, publicly visible listing. The view layer calls it at most once per listing per session
  // (a session = one page load). The Supabase adapter will do the same with a small database function (V19).
  api.recordView = async function (id) {
    const d = fresh();
    const l = d.listings.find(function (x) { return x.id === id; });
    if (!l || l.status !== 'active' || !categoryOn(l.category)) return;
    l.views = (Number(l.views) || 0) + 1;
    SZ.store.set('db', d);
  };

  // Dev tools (CONFIG.DEV only): every record regardless of status/category, and a demo-data reset
  // that replaces only isDemo records and keeps anything real users created.
  api.devAllListings = async function () {
    if (!SZ.config.DEV) throw new SzError('FORBIDDEN', 'Dev tools are off.');
    return clone(db().listings);
  };
  api.devResetDemo = async function () {
    if (!SZ.config.DEV) throw new SzError('FORBIDDEN', 'Dev tools are off.');
    const d = fresh();
    const fresh2 = SZ.seed.generate(Date.now());
    d.users = d.users.filter(function (u) { return !u.isDemo; }).concat(fresh2.users);
    d.listings = d.listings.filter(function (l) { return !l.isDemo; }).concat(fresh2.listings);
    d.features = d.features.filter(function (f) { return !f.isDemo; }).concat(fresh2.features);
    d.seededAt = fresh2.seededAt;
    if (Array.isArray(d.reports)) d.reports = d.reports.filter(function (r) { return d.listings.some(function (l) { return l.id === r.listingId; }); });   // reports about replaced demo listings
    SZ.store.set('db', d);
  };

  /* ---------- V06: prototype accounts (local only) ----------
     Passwords: PBKDF2-SHA256 + a random per-user salt via SubtleCrypto; only the hash and salt are stored, never the password.
     The session is { userId } under store key "session". Throttle: 5 wrong passwords for one email -> 30 s wait. This is client-side
     and NOT real security (anyone can edit local storage); real auth arrives with Supabase in V18. */
  const PBKDF2_ITER = 100000;
  const b64 = function (buf) { let t = ''; new Uint8Array(buf).forEach(function (b) { t += String.fromCharCode(b); }); return btoa(t); };
  const unb64 = function (t) { return Uint8Array.from(atob(t), function (c) { return c.charCodeAt(0); }); };
  const randHex = function (n) { return Array.from(window.crypto.getRandomValues(new Uint8Array(n)), function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); };
  async function derive(password, salt, iter) {
    const subtle = window.crypto && window.crypto.subtle;
    if (!subtle) throw new SzError('UNKNOWN', "This browser can't keep passwords safe here. Open Spawnza in Chrome.");
    const key = await subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    return b64(await subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: salt, iterations: iter }, key, 256));
  }
  const sessionUser = function (u) { return { id: u.id, displayName: u.displayName, role: u.role, createdAt: u.createdAt }; };   // never email / password data

  api.getSession = async function () {
    const s = SZ.store.get('session', null);
    if (!s || !s.userId) return null;
    const u = fresh().users.find(function (x) { return x.id === s.userId && x.pw; });
    if (!u) { SZ.store.remove('session'); return null; }
    return sessionUser(u);
  };
  api.signUp = async function (input) {
    const i = input || {};
    const errs = SZ.validate.signUp(i);
    if (Object.keys(errs).length) throw Object.assign(new SzError('VALIDATION', 'Please fix the highlighted fields.'), { fields: errs });
    const email = SZ.validate.cleanEmail(i.email);
    const salt = window.crypto.getRandomValues(new Uint8Array(16));
    const hash = await derive(String(i.password), salt, PBKDF2_ITER);
    const d = fresh();                                   // every write starts with fresh()
    if (d.users.some(function (u) { return u.email === email; })) {
      const m = 'An account with that email already exists. Try logging in.';
      throw Object.assign(new SzError('VALIDATION', m), { fields: { email: m } });
    }
    const user = {
      id: 'u-' + randHex(8), email: email, displayName: SZ.validate.cleanName(i.displayName), bio: '', province: '', city: '',
      sellerType: 'individual', role: email === String(SZ.config.DEMO_ADMIN_EMAIL).toLowerCase() ? 'admin' : 'user',
      createdAt: new Date().toISOString(), isDemo: false,
      pw: { algo: 'PBKDF2-SHA256', iter: PBKDF2_ITER, salt: b64(salt), hash: hash },
    };
    d.users.push(user);
    SZ.store.set('db', d);
    SZ.store.set('session', { userId: user.id });
    return sessionUser(user);
  };
  api.signIn = async function (input) {
    const email = SZ.validate.cleanEmail(input && input.email), password = String((input && input.password) || '');
    const key = 'k:' + email, th = SZ.store.get('throttle', {}), rec = th[key] || { n: 0, until: 0 };
    const wait = Math.ceil((rec.until - Date.now()) / 1000);
    if (wait > 0) throw new SzError('RATE_LIMIT', 'Too many tries. Wait ' + wait + ' seconds and try again.');
    const u = fresh().users.find(function (x) { return x.email === email && x.pw; });
    const hash = await derive(password, u ? unb64(u.pw.salt) : new Uint8Array(16), u ? u.pw.iter : PBKDF2_ITER);   // same work whether or not the email exists
    let ok = !!u && hash.length === u.pw.hash.length, diff = 0;
    if (ok) { for (let k = 0; k < hash.length; k++) diff |= hash.charCodeAt(k) ^ u.pw.hash.charCodeAt(k); ok = diff === 0; }
    if (!ok) {
      rec.n += 1;
      if (rec.n >= 5) { rec.n = 0; rec.until = Date.now() + 30000; }
      th[key] = rec; SZ.store.set('throttle', th);
      throw new SzError('AUTH_REQUIRED', 'Email or password is incorrect.');   // never says which one
    }
    delete th[key]; SZ.store.set('throttle', th);
    SZ.store.set('session', { userId: u.id });
    return sessionUser(u);
  };
  api.signOut = async function () { SZ.store.remove('session'); };

  // V07: creates an active listing for the logged-in user. sellerId always comes from the session, never from the input.
  api.createListing = async function (draft) {
    const sess = await api.getSession();
    if (!sess) throw new SzError('AUTH_REQUIRED', 'Log in to post a listing.');
    const x = draft || {}, errs = SZ.validate.listing(x);
    if (Object.keys(errs).length) throw Object.assign(new SzError('VALIDATION', 'Please fix the highlighted fields.'), { fields: errs });
    const d = fresh(), L = SZ.config.LIMITS, since = Date.now() - 24 * 3600 * 1000;
    const recent = d.listings.filter(function (l) { return l.sellerId === sess.id && Date.parse(l.createdAt) > since; }).length;
    if (recent >= L.LISTINGS_PER_24H) throw new SzError('RATE_LIMIT', "You've reached today's limit of " + L.LISTINGS_PER_24H + ' listings. Try again tomorrow.');
    const pids = Array.from(new Set(x.photoIds.map(String)));   // V08: photos must be staged by this user and not yet attached
    const recs = await Promise.all(pids.map(function (p) { return SZ.store.blobs.get(p); }));
    if (pids.length !== x.photoIds.length || recs.some(function (r) { return !r || r.ownerId !== sess.id || r.listingId; })) {
      const m = 'One of your photos is missing. Please add it again.';
      throw Object.assign(new SzError('VALIDATION', m), { fields: { photos: m } });
    }
    const now = new Date().toISOString();
    const l = {
      id: 'l-' + randHex(6), sellerId: sess.id, title: SZ.validate.cleanName(x.title), description: SZ.validate.cleanDesc(x.description),
      category: x.category, condition: x.condition, priceZAR: parseInt(String(x.price).replace(/\s/g, ''), 10), negotiable: !!x.negotiable,
      province: x.province, city: SZ.validate.cleanName(x.city), photoIds: pids, status: 'active', isDemo: false,
      createdAt: now, updatedAt: now, soldAt: null, views: 0,
    };
    try { await Promise.all(recs.map(function (r) { return SZ.store.blobs.put(Object.assign({}, r, { listingId: l.id })); })); }
    catch (e) { throw new SzError('UNKNOWN', 'Could not save the photos. Please try again.'); }
    d.listings.push(l);
    SZ.store.set('db', d);
    return clone(l);
  };

  /* V08 photos. Blobs are re-checked here (magic bytes, JPEG/WebP, <= PHOTO_MAX_KB), not only in the UI.
     addPhotos(listingId, blobs) -> ids. listingId null = "staged" for a listing being written (Sell flow); createListing attaches them. */
  api.addPhotos = async function (listingId, list) {
    const sess = await api.getSession(), L = SZ.config.LIMITS;
    if (!sess) throw new SzError('AUTH_REQUIRED', 'Log in to add photos.');
    const arr = Array.isArray(list) ? list : [], d = fresh(), l = listingId ? d.listings.find(function (z) { return z.id === listingId; }) : null;
    if (listingId && !l) throw new SzError('NOT_FOUND', 'That listing was not found.');
    if (l && l.sellerId !== sess.id) throw new SzError('FORBIDDEN', 'You can only change your own listings.');
    if (l && l.photoIds.length + arr.length > L.PHOTOS[1]) throw new SzError('VALIDATION', 'A listing can have up to ' + L.PHOTOS[1] + ' photos.');
    for (const b of arr) {
      const t = b && typeof b.slice === 'function' ? SZ.pure.sniffImage(new Uint8Array(await b.slice(0, 16).arrayBuffer())) : null;
      if (t !== 'jpeg' && t !== 'webp') throw new SzError('VALIDATION', 'Photos must be JPEG or WebP.');
      if (b.size > L.PHOTO_MAX_KB * 1024) throw new SzError('VALIDATION', 'A photo is bigger than ' + L.PHOTO_MAX_KB + ' KB.');
    }
    const ids = [];
    try {
      for (const b of arr) { const id = 'ph-' + randHex(6); await SZ.store.blobs.put({ id: id, ownerId: sess.id, listingId: listingId || null, blob: b, size: b.size, createdAt: Date.now() }); ids.push(id); }
    } catch (e) {
      await Promise.all(ids.map(function (id) { return SZ.store.blobs.del(id).catch(function () {}); }));
      throw new SzError('UNKNOWN', e && e.name === 'QuotaExceededError' ? 'Your phone has no room left for photos. Free some space and try again.' : 'Could not save the photo. Please try again.');
    }
    if (l) { l.photoIds = l.photoIds.concat(ids); l.updatedAt = new Date().toISOString(); SZ.store.set('db', d); }
    return ids;
  };
  api.removePhoto = async function (photoId) {
    const sess = await api.getSession(), id = String(photoId);
    if (!sess) throw new SzError('AUTH_REQUIRED', 'Log in to change photos.');
    const rec = await SZ.store.blobs.get(id);
    if (!rec) return;
    if (rec.ownerId !== sess.id) throw new SzError('FORBIDDEN', 'You can only change your own photos.');
    if (rec.listingId) {
      const d = fresh(), l = d.listings.find(function (z) { return z.id === rec.listingId; });
      if (l) {
        if (l.photoIds.length <= SZ.config.LIMITS.PHOTOS[0]) throw new SzError('VALIDATION', 'A listing needs at least one photo.');
        l.photoIds = l.photoIds.filter(function (x) { return x !== id; }); SZ.store.set('db', d);
      }
    }
    await SZ.store.blobs.del(id);
  };
  api.getPhotoBlob = async function (photoId) { const r = await SZ.store.blobs.get(String(photoId)); return r ? r.blob : null; };   // photos are public to read

  /* V09 owner methods. Ownership is enforced HERE (FORBIDDEN), never only in the UI. Hidden/removed listings are read-only for their owner. */
  async function mine(id) {
    const sess = await api.getSession();
    if (!sess) throw new SzError('AUTH_REQUIRED', 'Log in to manage your listings.');
    const d = fresh(), l = d.listings.find(function (z) { return z.id === id; });
    if (!l) throw new SzError('NOT_FOUND', 'That listing could not be found.');
    if (l.sellerId !== sess.id) throw new SzError('FORBIDDEN', 'You can only change your own listings.');
    return { d: d, l: l };
  }
  function editable(l) { if (l.status !== 'active' && l.status !== 'sold') throw new SzError('FORBIDDEN', 'This listing is under review and cannot be changed.'); }
  api.listMyListings = async function () {
    const sess = await api.getSession();
    if (!sess) throw new SzError('AUTH_REQUIRED', 'Log in to see your listings.');
    return clone(db().listings.filter(function (z) { return z.sellerId === sess.id; }).sort(function (a, b) { return created(b) - created(a); }));
  };
  api.getMyListing = async function (id) { return clone((await mine(id)).l); };
  api.updateListing = async function (id, draft) {
    const m = await mine(id), l = m.l, x = draft || {};
    editable(l);
    const same = Array.isArray(x.photoIds) && x.photoIds.length === l.photoIds.length && new Set(x.photoIds).size === l.photoIds.length && x.photoIds.every(function (p) { return l.photoIds.indexOf(p) !== -1; });
    const order = same ? x.photoIds.slice() : l.photoIds.slice();   // photos are added/removed through addPhotos/removePhoto; here only the order can change
    const errs = SZ.validate.listing(Object.assign({}, x, { photoIds: order }));
    if (Object.keys(errs).length) throw Object.assign(new SzError('VALIDATION', 'Please fix the highlighted fields.'), { fields: errs });
    Object.assign(l, { title: SZ.validate.cleanName(x.title), description: SZ.validate.cleanDesc(x.description), category: x.category, condition: x.condition,
      priceZAR: parseInt(String(x.price).replace(/\s/g, ''), 10), negotiable: !!x.negotiable, province: x.province, city: SZ.validate.cleanName(x.city), photoIds: order, updatedAt: new Date().toISOString() });
    SZ.store.set('db', m.d);
    return clone(l);
  };
  api.setListingStatus = async function (id, status) {
    if (status !== 'active' && status !== 'sold') throw new SzError('VALIDATION', 'Choose active or sold.');
    const m = await mine(id);
    editable(m.l);
    m.l.status = status; m.l.soldAt = status === 'sold' ? new Date().toISOString() : null; m.l.updatedAt = new Date().toISOString();
    SZ.store.set('db', m.d);
    return clone(m.l);
  };
  api.deleteListing = async function (id) {
    const m = await mine(id);
    editable(m.l);
    await Promise.all(m.l.photoIds.map(function (p) { return SZ.store.blobs.del(p).catch(function () {}); }));
    m.d.listings = m.d.listings.filter(function (z) { return z.id !== id; });
    Object.keys(m.d).forEach(function (k) { if (k !== 'listings' && k !== 'users' && k !== 'modlog' && Array.isArray(m.d[k])) m.d[k] = m.d[k].filter(function (r) { return !r || r.listingId !== id; }); });
    SZ.store.set('db', m.d);
  };

  /* V10 profile methods. Both act only on the logged-in user (the id comes from the session, never from the input).
     updateProfile(patch) changes displayName, bio, province, city and sellerType only; email, role, password data, id and createdAt can never be set here.
     Fields left out of the patch keep their stored value. Returns the public seller fields.
     deleteMyAccount() is a PROPOSED contract addition (V19 maps it to the delete_my_account() RPC). */
  api.updateProfile = async function (patch) {
    const sess = await api.getSession();
    if (!sess) throw new SzError('AUTH_REQUIRED', 'Log in to edit your profile.');
    const x = patch || {}, d = fresh(), u = d.users.find(function (z) { return z.id === sess.id; });
    if (!u) throw new SzError('NOT_FOUND', 'Your account could not be found.');
    const has = function (k) { return Object.prototype.hasOwnProperty.call(x, k); };
    const next = {
      displayName: has('displayName') ? x.displayName : u.displayName, bio: has('bio') ? x.bio : u.bio,
      province: has('province') ? x.province : u.province, city: has('city') ? x.city : u.city, sellerType: has('sellerType') ? x.sellerType : u.sellerType,
    };
    const errs = SZ.validate.profile(next);
    if (Object.keys(errs).length) throw Object.assign(new SzError('VALIDATION', 'Please fix the highlighted fields.'), { fields: errs });
    const prov = next.province == null ? '' : String(next.province);
    u.displayName = SZ.validate.cleanName(next.displayName); u.bio = SZ.validate.cleanDesc(next.bio);
    u.province = prov; u.city = prov ? SZ.validate.cleanName(next.city) : ''; u.sellerType = next.sellerType;
    SZ.store.set('db', d);
    return api.getSellerPublic(u.id);
  };
  /* V11 contact methods. The private record { userId, whatsappE164, whatsappConsent } is never part of a public read.
     updatePrivateContact({ whatsapp, consent }): own record only; consent must be exactly true; consent needs a valid number. Returns { whatsapp: E.164 | '', consent }.
     getMyPrivateContact(): the owner's own settings, for the Profile form (PROPOSED contract addition; V22 reads profile_private under RLS).
     getSellerContact(listingId) -> { whatsapp } | null, mirrors the get_seller_whatsapp RPC in Appendix C: needs a login, the listing must be
     active, the seller must have consented and have a number. It reads fresh data, so a seller who switches sharing off in another tab is honoured at once.
     NOTE: the prototype keeps everything on this device, so this is NOT real access control; real enforcement arrives in V22. */
  api.updatePrivateContact = async function (input) {
    const sess = await api.getSession();
    if (!sess) throw new SzError('AUTH_REQUIRED', 'Log in to change your contact settings.');
    const x = input || {}, errs = SZ.validate.contact(x);
    if (Object.keys(errs).length) throw Object.assign(new SzError('VALIDATION', 'Please fix the highlighted fields.'), { fields: errs });
    const e164 = SZ.pure.normalizePhone(x.whatsapp), consent = x.consent === true && !!e164;
    const d = fresh(); if (!Array.isArray(d.private)) d.private = [];
    const rec = d.private.find(function (r) { return r.userId === sess.id; });
    if (rec) { rec.whatsappE164 = e164 || ''; rec.whatsappConsent = consent; }
    else d.private.push({ userId: sess.id, whatsappE164: e164 || '', whatsappConsent: consent });
    SZ.store.set('db', d);
    return { whatsapp: e164 || '', consent: consent };
  };
  api.getMyPrivateContact = async function () {
    const sess = await api.getSession();
    if (!sess) throw new SzError('AUTH_REQUIRED', 'Log in to see your contact settings.');
    const rec = (fresh().private || []).find(function (r) { return r.userId === sess.id; });
    return { whatsapp: rec && rec.whatsappE164 ? rec.whatsappE164 : '', consent: !!(rec && rec.whatsappConsent && rec.whatsappE164) };
  };
  api.getSellerContact = async function (listingId) {
    const sess = await api.getSession();
    if (!sess) throw new SzError('AUTH_REQUIRED', 'Log in to contact the seller.');
    const d = fresh(), l = d.listings.find(function (z) { return z.id === listingId; });
    if (!l || l.status !== 'active' || l.isDemo) return null;
    const rec = (d.private || []).find(function (r) { return r.userId === l.sellerId; });
    return rec && rec.whatsappConsent === true && rec.whatsappE164 ? { whatsapp: rec.whatsappE164 } : null;
  };
  api.deleteMyAccount = async function () {
    const sess = await api.getSession();
    if (!sess) throw new SzError('AUTH_REQUIRED', 'Log in to delete your account.');
    const d = fresh(), u = d.users.find(function (z) { return z.id === sess.id; });
    if (!u) throw new SzError('NOT_FOUND', 'Your account could not be found.');
    const mine = d.listings.filter(function (l) { return l.sellerId === sess.id; }), gone = {}, photos = [];
    mine.forEach(function (l) { gone[l.id] = true; (l.photoIds || []).forEach(function (p) { photos.push(p); }); });
    await Promise.all(photos.map(function (p) { return SZ.store.blobs.del(p).catch(function () {}); }));
    d.listings = d.listings.filter(function (l) { return l.sellerId !== sess.id; });
    Object.keys(d).forEach(function (k) { if (k !== 'listings' && k !== 'users' && k !== 'private' && k !== 'modlog' && Array.isArray(d[k])) d[k] = d[k].filter(function (r) { return !r || !gone[r.listingId]; }); });
    d.users = d.users.filter(function (z) { return z.id !== sess.id; });
    if (Array.isArray(d.private)) d.private = d.private.filter(function (r) { return r.userId !== sess.id; });
    if (Array.isArray(d.reports)) d.reports = d.reports.filter(function (r) { return r.reporterId !== sess.id; });   // reports they sent go with the account
    SZ.store.set('db', d);
    SZ.store.remove('session'); SZ.store.remove('selldraft:' + sess.id);
  };

  /* V12 reporting and moderation. Every admin method checks the role INSIDE the adapter, from the stored user record (never from the page): FORBIDDEN otherwise.
     createReport({ listingId, reason, details }): logged in; not your own listing; one report per user per listing (a polite refusal, as in the unique
     constraint in Appendix C); at most 10 reports per user per 24 h (RATE_LIMIT). Reporters' names are only ever returned to admins.
     adminSetListingStatus(id, 'hidden'|'removed'|'active', note): 'active' means RESTORE (a listing that was sold when it was hidden comes back as sold).
     Every admin action needs a note of 5 to 300 characters and writes a moderation-log entry. The note is also kept on the listing as moderationNote while it
     is hidden or removed, so the owner can see it (the V09 dashboard already shows it). Nothing here hides a listing automatically. */
  async function adminOnly() {
    const sess = await api.getSession();
    if (!sess) throw new SzError('AUTH_REQUIRED', 'Log in to continue.');
    if (sess.role !== 'admin') throw new SzError('FORBIDDEN', 'Only moderators can do this.');
    return sess;
  }
  const nameOf = function (d, id) { const u = d.users.find(function (z) { return z.id === id; }); return u ? u.displayName : 'Deleted user'; };
  api.createReport = async function (input) {
    const sess = await api.getSession();
    if (!sess) throw new SzError('AUTH_REQUIRED', 'Log in to report a listing.');
    const x = input || {}, errs = SZ.validate.report(x);
    if (Object.keys(errs).length) throw Object.assign(new SzError('VALIDATION', 'Please fix the highlighted fields.'), { fields: errs });
    const d = fresh(), l = d.listings.find(function (z) { return z.id === x.listingId; });
    if (!l || (l.status !== 'active' && l.status !== 'sold')) throw new SzError('NOT_FOUND', 'That listing could not be found.');
    if (l.sellerId === sess.id) throw new SzError('FORBIDDEN', 'You cannot report your own listing.');
    if (!Array.isArray(d.reports)) d.reports = [];
    if (d.reports.some(function (r) { return r.listingId === l.id && r.reporterId === sess.id; })) {
      throw new SzError('VALIDATION', 'You have already reported this listing. Thank you, we will review it.');
    }
    const since = Date.now() - 86400000;
    if (d.reports.filter(function (r) { return r.reporterId === sess.id && Date.parse(r.createdAt) > since; }).length >= 10) {
      throw new SzError('RATE_LIMIT', 'You have sent a lot of reports today. Please try again tomorrow.');
    }
    const r = { id: 'r-' + randHex(6), listingId: l.id, reporterId: sess.id, reason: x.reason, details: SZ.validate.cleanDesc(x.details), status: 'open',
      createdAt: new Date().toISOString(), resolvedBy: null, resolvedAt: null, resolutionNote: null };
    d.reports.push(r);
    SZ.store.set('db', d);
    return { id: r.id, status: r.status };
  };
  api.listReports = async function (filter) {
    await adminOnly();
    const d = fresh(), f = filter || {}, reports = d.reports || [], open = {};
    reports.forEach(function (r) { if (r.status === 'open') open[r.listingId] = (open[r.listingId] || 0) + 1; });
    return reports.filter(function (r) { return (!f.status || r.status === f.status) && (!f.listingId || r.listingId === f.listingId); })
      .sort(function (a, b) { return Date.parse(b.createdAt) - Date.parse(a.createdAt) || (a.id < b.id ? -1 : 1); }).slice(0, 200).map(function (r) {
        const l = d.listings.find(function (z) { return z.id === r.listingId; });
        return Object.assign({}, clone(r), { reporterName: nameOf(d, r.reporterId), resolvedByName: r.resolvedBy ? nameOf(d, r.resolvedBy) : '',
          openOnListing: open[r.listingId] || 0, flagged: (open[r.listingId] || 0) >= 3,
          listing: l ? { exists: true, id: l.id, title: l.title, status: l.status, isDemo: !!l.isDemo, sellerName: nameOf(d, l.sellerId) } : { exists: false, id: r.listingId, title: '', status: '', isDemo: false, sellerName: '' } });
      });
  };
  api.resolveReport = async function (id, action, note) {
    const sess = await adminOnly();
    if (action !== 'dismissed' && action !== 'actioned') throw new SzError('VALIDATION', 'Choose dismissed or actioned.');
    const bad = SZ.validate.modNote(note);
    if (bad) throw Object.assign(new SzError('VALIDATION', bad), { fields: { note: bad } });
    const d = fresh(), r = (d.reports || []).find(function (z) { return z.id === id; });
    if (!r) throw new SzError('NOT_FOUND', 'That report could not be found.');
    if (r.status !== 'open') throw new SzError('VALIDATION', 'This report has already been ' + r.status + '.');
    const now = new Date().toISOString(), n = SZ.validate.cleanName(note);
    r.status = action; r.resolvedBy = sess.id; r.resolvedAt = now; r.resolutionNote = n;
    if (!Array.isArray(d.modlog)) d.modlog = [];
    d.modlog.push({ id: 'm-' + randHex(6), adminId: sess.id, action: action === 'dismissed' ? 'dismiss_report' : 'action_report', listingId: r.listingId, reportId: r.id, note: n, createdAt: now });
    SZ.store.set('db', d);
    return clone(r);
  };
  api.adminSetListingStatus = async function (id, status, note) {
    const sess = await adminOnly();
    if (status !== 'hidden' && status !== 'removed' && status !== 'active') throw new SzError('VALIDATION', 'Choose hidden, removed or active.');
    const bad = SZ.validate.modNote(note);
    if (bad) throw Object.assign(new SzError('VALIDATION', bad), { fields: { note: bad } });
    const d = fresh(), l = d.listings.find(function (z) { return z.id === id; });
    if (!l) throw new SzError('NOT_FOUND', 'That listing could not be found.');
    const from = l.status, live = from === 'active' || from === 'sold', n = SZ.validate.cleanName(note), now = new Date().toISOString();
    if (status === 'hidden' && !live) throw new SzError('VALIDATION', 'This listing is already ' + from + '.');
    if (status === 'removed' && from === 'removed') throw new SzError('VALIDATION', 'This listing is already removed.');
    if (status === 'active' && live) throw new SzError('VALIDATION', 'This listing is already live.');
    if (status === 'active') { l.status = l.prevStatus === 'sold' ? 'sold' : 'active'; l.prevStatus = null; l.moderationNote = null; }
    else { if (live) l.prevStatus = from; l.status = status; l.moderationNote = n; }
    l.updatedAt = now;
    if (!Array.isArray(d.modlog)) d.modlog = [];
    d.modlog.push({ id: 'm-' + randHex(6), adminId: sess.id, action: status === 'active' ? 'restore' : status === 'hidden' ? 'hide' : 'remove', listingId: l.id, reportId: null, note: n, createdAt: now });
    SZ.store.set('db', d);
    return clone(l);
  };
  api.listModerationLog = async function () {
    await adminOnly();
    const d = fresh();
    return (d.modlog || []).slice().sort(function (a, b) { return Date.parse(b.createdAt) - Date.parse(a.createdAt) || (a.id < b.id ? 1 : -1); }).slice(0, 200).map(function (m) {
      const l = d.listings.find(function (z) { return z.id === m.listingId; });
      return Object.assign({}, clone(m), { adminName: nameOf(d, m.adminId), listingTitle: l ? l.title : '', listingExists: !!l });
    });
  };
  // PROPOSED contract addition: admin search over every listing (any status). V19 maps it to a select under the admin RLS policy.
  api.adminListListings = async function (opts) {
    await adminOnly();
    const d = fresh(), o = opts || {}, tokens = normalizeText(o.q).split(/\s+/).filter(Boolean), open = {};
    (d.reports || []).forEach(function (r) { if (r.status === 'open') open[r.listingId] = (open[r.listingId] || 0) + 1; });
    const items = d.listings.filter(function (l) {
      if (o.status && o.status !== 'all' && l.status !== o.status) return false;
      const hay = normalizeText(l.title + ' ' + l.id + ' ' + nameOf(d, l.sellerId));
      return tokens.every(function (t) { return hay.indexOf(t) !== -1; });
    }).sort(function (a, b) { return created(b) - created(a) || (a.id < b.id ? -1 : 1); });
    const size = Math.min(100, Math.max(1, Math.floor(Number(o.pageSize)) || SZ.config.PAGE_SIZE)), page = Math.max(1, Math.floor(Number(o.page)) || 1);
    return { total: items.length, items: items.slice((page - 1) * size, page * size).map(function (l) {
      return { id: l.id, title: l.title, status: l.status, priceZAR: l.priceZAR, isDemo: !!l.isDemo, createdAt: l.createdAt, moderationNote: l.moderationNote || '',
        sellerId: l.sellerId, sellerName: nameOf(d, l.sellerId), openReports: open[l.id] || 0, flagged: (open[l.id] || 0) >= 3 };
    }) };
  };

  return api;
})();

/* ===== SZ:ART ===== */
/* Procedural placeholder artwork: art(categorySlug, seed, label) -> SVG data URI. Deterministic from the seed. */
SZ.art = (function () {
  const COLOURS = {
    'consoles': ['#1c3d63', '#0d1b2e'], 'games': ['#46245f', '#1b0f27'], 'accessories': ['#1f5a45', '#0d2a20'],
    'pc-gaming': ['#5c4220', '#2a1d0d'], 'phones': ['#5c2046', '#2a0d20'], 'other-electronics': ['#20485c', '#0d222a'],
  };
  function hash(s) {
    let h = 2166136261;
    s = String(s);
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  return function art(categorySlug, seed, label) {
    const cat = SZ.config.CATEGORIES.find(function (c) { return c.slug === categorySlug; });
    const col = COLOURS[categorySlug] || ['#2b323b', '#161a1f'];
    const h = hash(categorySlug + '|' + seed);
    const angle = h % 360;
    const cx = 40 + (h >>> 3) % 320;
    const cy = 30 + (h >>> 7) % 240;
    const r = 60 + (h >>> 11) % 90;
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">' +
      '<defs><linearGradient id="g" gradientTransform="rotate(' + angle + ' .5 .5)"><stop offset="0" stop-color="' + col[0] + '"/><stop offset="1" stop-color="' + col[1] + '"/></linearGradient></defs>' +
      '<rect width="400" height="300" fill="url(#g)"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#ffffff" fill-opacity=".05"/>' +
      '<text x="200" y="170" font-size="96" text-anchor="middle">' + esc(cat ? cat.icon : '📦') + '</text>' +
      '<text x="200" y="278" font-size="14" font-weight="700" letter-spacing="3" text-anchor="middle" fill="#ffffff" fill-opacity=".35" font-family="sans-serif">' + esc(String(label || 'Demo photo').toUpperCase()) + '</text></svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  };
})();

/* ===== SZ:UI ===== */
SZ.ui = (function () {
  const ui = { actions: {}, forms: {} };   // additive registries: later versions add their own entries
  const $ = function (sel, root) { return (root || document).querySelector(sel); };
  const $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

  ui.icon = function (name, extraClass) {
    return '<svg class="icon' + (extraClass ? ' ' + esc(extraClass) : '') + '" aria-hidden="true" focusable="false"><use href="#i-' + esc(name) + '"/></svg>';
  };

  /* Shell: navigation is rendered from SZ.config.NAV so the three menus never drift apart. */
  /* V06: the Account item follows the session: "Log in" (-> #/login) when signed out, "Account" (-> #/account) when signed in. */
  ui.navItems = function () {
    const signedIn = !!(SZ.auth && SZ.auth.user);
    return SZ.config.NAV.map(function (n) {
      return n.id === 'account' ? Object.assign({}, n, signedIn ? { label: 'Account', href: '#/account' } : { label: 'Log in', href: '#/login' }) : n;
    });
  };
  ui.syncAuth = function () { ui.renderShell(); ui.setActiveNav(ui.activeNav || null); };
  ui.renderShell = function () {
    const nav = ui.navItems();
    $('#sz-nav-desktop').innerHTML = nav.filter(function (n) { return n.desktop; }).map(function (n) {
      const cls = n.desktop === 'button' ? 'btn btn--primary' : 'nav-link';
      return '<li><a class="' + cls + '" href="' + esc(n.href) + '" data-nav="' + esc(n.id) + '">' + esc(n.label) + '</a></li>';
    }).join('');
    $('#sz-tabbar').innerHTML = nav.filter(function (n) { return n.tab; }).map(function (n) {
      if (n.id === 'sell') {
        return '<li class="tabbar__sell"><a href="' + esc(n.href) + '" data-nav="sell"><span class="sell-bubble">' + ui.icon('plus') + '</span><span>' + esc(n.label) + '</span></a></li>';
      }
      return '<li><a href="' + esc(n.href) + '" data-nav="' + esc(n.id) + '">' + ui.icon(n.icon) + '<span>' + esc(n.label) + '</span></a></li>';
    }).join('');
    $('#sz-stamp').textContent = 'Prototype ' + SZ.config.VERSION + ' · demo data';
    ui.syncBanner();
  };

  ui.setActiveNav = function (id) {
    ui.activeNav = id;
    $$('[data-nav]').forEach(function (a) {
      if (id && a.getAttribute('data-nav') === id) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
  };

  ui.syncBanner = function () {
    const el = $('#sz-banner');
    if (!el) return;
    if (SZ.store.mode === 'memory') {
      el.textContent = "Preview mode — changes won't be saved. Open the downloaded file in Chrome to test saving.";
      el.hidden = false;
    } else {
      el.textContent = '';
      el.hidden = true;
    }
  };

  /* Toast: plain text only (textContent), announced through the aria-live region. */
  ui.toast = function (message, opts) {
    const o = Object.assign({ type: 'info', duration: 4000 }, opts || {});
    const host = $('#sz-toasts');
    if (!host) return null;
    const el = document.createElement('div');
    el.className = 'toast toast--' + o.type;
    el.textContent = String(message);
    host.appendChild(el);
    while (host.children.length > 3) host.removeChild(host.firstChild);
    window.requestAnimationFrame(function () { el.classList.add('is-in'); });
    const remove = function () {
      el.classList.remove('is-in');
      window.setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 220);
    };
    window.setTimeout(remove, o.type === 'error' ? Math.max(o.duration, 6000) : o.duration);
    return el;
  };

  /* Modal / sheet. bodyHtml is inserted as HTML, so callers must pass any user text through esc() first. */
  let activeModal = null;
  const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
  function focusables(root) {
    return $$(FOCUSABLE, root).filter(function (el) { return el.offsetParent !== null || el === document.activeElement; });
  }
  ui.modal = {
    open: function (opts) {
      const o = Object.assign({ title: '', bodyHtml: '', dismissible: true, onClose: null }, opts || {});
      const opener = activeModal ? activeModal.opener : document.activeElement;
      if (activeModal) ui.modal.close({ restoreFocus: false });
      const root = document.createElement('div');
      root.className = 'modal-backdrop';
      root.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="sz-modal-title" tabindex="-1">' +
        '<div class="modal__head"><h2 class="modal__title" id="sz-modal-title">' + esc(o.title) + '</h2>' +
        '<button type="button" class="icon-btn" data-action="close-modal" aria-label="Close">' + ui.icon('close') + '</button></div>' +
        '<div class="modal__body">' + o.bodyHtml + '</div></div>';
      document.body.appendChild(root);
      const app = $('#app');
      if (app) app.setAttribute('inert', '');
      document.documentElement.classList.add('modal-open');
      const dialog = $('.modal', root);
      root.addEventListener('click', function (e) {
        if (e.target === root && o.dismissible) ui.modal.close();
        else if (e.target.closest && e.target.closest('a[href]')) ui.modal.close();   // navigating away closes it
      });
      activeModal = { root: root, dialog: dialog, opener: opener, onClose: o.onClose, dismissible: o.dismissible };
      window.requestAnimationFrame(function () { root.classList.add('is-in'); });
      dialog.focus();
      return dialog;
    },
    close: function (opts) {
      if (!activeModal) return;
      const m = activeModal;
      activeModal = null;
      if (m.root.parentNode) m.root.parentNode.removeChild(m.root);
      const app = $('#app');
      if (app) app.removeAttribute('inert');
      document.documentElement.classList.remove('modal-open');
      if (!opts || opts.restoreFocus !== false) {
        if (m.opener && m.opener.focus && document.contains(m.opener)) m.opener.focus();
      }
      if (typeof m.onClose === 'function') { try { m.onClose(); } catch (e) { /* ignore */ } }
    },
    isOpen: function () { return !!activeModal; },
  };

  /* ListingCard (MASTERPLAN 3.3): the whole card is one link; every user value goes through esc().
     opts.featured adds the FEATURED badge (callers decide using SZ.data.getActiveFeatures). V08 swaps in real photos. */
  ui.listingCard = function (l, opts) {
    const o = opts || {}, hp = !l.isDemo && l.photoIds && l.photoIds.length;
    const cond = SZ.config.CONDITIONS.find(function (c) { return c.slug === l.condition; });
    const badges = (l.isDemo ? '<span class="badge badge--demo">Demo</span>' : '') +
      (l.status === 'sold' ? '<span class="badge badge--sold">Sold</span>' : '') +
      (o.featured ? '<span class="badge badge--featured">Featured' + (l.isDemo ? ' · Demo' : '') + '</span>' : '');
    return '<a class="card card--link" href="' + esc('#/listing/' + encodeURIComponent(l.id)) + '">' +
