    return '<div><label class="flabel" for="s-' + id + '">' + esc(label) + '</label>' + control + (hint !== undefined ? '<p class="fhint muted" id="s-' + id + '-h" aria-live="polite">' + hint + '</p>' : '') + '<p class="ferror" id="s-' + id + '-e" hidden></p></div>';
  }
  const dby = function (id, hint) { return ' aria-describedby="s-' + id + '-e' + (hint ? ' s-' + id + '-h' : '') + '"'; };
  function formHtml(v) {
    const cats = opt('', 'Choose a category', !v.category) + cfg.CATEGORIES.filter(function (c) { return c.enabled; }).map(function (c) { return opt(c.slug, c.label, c.slug === v.category); }).join('');
    const conds = opt('', 'Choose the condition', !v.condition) + cfg.CONDITIONS.map(function (c) { return opt(c.slug, c.label, c.slug === v.condition); }).join('');
    const provs = opt('', 'Choose a province', !v.province) + Object.keys(cfg.PROVINCES).map(function (p) { return opt(p, p, p === v.province); }).join('');
    return '<form class="sell__form" data-form="sell" novalidate><div class="errsum" id="s-sum" role="alert" tabindex="-1" hidden></div>' +
      row('title', 'Title', '<input class="field" id="s-title" name="title" type="text" maxlength="80" autocomplete="off"' + dby('title') + ' value="' + esc(v.title) + '">') +
      row('category', 'Category', '<select class="field" id="s-category" name="category"' + dby('category') + '>' + cats + '</select>') +
      row('condition', 'Condition', '<select class="field" id="s-condition" name="condition"' + dby('condition') + '>' + conds + '</select>') +
      row('price', 'Price (rand)', '<input class="field" id="s-price" name="price" type="text" inputmode="numeric" maxlength="7" autocomplete="off"' + dby('price', 1) + ' value="' + esc(v.price) + '">', priceHint(v.price)) +
      '<label class="check" for="s-negotiable"><input type="checkbox" id="s-negotiable" name="negotiable"' + (v.negotiable ? ' checked' : '') + '><span>Price is negotiable</span></label>' +
      row('province', 'Province', '<select class="field" id="s-province" name="province"' + dby('province') + '>' + provs + '</select>') +
      row('city', 'City', '<select class="field" id="s-city" name="city"' + dby('city') + '>' + cityOpts(v.province, v.city) + '</select>') +
      '<div id="s-other"' + (v.city === OTHER ? '' : ' hidden') + '>' + row('cityOther', 'Your city or town', '<input class="field" id="s-cityOther" name="cityOther" type="text" maxlength="60" autocomplete="off"' + dby('cityOther') + ' value="' + esc(v.cityOther) + '">') + '</div>' +
      row('description', 'Description', '<textarea class="field field--area" id="s-description" name="description" rows="6" maxlength="2000"' + dby('description', 1) + '>' + esc(v.description) + '</textarea>', '<span id="s-count">' + v.description.length + '</span> / 2000') +
      '<div><label class="check" for="s-owns"><input type="checkbox" id="s-owns" name="owns"' + (v.owns ? ' checked' : '') + ' aria-describedby="s-owns-e"><span>This item is mine to sell, it is legal to sell in South Africa, and I have described it honestly.</span></label><p class="ferror" id="s-owns-e" hidden></p></div>' +
      '<button class="btn btn--primary btn--lg" type="submit">Preview listing</button></form>';
  }
  const tips = SZ.ui.sellerTips();

  function read(form) {
    const e = form.elements, v = {};
    FIELDS.forEach(function (k) { v[k] = (k === 'negotiable' || k === 'owns') ? !!e[k].checked : String(e[k].value || ''); });
    v.photoIds = (vals && vals.photoIds) || [];
    return v;
  }
  function errorsFor(v) {
    const e = SZ.validate.listing(toDraft(v));
    delete e.photos;   // photos are checked on their own step
    if (e.city && v.city === OTHER) { e.cityOther = e.city; delete e.city; }
    if (!v.owns) e.owns = 'Tick the box to confirm.';
    return e;
  }
  function showField(form, name, msg) {
    const c = form.elements[name], e = form.querySelector('#s-' + name + '-e');
    if (!c) return;
    if (msg) c.setAttribute('aria-invalid', 'true'); else c.removeAttribute('aria-invalid');
    if (e) { e.textContent = msg || ''; e.hidden = !msg; }
  }
  function showErrors(form, errs) {
    FIELDS.forEach(function (k) { showField(form, k, errs[k]); });
    const keys = Object.keys(errs), sum = form.querySelector('#s-sum');
    sum.innerHTML = '<strong>Fix ' + (keys.length === 1 ? 'this' : 'these ' + keys.length) + ' before you continue:</strong><ul>' + keys.map(function (k) {
      return '<li><a href="#s-' + esc(k) + '" data-action="sell-focus" data-for="s-' + esc(k) + '">' + esc(errs[k]) + '</a></li>'; }).join('') + '</ul>';
    sum.hidden = !keys.length;
    if (keys.length) sum.focus();
  }
  function save() { if (!editId && SZ.auth.user && vals) SZ.store.set(draftKey(), vals); }

  function previewListing() {
    const d = toDraft(vals);
    return { id: 'preview', sellerId: 'me', title: SZ.validate.cleanName(d.title), description: SZ.validate.cleanDesc(d.description), category: d.category, condition: d.condition,
      priceZAR: parseInt(d.price, 10), negotiable: !!d.negotiable, province: d.province, city: SZ.validate.cleanName(d.city), createdAt: new Date().toISOString(), status: 'active', isDemo: false, photoIds: vals.photoIds.slice() };
  }
  function previewHtml() {
    const l = previewListing(), cond = cfg.CONDITIONS.find(function (c) { return c.slug === l.condition; });
    return '<h1>Check your listing</h1><p class="muted">This is how buyers will see it. ' + (editId ? 'Nothing changes until you save.' : 'Nothing is published yet.') + '</p>' +
      '<div class="sell__card" inert>' + ui.listingCard(l) + '</div>' +
      '<div class="sell__snippet"><h2>' + esc(l.title) + '</h2><p class="sell__price">' + esc(fmtZAR(l.priceZAR)) + '</p>' +
      '<p>' + esc(cond ? cond.label : '') + (l.negotiable ? ' · Negotiable' : '') + '</p><p class="muted">' + esc(l.city) + ', ' + esc(l.province) + '</p><p class="sell__desc">' + esc(l.description) + '</p></div>' +
      '<div class="errsum" id="s-pub-err" role="alert" tabindex="-1" hidden style="margin-top:var(--space-4)"></div>' +
      '<div class="sell__actions"><button class="btn btn--secondary" type="button" data-action="sell-back">Back to photos</button><button class="btn btn--primary btn--lg" type="button" id="s-publish" data-action="sell-publish">' + (editId ? 'Save changes' : 'Publish listing') + '</button></div>';
  }
  function show(step) {
    const r = root(); if (!r) return;
    if (step === 'form') r.innerHTML = '<h1>' + (editId ? 'Edit listing' : 'Sell an item') + '</h1>' + (editId ? '' : tips) + formHtml(vals);
    else if (step === 'photos') { r.innerHTML = photosHtml(); drawPics(); }
    else if (step === 'preview') r.innerHTML = previewHtml();
    else r.innerHTML = '<h1>Your listing is live</h1><p>Anyone can find it in Browse now.</p><div class="sell__actions"><a class="btn btn--primary btn--lg" href="#/listing/' + esc(last.id) + '">View listing</a><button class="btn btn--secondary" type="button" data-action="sell-new">Post another</button></div>';
    const h = r.querySelector('h1'); h.setAttribute('tabindex', '-1'); h.focus(); window.scrollTo(0, 0);
  }

  /* ---- V08: photos step (form -> photos -> preview). Photos are staged in IndexedDB as they are added; the draft keeps their ids. ---- */
  const MAXP = cfg.LIMITS.PHOTOS[1];
  let busy = false;
  function say(html, bad) {
    const m = document.getElementById('pic-msgs'); if (!m) return;
    m.innerHTML = !html ? '' : bad ? '<div class="errsum">' + html + '</div>' : '<p class="muted">' + html + '</p>'; m.hidden = !html;
  }
  async function prune() {   // drop draft photo ids whose blob is gone (e.g. storage cleared)
    const ids = vals.photoIds, ok = await Promise.all(ids.map(function (id) { return SZ.data.getPhotoBlob(id).then(Boolean, function () { return false; }); }));
    vals.photoIds = ids.filter(function (_x, i) { return ok[i]; }); save();
  }
  function photosHtml() {
    return '<h1>Add photos</h1><p>Add 1 to ' + MAXP + ' photos. The first photo is the cover. <strong>We remove location data from photos.</strong></p>' +
      '<p class="muted">JPEG, PNG or WebP, up to 10 MB each. We shrink them for you.</p><ul class="pics" id="pics"></ul>' +
      '<p class="muted"><span id="pic-count"></span> photos added</p><div id="pic-msgs" aria-live="polite" hidden></div>' +
      '<input type="file" id="s-files" accept="image/jpeg,image/png,image/webp" multiple hidden>' +
      '<button class="btn btn--secondary btn--lg" type="button" id="s-add" data-action="photo-pick">Add photos</button>' +
      '<div class="sell__actions"><button class="btn btn--secondary" type="button" data-action="photos-back">Back to edit</button><button class="btn btn--primary btn--lg" type="button" data-action="photos-next">Preview listing</button></div>';
  }
  function drawPics() {
    const el = document.getElementById('pics'); if (!el) return;
    const ids = vals.photoIds, n = ids.length;
    el.innerHTML = ids.map(function (id, i) {
      const b = function (act, dir, label, txt, off) { return '<button type="button" class="btn btn--secondary" data-action="' + act + '" data-id="' + esc(id) + '"' + (dir ? ' data-dir="' + dir + '"' : '') + (off ? ' disabled' : '') + ' aria-label="' + label + ' photo ' + (i + 1) + '">' + txt + '</button>'; };
      return '<li class="pic"><img src="' + esc(SZ.art(vals.category, id, 'Loading photo')) + '" data-photo="' + esc(id) + '" alt="Photo ' + (i + 1) + ' of ' + n + '" width="160" height="120">' +
        '<p class="pic__tag">' + (i ? 'Photo ' + (i + 1) : 'Cover photo') + '</p><div class="pic__btns">' + b('photo-move', -1, 'Move', 'Left', !i) + b('photo-move', 1, 'Move', 'Right', i >= n - 1) + b('photo-remove', 0, 'Remove', 'Remove', false) + '</div></li>';
    }).join('');
    const add = document.getElementById('s-add'); if (add) add.disabled = busy || n >= MAXP;
    const c = document.getElementById('pic-count'); if (c) c.textContent = n + ' of ' + MAXP;
  }
  async function addFiles(files) {
    const list = Array.from(files || []), errs = [];
    if (busy || !list.length) return;
    const room = MAXP - vals.photoIds.length;
    busy = true; drawPics(); say('Adding photos…');
    for (let i = 0; i < list.length; i++) {
      const f = list[i];
      if (i >= room) { const k = list.length - i; errs.push(k + (k === 1 ? ' photo was' : ' photos were') + ' left out. You can add up to ' + MAXP + ' photos.'); break; }
      try {
        const ids = await SZ.data.addPhotos(editId, [await SZ.media.prepare(f)]);
        vals.photoIds = vals.photoIds.concat(ids); save(); drawPics();
      } catch (err) { errs.push(err && err.name === 'SzError' ? err.message : '\u201C' + f.name + '\u201D ' + (err && err.message ? err.message : 'could not be added.')); }
    }
    busy = false; drawPics();
    say(errs.length ? '<strong>Not added:</strong><ul>' + errs.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ul>' : '', true);
  }
  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 's-files') { const inp = e.target; addFiles(inp.files).then(function () { inp.value = ''; }); }
  });
  ui.actions['photo-pick'] = function () { const i = document.getElementById('s-files'); if (i) i.click(); };
  ui.actions['photo-move'] = function (el) {
    const id = el.getAttribute('data-id'), d = +el.getAttribute('data-dir'), a = vals.photoIds, i = a.indexOf(id), j = i + d;
    if (i < 0 || j < 0 || j >= a.length) return;
    a[i] = a[j]; a[j] = id; save(); drawPics();
    const nb = document.querySelector('[data-action="photo-move"][data-id="' + id + '"][data-dir="' + d + '"]:not([disabled])') || document.querySelector('[data-action="photo-move"][data-id="' + id + '"]:not([disabled])');
    if (nb) nb.focus();
    say('Photo moved to position ' + (j + 1) + (j === 0 ? '. It is now the cover photo.' : '.'));
  };
  ui.actions['photo-remove'] = async function (el) {
    const id = el.getAttribute('data-id');
    if (busy || vals.photoIds.indexOf(id) < 0) return;
    try { await SZ.data.removePhoto(id); } catch (e) { if (editId) { say(esc(e && e.name === 'SzError' ? e.message : 'Could not remove the photo.'), true); return; } /* staged photo already gone: drop it from the draft anyway */ }
    vals.photoIds = vals.photoIds.filter(function (x) { return x !== id; }); save(); drawPics(); say('Photo removed.');
    const add = document.getElementById('s-add'); if (add) add.focus();
  };
  ui.actions['photos-back'] = function () { show('form'); };
  ui.actions['photos-next'] = function () {
    if (busy) return;
    if (!vals.photoIds.length) { say('Add at least 1 photo to continue.', true); return; }
    show('preview');
  };

  function onEdit(e) {
    const form = e.target.closest ? e.target.closest('[data-form="sell"]') : null;
    if (!form) return;
    const n = e.target.name;
    if (n === 'price') { const c = e.target.value.replace(/\D/g, ''); if (c !== e.target.value) e.target.value = c; form.querySelector('#s-price-h').innerHTML = priceHint(c); }
    if (n === 'description') form.querySelector('#s-count').textContent = e.target.value.length;
    if (n === 'province' && e.type === 'change') { form.elements.city.innerHTML = cityOpts(e.target.value, ''); form.querySelector('#s-other').hidden = true; }
    if (n === 'city' && e.type === 'change') form.querySelector('#s-other').hidden = e.target.value !== OTHER;
    vals = read(form);
    const key = draftKey();   // a pending save only runs for the user who typed it
    window.clearTimeout(saveTimer); saveTimer = window.setTimeout(function () { if (draftKey() === key) save(); }, 300);
  }
  document.addEventListener('input', onEdit);
  document.addEventListener('change', onEdit);
  document.addEventListener('focusout', function (e) {     // inline validation on blur
    const form = e.target.closest ? e.target.closest('[data-form="sell"]') : null, n = e.target.name;
    if (!form || !n || n === 'owns' || n === 'negotiable') return;
    const v = read(form), errs = errorsFor(v);
    if (n === 'province' || n === 'city' || n === 'cityOther') showField(form, v.city === OTHER ? 'cityOther' : 'city', errs.city || errs.cityOther);
    if (n !== 'cityOther' && n !== 'city') showField(form, n, errs[n]);
    else if (v.city !== OTHER && n === 'city') showField(form, 'city', errs.city);
  });

  ui.forms.sell = function (form) {
    vals = read(form); save();
    const errs = errorsFor(vals);
    if (Object.keys(errs).length) { showErrors(form, errs); return; }
    show('photos');
  };
  ui.actions['sell-focus'] = function (el, e) { e.preventDefault(); const t = document.getElementById(el.getAttribute('data-for')); if (t) t.focus(); };
  ui.actions['sell-back'] = function () { show('photos'); };
  ui.actions['sell-new'] = function () { vals = blank(); show('form'); };
  ui.actions['sell-publish'] = async function (btn) {
    if (btn.disabled) return;
    btn.disabled = true; btn.textContent = editId ? 'Saving…' : 'Publishing…';
    try {
      if (editId) { await SZ.data.updateListing(editId, toDraft(vals)); ui.toast('Changes saved.'); window.location.hash = '#/dashboard'; return; }
      last = await SZ.data.createListing(toDraft(vals));
      window.clearTimeout(saveTimer); SZ.store.remove(draftKey()); vals = blank(); show('done');
    } catch (err) {
      if (!root()) return;
      if (err && err.fields && err.fields.photos) { await prune(); show('photos'); say(esc(err.fields.photos), true); return; }
      if (err && err.fields) { show('form'); showErrors(root().querySelector('form'), err.fields); return; }
      btn.disabled = false; btn.textContent = editId ? 'Save changes' : 'Publish listing';
      const box = document.getElementById('s-pub-err'); box.textContent = friendly(err); box.hidden = false; box.focus();
    }
  };

  SZ.router.routes.push({ path: '/sell', nav: 'sell', guard: 'user', title: 'Sell an item',
    render: function () { return '<section class="container page"><div class="sell"><div id="sell-root"></div></div></section>'; },
    after: function () {
      editId = null; pendingEdit = null;
      vals = blank();
      const saved = SZ.store.get(draftKey(), {});
      vals.photoIds = Array.isArray(saved && saved.photoIds) ? saved.photoIds.filter(function (x) { return typeof x === 'string'; }).slice(0, MAXP) : [];
      prune();
      FIELDS.forEach(function (k) { if (saved && typeof saved[k] === typeof vals[k]) vals[k] = typeof saved[k] === 'string' ? saved[k].slice(0, 2000) : saved[k]; });
      show('form');
    } });
  /* V09: edit mode reuses the whole sell flow (form -> photos -> preview) prefilled from the listing. */
  SZ.router.routes.push({ path: '/edit/:id', nav: 'account', guard: 'user', title: 'Edit listing',
    render: async function (ctx) {
      pendingEdit = null;
      const no = function (title, text) { return '<section class="container page">' + ui.emptyState({ title: title, text: text, actionsHtml: '<a class="btn btn--primary" href="#/dashboard">My listings</a>' }) + '</section>'; };
      try { pendingEdit = await SZ.data.getMyListing(ctx.params.id); }
      catch (err) { return err && err.code === 'FORBIDDEN' ? no('Not allowed', 'Only the seller can edit this listing.') : err && err.code === 'NOT_FOUND' ? no('Listing not found', 'It may have been deleted.') : no('Could not load the listing', 'Please try again.'); }
      if (pendingEdit.status !== 'active' && pendingEdit.status !== 'sold') { pendingEdit = null; return no('Cannot edit', 'A moderator has hidden or removed this listing, so it is read-only.'); }
      return '<section class="container page"><div class="sell"><div id="sell-root"></div></div></section>';
    },
    after: function () {
      const l = pendingEdit; if (!l) return;
      editId = l.id; vals = blank();
      const inList = (cfg.PROVINCES[l.province] || []).indexOf(l.city) !== -1;
      Object.assign(vals, { title: l.title, category: l.category, condition: l.condition, price: String(l.priceZAR), negotiable: !!l.negotiable, province: l.province,
        city: inList ? l.city : OTHER, cityOther: inList ? '' : l.city, description: l.description, owns: true, photoIds: l.photoIds.slice() });
      show('form');
    } });
})();

/* ===== SZ:VIEW-DASHBOARD ===== */
(function () {
  const ui = SZ.ui, esc = SZ.pure.esc, fmtZAR = SZ.pure.fmtZAR, timeAgo = SZ.pure.timeAgo;
  const TABS = [['active', 'Active'], ['sold', 'Sold'], ['hidden', 'Hidden or removed']];
  let items = [], tab = 'active';
  const group = function (l) { return l.status === 'active' ? 'active' : l.status === 'sold' ? 'sold' : 'hidden'; };
  const root = function () { return document.getElementById('dash-root'); };
  const find = function (id) { return items.find(function (l) { return l.id === id; }); };
  const msg = function (e) { return e && e.name === 'SzError' && e.code !== 'UNKNOWN' ? e.message : 'Something went wrong. Please try again.'; };
  function rowHtml(l) {
    const g = group(l), hp = l.photoIds && l.photoIds.length, id = esc(l.id);
    const badge = g === 'active' ? '<span class="badge">Active</span>' : g === 'sold' ? '<span class="badge badge--sold">SOLD</span>' : '<span class="badge badge--demo">' + (l.status === 'removed' ? 'Removed' : 'Hidden') + '</span>';
    const act = function (a, t) { return '<button type="button" class="btn btn--secondary" data-action="' + a + '" data-id="' + id + '">' + t + '</button>'; };
    const acts = g === 'hidden' ? '' : '<a class="btn btn--secondary" href="#/listing/' + id + '">View</a><a class="btn btn--secondary" href="#/edit/' + id + '">Edit</a>' + (g === 'active' ? act('dash-sold', 'Mark as sold') : act('dash-relist', 'Relist')) + act('dash-delete', 'Delete');
    return '<li class="dash__row"><img class="dash__img" src="' + esc(SZ.art(l.category, l.id, hp ? 'Loading photo' : 'No photo yet')) + '"' + (hp ? ' data-photo="' + esc(l.photoIds[0]) + '"' : '') + ' alt="" width="88" height="66">' +
      '<div class="dash__main"><h3 class="dash__title">' + (g === 'hidden' ? esc(l.title) : '<a href="#/listing/' + id + '">' + esc(l.title) + '</a>') + '</h3><p class="dash__price">' + esc(fmtZAR(l.priceZAR)) + '</p>' +
      '<p class="muted">' + badge + ' Listed ' + esc(timeAgo(l.createdAt)) + ' · ' + (l.views || 0) + ' views</p>' +
      (g === 'hidden' ? '<p class="muted">A moderator ' + (l.status === 'removed' ? 'removed' : 'hid') + ' this listing' + (l.moderationNote ? ': ' + esc(l.moderationNote) : '.') + ' You cannot edit or delete it.</p>' : '') +
      '</div>' + (acts ? '<div class="dash__acts">' + acts + '</div>' : '') + '</li>';
  }
  function draw(focusTab) {
    const r = root(); if (!r) return;
    const n = { active: 0, sold: 0, hidden: 0 }; items.forEach(function (l) { n[group(l)]++; });
    const list = items.filter(function (l) { return group(l) === tab; });
    const empty = { active: 'Your active listings will show here.', sold: 'Listings you mark as sold will show here.', hidden: 'Listings hidden or removed by a moderator will show here.' }[tab];
    r.innerHTML = '<h1>My listings</h1><div class="dash__tabs" role="tablist" aria-label="Listing status">' + TABS.map(function (t) {
      return '<button type="button" role="tab" class="dash__tab" id="dash-tab-' + t[0] + '" aria-selected="' + (tab === t[0]) + '" aria-controls="dash-panel" data-action="dash-tab" data-tab="' + t[0] + '">' + t[1] + ' (' + n[t[0]] + ')</button>';
    }).join('') + '</div><div id="dash-panel" role="tabpanel" aria-labelledby="dash-tab-' + tab + '">' +
      (list.length ? '<ul class="dash__list">' + list.map(rowHtml).join('') + '</ul>' : ui.emptyState({ title: 'Nothing here yet', text: empty, actionsHtml: tab === 'active' ? '<a class="btn btn--primary" href="#/sell">Sell an item</a>' : '' })) + '</div>';
    if (focusTab) document.getElementById('dash-tab-' + tab).focus();
  }
  async function load() {
    try { items = await SZ.data.listMyListings(); draw(); }
    catch (e) { const r = root(); if (r) r.innerHTML = '<h1>My listings</h1><div class="errsum" role="alert">' + esc(msg(e)) + '</div>'; }
  }
  function ask(title, body, op, id, label) {
    ui.modal.open({ title: title, bodyHtml: '<p>' + body + '</p><div class="sell__actions"><button type="button" class="btn btn--secondary" data-action="close-modal">Cancel</button><button type="button" class="btn btn--primary" data-action="dash-do" data-op="' + op + '" data-id="' + esc(id) + '">' + label + '</button></div>' });
  }
  async function run(op, id) {
    try {
      if (op === 'delete') await SZ.data.deleteListing(id); else await SZ.data.setListingStatus(id, op === 'sold' ? 'sold' : 'active');
      ui.modal.close({ restoreFocus: false });
      ui.toast(op === 'delete' ? 'Listing deleted.' : op === 'sold' ? 'Marked as sold.' : 'Listing is active again.');
      await load();
    } catch (e) { ui.modal.close({ restoreFocus: false }); ui.toast(msg(e), { type: 'error' }); }
  }
  ui.actions['dash-tab'] = function (el) { tab = el.getAttribute('data-tab'); draw(true); };
  ui.actions['dash-sold'] = function (el) { const l = find(el.getAttribute('data-id')); if (l) ask('Mark as sold?', esc(l.title) + ' will leave Browse and show SOLD on its page. You can relist it later.', 'sold', l.id, 'Mark as sold'); };
  ui.actions['dash-delete'] = function (el) { const l = find(el.getAttribute('data-id')); if (l) ask('Delete this listing?', 'This permanently deletes ' + esc(l.title) + ' and its photos. This cannot be undone.', 'delete', l.id, 'Delete'); };
  ui.actions['dash-relist'] = function (el) { run('relist', el.getAttribute('data-id')); };
  ui.actions['dash-do'] = function (el) { run(el.getAttribute('data-op'), el.getAttribute('data-id')); };
  SZ.router.routes.push({ path: '/dashboard', nav: 'account', guard: 'user', title: 'My listings',
    render: function () { return '<section class="container page"><div id="dash-root"><p class="muted">Loading…</p></div></section>'; },
    after: function () { tab = 'active'; load(); } });
})();

/* ===== SZ:VIEW-SELLER ===== */
/* V10: public seller page #/seller/:id. It shows only what getSellerPublic returns (never an email or cellphone number).
   Tabs Active / Sold use listListings({ sellerId, status }); sold listings stay visible here (5.3). */
(function () {
  const ui = SZ.ui, esc = SZ.pure.esc, PAGE = SZ.config.PAGE_SIZE;
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const monthYear = function (iso) { const d = new Date(iso); return isNaN(d.getTime()) ? '' : MONTHS[d.getMonth()] + ' ' + d.getFullYear(); };
  const names = new Map();   // seller id -> display name, for the page title
  const TABS = [['active', 'Active'], ['sold', 'Sold']];
  let st = null;             // { seller, tab, data: { active|sold: { items, total, page, busy } }, featured }
  const isOwn = function (s) { return !!(SZ.auth && SZ.auth.user && SZ.auth.user.id === s.id); };

  function headHtml(s) {
    const initial = Array.from(String(s.displayName || '?'))[0].toUpperCase(), where = [s.city, s.province].filter(Boolean).join(', ');
    return '<div class="sellerp__head"><span class="avatar avatar--lg" aria-hidden="true">' + esc(initial) + '</span><div><h1>' + esc(s.displayName) + '</h1>' +
      (s.isDemo || s.sellerType === 'business' ? '<div class="sellerp__badges">' + (s.isDemo ? '<span class="badge badge--demo">Demo</span>' : '') +
        (s.sellerType === 'business' ? '<span class="badge badge--business">Business (self-declared)</span>' : '') + '</div>' : '') + '</div></div>' +
      '<p class="muted">Member since ' + esc(monthYear(s.createdAt)) + (where ? ' · ' + esc(where) : '') + '</p>' +
      (s.sellerType === 'business' ? '<p class="muted">Not verified by Spawnza.</p>' : '') +
      (s.bio ? '<p class="sellerp__bio">' + esc(s.bio) + '</p>' : '') +
      (isOwn(s) ? '<div class="sellerp__actions"><a class="btn btn--secondary" href="#/profile">Edit profile</a></div>' : '');
  }
  function panelHtml() {
    const d = st.data[st.tab], own = isOwn(st.seller), none = !st.data.active.total && !st.data.sold.total;
    if (!d.items.length) {
      let title, text;
      if (none) { title = own ? 'You have no listings yet' : 'No listings yet'; text = own ? 'Listings you post will show here.' : 'This seller has not listed anything yet.'; }
      else if (st.tab === 'active') { title = 'No active listings'; text = 'This seller has nothing for sale right now. Check the Sold tab to see past listings.'; }
      else { title = 'Nothing sold yet'; text = 'Listings marked as sold will show here.'; }
      return ui.emptyState({ icon: 'search', title: title, text: text, actionsHtml: own && st.tab === 'active' ? '<a class="btn btn--primary" href="#/sell">Sell an item</a>' : '' });
    }
    return '<ul class="card-grid" id="seller-grid">' + d.items.map(function (l) { return '<li>' + ui.listingCard(l, { featured: !!st.featured[l.id] }) + '</li>'; }).join('') + '</ul>' +
      (d.items.length < d.total ? '<div class="more"><p class="muted">Showing ' + d.items.length + ' of ' + d.total + '</p><button type="button" class="btn btn--secondary" data-action="seller-more">Load more</button></div>' : '');
  }
  function listHtml() {
    return '<div class="dash__tabs" role="tablist" aria-label="Seller listings">' + TABS.map(function (t) {
      return '<button type="button" role="tab" class="dash__tab" id="seller-tab-' + t[0] + '" aria-selected="' + (st.tab === t[0]) + '" aria-controls="seller-panel" data-action="seller-tab" data-tab="' + t[0] + '">' + t[1] + ' (' + st.data[t[0]].total + ')</button>';
    }).join('') + '</div><div id="seller-panel" role="tabpanel" aria-labelledby="seller-tab-' + st.tab + '">' + panelHtml() + '</div>';
  }
  function draw(focusTab) {
    const box = document.getElementById('seller-list'); if (!box || !st) return;
    box.innerHTML = listHtml();
    if (focusTab) { const t = document.getElementById('seller-tab-' + st.tab); if (t) t.focus(); }
  }
  async function more() {
    const mine = st, tab = st.tab, d = st.data[tab];
    if (d.busy) return;
    d.busy = true;
    const btn = document.querySelector('[data-action="seller-more"]'); if (btn) btn.disabled = true;
    try {
      const res = await SZ.data.listListings({ sellerId: mine.seller.id, status: tab, page: d.page + 1, pageSize: PAGE });
      if (st !== mine) return;
      const before = d.items.length;
      d.items = d.items.concat(res.items); d.page += 1; d.total = res.total; d.busy = false;
      if (st.tab === tab) { draw(); const cards = document.querySelectorAll('#seller-grid a.card'); if (cards[before]) cards[before].focus(); }
    } catch (e) {
      d.busy = false;
      if (st === mine) { const b = document.querySelector('[data-action="seller-more"]'); if (b) b.disabled = false; ui.toast('Could not load more listings. Please try again.', { type: 'error' }); }
    }
  }
  ui.actions['seller-tab'] = function (el) { if (!st) return; st.tab = el.getAttribute('data-tab') === 'sold' ? 'sold' : 'active'; draw(true); };
  ui.actions['seller-more'] = function () { if (st) more(); };

  SZ.router.routes.push({
    path: '/seller/:id', nav: 'browse',
    title: function (ctx) { return names.has(ctx.params.id) ? 'Seller: ' + names.get(ctx.params.id) : 'Seller not found'; },
    render: async function (ctx) {
      const id = ctx.params.id;
      let seller;
      try { seller = await SZ.data.getSellerPublic(id); }
      catch (e) {
        if (e && e.code === 'NOT_FOUND') {
          names.delete(id); st = null;
          return '<section class="container page"><div class="empty"><span class="empty__icon">' + ui.icon('search') + '</span><h1>Seller not found</h1>' +
            '<p class="muted">This seller may have closed their account, or the link may be wrong.</p>' +
            '<div class="empty__actions"><a class="btn btn--primary" href="#/browse">Browse listings</a><a class="btn btn--secondary" href="#/">Back to home</a></div></div></section>';
        }
        throw e;
      }
      const got = await Promise.all([
        SZ.data.listListings({ sellerId: id, status: 'active', page: 1, pageSize: PAGE }),
        SZ.data.listListings({ sellerId: id, status: 'sold', page: 1, pageSize: PAGE }),
        SZ.data.getActiveFeatures(),
      ]);
      const featured = {}; got[2].forEach(function (f) { featured[f.listingId] = true; });
      names.set(id, seller.displayName);
      st = { seller: seller, tab: 'active', featured: featured, data: {
        active: { items: got[0].items, total: got[0].total, page: 1, busy: false }, sold: { items: got[1].items, total: got[1].total, page: 1, busy: false } } };
      return '<section class="container page">' + headHtml(seller) + '<div id="seller-list">' + listHtml() + '</div></section>';
    },
  });
})();

/* ===== SZ:VIEW-AUTH ===== */
(function () {
  const ui = SZ.ui;
  const auth = SZ.auth = { user: null };
  auth.refresh = async function () {
    let u = null;
    try { u = await SZ.data.getSession(); } catch (e) { u = null; }
    const changed = (u && u.id) !== (auth.user && auth.user.id) || (u && auth.user && u.displayName !== auth.user.displayName);
    auth.user = u;
    if (changed) ui.syncAuth();
    return u;
  };
  auth.check = async function (guard) {
    const u = await auth.refresh();
    if (!u) return 'login';
    return guard === 'admin' && u.role !== 'admin' ? 'forbidden' : 'ok';
  };
  // Only same-app paths are accepted as "next" (never a full URL).
  auth.nextOf = function (query) {
    const n = String((query && query.next) || '');
    return /^\/(?!\/)[\w\-\/?=&%.]*$/.test(n) && !/^\/(login|register)(\/|\?|$)/.test(n) ? n : '';
  };
  auth.toLogin = function () { window.location.replace(buildHashQuery('/login', { next: window.location.hash.replace(/^#/, '') })); };
  auth.forbiddenRoute = {
    path: '*', nav: null, title: 'Not allowed',
    render: function () {
      return '<section class="container page"><div class="empty"><span class="empty__icon">' + ui.icon('close') + '</span><h1>You can\'t open this page</h1>' +
        '<p class="muted">Your account does not have access to it.</p><a class="btn btn--primary" href="#/">Back to home</a></div></section>';
    },
  };

  const friendly = function (err) { return err && err.name === 'SzError' && err.code !== 'UNKNOWN' ? err.message : 'Something went wrong. Please try again.'; };
  function fieldHtml(o) {
    const id = 'a-' + o.id;
    return '<div><label class="flabel" for="' + id + '">' + esc(o.label) + '</label><input class="field" id="' + id + '" name="' + o.id + '" type="' + o.type + '" autocomplete="' + o.auto + '" maxlength="' + (o.max || 200) + '"' +
      (o.type === 'email' ? ' autocapitalize="none" spellcheck="false"' : '') + ' aria-describedby="' + id + '-e' + (o.hint ? ' ' + id + '-h' : '') + '">' +
      (o.hint ? '<p class="fhint muted" id="' + id + '-h">' + esc(o.hint) + '</p>' : '') + '<p class="ferror" id="' + id + '-e" hidden></p></div>';
  }
  function showErrors(form, errs, general) {
    Array.prototype.forEach.call(form.querySelectorAll('input[name]'), function (inp) {
      const m = errs[inp.name], e = form.querySelector('#a-' + inp.name + '-e');
      if (m) inp.setAttribute('aria-invalid', 'true'); else inp.removeAttribute('aria-invalid');
      if (e) { e.textContent = m || ''; e.hidden = !m; }
    });
    const n = Object.keys(errs).length, sum = form.querySelector('.errsum');
    sum.textContent = general || (n === 1 ? 'Please fix the highlighted field.' : 'Please fix the ' + n + ' highlighted fields.');
    sum.hidden = !n && !general;
    const first = form.querySelector('[aria-invalid="true"]');
    if (first) first.focus(); else if (!sum.hidden) sum.focus();
  }
  function busy(form, on) {
    if (on) form.setAttribute('data-busy', '1'); else form.removeAttribute('data-busy');
    Array.prototype.forEach.call(form.querySelectorAll('button[type=submit]'), function (b) { b.disabled = on; });
  }
  const goNext = function (form) { window.location.hash = '#' + (form.getAttribute('data-next') || '/account'); };
  const nextQs = function (ctx) { const n = auth.nextOf(ctx.query); return n ? { next: n } : {}; };

  async function authPage(ctx, kind) {
    const u = await auth.refresh();
    if (u) { window.location.replace('#' + (auth.nextOf(ctx.query) || '/account')); return ''; }
    const reg = kind === 'register', next = auth.nextOf(ctx.query);
    return '<section class="container page"><div class="auth"><h1>' + (reg ? 'Create your account' : 'Log in') + '</h1>' +
      '<div class="banner" role="note">Prototype accounts exist only on this device. Don\'t use a real password.</div>' +
      '<form class="auth__form" data-form="' + kind + '" data-next="' + esc(next) + '" novalidate>' +
      '<div class="errsum" role="alert" tabindex="-1" hidden></div>' +
      fieldHtml({ id: 'email', label: 'Email', type: 'email', auto: 'email', max: 254 }) +
      (reg ? fieldHtml({ id: 'displayName', label: 'Display name', type: 'text', auto: 'nickname', max: 40, hint: 'Shown on your listings. Not your email.' }) : '') +
      fieldHtml({ id: 'password', label: 'Password', type: 'password', auto: reg ? 'new-password' : 'current-password', hint: reg ? 'At least ' + SZ.config.LIMITS.PASSWORD_MIN + ' characters.' : '' }) +
      (reg ? fieldHtml({ id: 'confirm', label: 'Confirm password', type: 'password', auto: 'new-password' }) +
        '<div><label class="check" for="a-terms"><input type="checkbox" id="a-terms" name="terms" aria-describedby="a-terms-e"><span>I agree to the <a href="#/page/terms" target="_blank" rel="noopener noreferrer">Terms of Use</a> (draft) and have read the <a href="#/page/privacy" target="_blank" rel="noopener noreferrer">Privacy notice</a> (draft).</span></label><p class="ferror" id="a-terms-e" hidden></p></div>' : '') +
      '<button class="btn btn--primary btn--lg" type="submit">' + (reg ? 'Create account' : 'Log in') + '</button></form>' +
      '<p class="muted" style="margin-top:var(--space-4)">' + (reg ? 'Already have an account? <a href="' + esc(buildHashQuery('/login', nextQs(ctx))) + '">Log in</a>' : 'New here? <a href="' + esc(buildHashQuery('/register', nextQs(ctx))) + '">Create an account</a>') + '</p></div></section>';
  }
  ui.forms.register = async function (form) {
    if (form.getAttribute('data-busy')) return;
    const el = form.elements, v = { email: el.email.value, displayName: el.displayName.value, password: el.password.value };
    const errs = SZ.validate.signUp(v);
    if (el.confirm.value !== v.password) errs.confirm = 'The passwords do not match.';
    if (!el.terms.checked) errs.terms = 'Tick the box to agree to the Terms.';
    if (Object.keys(errs).length) { showErrors(form, errs); return; }
    busy(form, true);
    try {
      await SZ.data.signUp(v); await auth.refresh();
      ui.toast('Welcome to Spawnza, ' + auth.user.displayName + '.'); goNext(form);
    } catch (err) { busy(form, false); showErrors(form, err.fields || {}, err.fields ? '' : friendly(err)); }
  };
  ui.forms.login = async function (form) {
    if (form.getAttribute('data-busy')) return;
    const el = form.elements, errs = {};
    if (!el.email.value.trim()) errs.email = 'Enter your email address.';
    if (!el.password.value) errs.password = 'Enter your password.';
    if (Object.keys(errs).length) { showErrors(form, errs); return; }
    busy(form, true);
    try { await SZ.data.signIn({ email: el.email.value, password: el.password.value }); await auth.refresh(); ui.toast('You are logged in.'); goNext(form); }
    catch (err) { busy(form, false); el.password.value = ''; showErrors(form, {}, friendly(err)); }
  };
  ui.actions.logout = async function () {
    try { await SZ.data.signOut(); } catch (e) { /* ignore */ }
    await auth.refresh(); ui.modal.close({ restoreFocus: false }); ui.toast('You are logged out.');
    if (window.location.hash === '#/') SZ.router.render(); else window.location.hash = '#/';
  };

  SZ.router.routes.push({ path: '/login', nav: 'account', title: 'Log in', render: function (ctx) { return authPage(ctx, 'login'); } });
  SZ.router.routes.push({ path: '/register', nav: 'account', title: 'Create account', render: function (ctx) { return authPage(ctx, 'register'); } });
  SZ.router.routes.push({ path: '/account', nav: 'account', guard: 'user', title: 'Your account', render: function () {
    const u = auth.user, link = function (href, text) { return '<a class="btn btn--secondary" href="' + href + '">' + text + '</a>'; };
    return '<section class="container page"><div class="auth"><h1>Your account</h1><p>Signed in as <strong>' + esc(u.displayName) + '</strong>' +
      (u.role === 'admin' ? ' <span class="badge">Admin (prototype)</span>' : '') + '</p><div class="acct-list">' +
      link('#/saved', 'Saved listings') + link('#/sell', 'Sell an item') + link('#/dashboard', 'My listings') + link('#/profile', 'Profile') +
      (u.role === 'admin' ? link('#/admin', 'Admin') : '') + '</div><button class="btn btn--ghost" type="button" data-action="logout">Log out</button></div></section>';
  } });
})();

/* ===== SZ:VIEW-PROFILE ===== */
/* V10: #/profile (guard 'user'). Edits the public profile only: display name, bio, province/city, self-declared seller type.
   Also "Delete my account". Rules come from SZ.validate.profile, the same rules the adapter enforces.
   V11: a second, separate form "WhatsApp contact" (cellphone number + consent) saved with updatePrivateContact. The number is never part
   of the public profile; it is only handed to a logged-in buyer when they tap Contact on one of this seller's listings (see SZ:VIEW-LISTING). */
(function () {
  const ui = SZ.ui, cfg = SZ.config, esc = SZ.pure.esc, OTHER = '__other';
  const FIELDS = ['displayName', 'bio', 'province', 'city', 'cityOther', 'sellerType'], CFIELDS = ['whatsapp'];
  const hasProv = function (p) { return Object.prototype.hasOwnProperty.call(cfg.PROVINCES, p); };
  const opt = function (v, l, sel) { return '<option value="' + esc(v) + '"' + (sel ? ' selected' : '') + '>' + esc(l) + '</option>'; };
  const friendly = function (e) { return e && e.name === 'SzError' && e.code !== 'UNKNOWN' ? e.message : 'Something went wrong. Please try again.'; };
  const cityOpts = function (prov, cur) {
    return opt('', prov ? 'Choose a city' : 'Choose a province first', !cur) + (hasProv(prov) ? cfg.PROVINCES[prov] : []).map(function (c) { return opt(c, c, c === cur); }).join('') + (prov ? opt(OTHER, 'Other…', cur === OTHER) : '');
  };
  function fromSeller(s) {
    const inList = hasProv(s.province) && cfg.PROVINCES[s.province].indexOf(s.city) !== -1;
    return { displayName: s.displayName, bio: s.bio || '', province: hasProv(s.province) ? s.province : '', city: inList ? s.city : (s.city ? OTHER : ''), cityOther: inList ? '' : (s.city || ''), sellerType: s.sellerType === 'business' ? 'business' : 'individual' };
  }
  const toPatch = function (v) { return { displayName: v.displayName, bio: v.bio, province: v.province, city: v.province ? (v.city === OTHER ? v.cityOther : v.city) : '', sellerType: v.sellerType }; };
  function row(id, label, control, hint) {
    return '<div><label class="flabel" for="p-' + id + '">' + esc(label) + '</label>' + control + (hint !== undefined ? '<p class="fhint muted" id="p-' + id + '-h">' + hint + '</p>' : '') + '<p class="ferror" id="p-' + id + '-e" hidden></p></div>';
  }
  const dby = function (id, hint) { return ' aria-describedby="p-' + id + '-e' + (hint ? ' p-' + id + '-h' : '') + '"'; };
  function formHtml(v) {
    const provs = opt('', 'Not set', !v.province) + Object.keys(cfg.PROVINCES).map(function (p) { return opt(p, p, p === v.province); }).join('');
    const radio = function (val, label) { return '<label class="check" for="p-type-' + val + '"><input type="radio" id="p-type-' + val + '" name="sellerType" value="' + val + '"' + (v.sellerType === val ? ' checked' : '') + '><span>' + label + '</span></label>'; };
    return '<form class="sell__form" id="p-form" data-form="profile" novalidate><div class="errsum" id="p-sum" role="alert" tabindex="-1" hidden></div>' +
      row('displayName', 'Display name', '<input class="field" id="p-displayName" name="displayName" type="text" maxlength="' + cfg.LIMITS.DISPLAY_NAME[1] + '" autocomplete="nickname"' + dby('displayName', 1) + ' value="' + esc(v.displayName) + '">', cfg.LIMITS.DISPLAY_NAME[0] + ' to ' + cfg.LIMITS.DISPLAY_NAME[1] + ' characters. Shown on your listings.') +
      row('bio', 'Bio (optional)', '<textarea class="field field--area" id="p-bio" name="bio" rows="4" maxlength="' + cfg.LIMITS.BIO_MAX + '"' + dby('bio', 1) + '>' + esc(v.bio) + '</textarea>', '<span id="p-count">' + v.bio.length + '</span> / ' + cfg.LIMITS.BIO_MAX) +
      row('province', 'Province (optional)', '<select class="field" id="p-province" name="province"' + dby('province') + '>' + provs + '</select>') +
      row('city', 'City', '<select class="field" id="p-city" name="city"' + dby('city') + '>' + cityOpts(v.province, v.city) + '</select>') +
      '<div id="p-other"' + (v.city === OTHER ? '' : ' hidden') + '>' + row('cityOther', 'Your city or town', '<input class="field" id="p-cityOther" name="cityOther" type="text" maxlength="' + cfg.LIMITS.CITY[1] + '" autocomplete="off"' + dby('cityOther') + ' value="' + esc(v.cityOther) + '">') + '</div>' +
      '<fieldset aria-describedby="p-sellerType-h p-sellerType-e"><legend>I sell as</legend>' + radio('individual', 'An individual') + radio('business', 'A business') +
        '<p class="fhint muted" id="p-sellerType-h">You choose this yourself. Not verified by Spawnza.</p><p class="ferror" id="p-sellerType-e" hidden></p></fieldset>' +
      '<button class="btn btn--primary btn--lg" type="submit">Save changes</button></form>';
  }
  /* V11: the WhatsApp contact form (separate Save). c = { whatsapp: E.164 or '', consent: boolean } */
  function contactHtml(c) {
    const radio = function (val, label) { return '<label class="check" for="p-share-' + val + '"><input type="radio" id="p-share-' + val + '" name="share" value="' + val + '"' + ((c.consent ? 'on' : 'off') === val ? ' checked' : '') + '><span>' + label + '</span></label>'; };
    return '<section class="prof__contact" aria-labelledby="p-contact-h"><h2 id="p-contact-h">WhatsApp contact</h2>' +
      '<p class="muted">If you allow it, a logged-in buyer who taps Contact on one of your listings can open a WhatsApp chat with this number. We do not show it on your listings or your seller page, but the buyer can see it once the chat opens. In this prototype the number is saved on this device only.</p>' +
      '<form class="sell__form" id="c-form" data-form="contact" novalidate><div class="errsum" role="alert" tabindex="-1" hidden></div>' +
      row('whatsapp', 'WhatsApp cellphone number', '<input class="field" id="p-whatsapp" name="whatsapp" type="tel" inputmode="tel" autocomplete="tel" maxlength="20"' + dby('whatsapp', 1) + ' value="' + esc(SZ.pure.phoneDisplay(c.whatsapp)) + '">', 'A South African mobile number, like 082 123 4567. Leave it empty to remove your number.') +
      '<fieldset aria-describedby="p-share-h"><legend>Who can contact me on WhatsApp</legend>' + radio('off', 'Nobody. Do not share my number.') + radio('on', 'Logged-in buyers can contact me on WhatsApp') +
        '<p class="fhint muted" id="p-share-h">You can change this at any time.</p></fieldset>' +
      '<button class="btn btn--primary btn--lg" type="submit">Save contact settings</button></form></section>';
  }
  const read = function (form) {
    const e = form.elements, t = form.querySelector('input[name="sellerType"]:checked');
    return { displayName: e.displayName.value, bio: e.bio.value, province: e.province.value, city: e.city.value, cityOther: e.cityOther.value, sellerType: t ? t.value : '' };
  };
  const readContact = function (form) { const t = form.querySelector('input[name="share"]:checked'); return { whatsapp: form.elements.whatsapp.value, consent: !!t && t.value === 'on' }; };
  function errorsFor(v) {
    const e = SZ.validate.profile(toPatch(v));
    if (e.city && v.city === OTHER) { e.cityOther = e.city; delete e.city; }
    return e;
  }
  function showField(form, name, msg) {
    const c = form.elements[name], e = form.querySelector('#p-' + name + '-e');
    if (c && c.setAttribute) { if (msg) c.setAttribute('aria-invalid', 'true'); else c.removeAttribute('aria-invalid'); }
    if (e) { e.textContent = msg || ''; e.hidden = !msg; }
  }
  // fields: the field names this form owns; focusId: maps a field name to the id of the control the summary link should focus
  function showErrors(form, errs, general, fields, focusId) {
    fields.forEach(function (k) { showField(form, k, errs[k]); });
    const keys = Object.keys(errs), sum = form.querySelector('.errsum');
    sum.innerHTML = general ? '<strong>' + esc(general) + '</strong>' : '<strong>Fix ' + (keys.length === 1 ? 'this' : 'these ' + keys.length) + ' before you save:</strong><ul>' + keys.map(function (k) {
      return '<li><a href="#p-' + esc(k) + '" data-action="profile-focus" data-for="' + esc(focusId(k)) + '">' + esc(errs[k]) + '</a></li>'; }).join('') + '</ul>';
    sum.hidden = !keys.length && !general;
    if (!sum.hidden) sum.focus();
  }
  const profileFocus = function (k) { return k === 'sellerType' ? 'p-type-individual' : 'p-' + k; };
  const toggleOther = function (form, on) { const o = form.querySelector('#p-other'); if (o) o.hidden = !on; };

  ui.actions['profile-focus'] = function (el, e) { e.preventDefault(); const t = document.getElementById(el.getAttribute('data-for')); if (t) t.focus(); };
  ui.forms.profile = async function (form) {
    if (form.getAttribute('data-busy')) return;
    const v = read(form), errs = errorsFor(v), btn = form.querySelector('button[type=submit]');
    if (Object.keys(errs).length) { showErrors(form, errs, '', FIELDS, profileFocus); return; }
    form.setAttribute('data-busy', '1'); btn.disabled = true;
    try {
      const s = await SZ.data.updateProfile(toPatch(v));
      await SZ.auth.refresh();
      showErrors(form, {}, '', FIELDS, profileFocus);
      const cv = fromSeller(s);   // write the cleaned values (trimmed name, collapsed spaces) back into the form
      form.elements.displayName.value = cv.displayName; form.elements.bio.value = cv.bio; form.elements.cityOther.value = v.city === OTHER ? cv.cityOther : '';
      const cnt = document.getElementById('p-count'); if (cnt) cnt.textContent = String(cv.bio.length);
      ui.toast('Profile saved.');
    } catch (err) {
      if (err && err.fields) {
        const f = Object.assign({}, err.fields); if (f.city && v.city === OTHER) { f.cityOther = f.city; delete f.city; }
        showErrors(form, f, '', FIELDS, profileFocus);
      } else showErrors(form, {}, friendly(err), FIELDS, profileFocus);
    }
    form.removeAttribute('data-busy'); btn.disabled = false;
  };
  ui.forms.contact = async function (form) {
    if (form.getAttribute('data-busy')) return;
    const v = readContact(form), errs = SZ.validate.contact(v), btn = form.querySelector('button[type=submit]');
    if (Object.keys(errs).length) { showErrors(form, errs, '', CFIELDS, function () { return 'p-whatsapp'; }); return; }
    form.setAttribute('data-busy', '1'); btn.disabled = true;
    try {
      const r = await SZ.data.updatePrivateContact(v);
      showErrors(form, {}, '', CFIELDS, function () { return 'p-whatsapp'; });
      form.elements.whatsapp.value = SZ.pure.phoneDisplay(r.whatsapp);   // show the number the way we stored it
      ui.toast(r.consent ? 'Saved. Logged-in buyers can now contact you on WhatsApp.' : 'Saved. Your number is not shared.');
    } catch (err) {
      if (err && err.fields) showErrors(form, err.fields, '', CFIELDS, function () { return 'p-whatsapp'; });
      else showErrors(form, {}, friendly(err), CFIELDS, function () { return 'p-whatsapp'; });
    }
    form.removeAttribute('data-busy'); btn.disabled = false;
  };

  ui.actions['profile-delete'] = async function () {
    let n = 0;
    try { n = (await SZ.data.listMyListings()).length; } catch (e) { n = 0; }
    ui.modal.open({ title: 'Delete your account?', bodyHtml: '<p>This permanently deletes your account' + (n ? ', your ' + n + (n === 1 ? ' listing' : ' listings') + ' and their photos' : ' and everything you have posted') + ' from this device. This cannot be undone.</p>' +
      '<div class="errsum" id="p-del-err" role="alert" hidden></div><div class="sell__actions"><button type="button" class="btn btn--secondary" data-action="close-modal">Cancel</button><button type="button" class="btn btn--danger" data-action="profile-delete-do">Delete my account</button></div>' });
  };
  ui.actions['profile-delete-do'] = async function (btn) {
    if (btn.disabled) return;
    btn.disabled = true;
    try {
      await SZ.data.deleteMyAccount();
      await SZ.auth.refresh();
      ui.modal.close({ restoreFocus: false });
      ui.toast('Your account has been deleted.');
      if (window.location.hash === '#/') SZ.router.render(); else window.location.hash = '#/';
    } catch (err) {
      btn.disabled = false;
      const m = document.getElementById('p-del-err'); if (m) { m.textContent = friendly(err); m.hidden = false; }
    }
  };

  SZ.router.routes.push({
    path: '/profile', nav: 'account', guard: 'user', title: 'Profile',
    render: async function () {
      const u = SZ.auth.user, got = await Promise.all([SZ.data.getSellerPublic(u.id), SZ.data.getMyPrivateContact()]), s = got[0];
      return '<section class="container page"><div class="prof"><h1>Profile</h1>' +
        '<p class="muted">This is what other people see on your listings and your seller page. Your email address is never shown.</p>' +
        '<p><a href="' + esc('#/seller/' + encodeURIComponent(u.id)) + '">View my public profile</a></p>' + formHtml(fromSeller(s)) + contactHtml(got[1]) +
        '<section class="prof__danger" aria-labelledby="p-danger-h"><h2 id="p-danger-h">Delete my account</h2>' +
        '<p class="muted">Deletes your account, your listings and their photos from this device. This cannot be undone.</p>' +
        '<button type="button" class="btn btn--danger" data-action="profile-delete">Delete my account</button></section></div></section>';
    },
    after: function () {
      const form = document.getElementById('p-form'); if (!form) return;
      form.addEventListener('input', function (e) { if (e.target && e.target.name === 'bio') { const c = document.getElementById('p-count'); if (c) c.textContent = String(e.target.value.length); } });
      form.addEventListener('change', function (e) {
        const n = e.target && e.target.name;
        if (n === 'province') { form.elements.city.innerHTML = cityOpts(e.target.value, ''); form.elements.cityOther.value = ''; toggleOther(form, false); showField(form, 'city', ''); showField(form, 'cityOther', ''); }
        else if (n === 'city') toggleOther(form, e.target.value === OTHER);
      });
      form.addEventListener('focusout', function (e) {   // validate one field when the user leaves it
        const n = e.target && e.target.name;
        if (!n || FIELDS.indexOf(n) === -1 || n === 'sellerType') return;
        showField(form, n, errorsFor(read(form))[n]);
      });
      const cf = document.getElementById('c-form'); if (!cf) return;
      cf.addEventListener('focusout', function (e) { if (e.target && e.target.name === 'whatsapp') showField(cf, 'whatsapp', SZ.validate.contact(readContact(cf)).whatsapp); });
      cf.addEventListener('change', function (e) { if (e.target && e.target.name === 'share') showField(cf, 'whatsapp', SZ.validate.contact(readContact(cf)).whatsapp); });
    },
  });
})();

/* ===== SZ:VIEW-ADMIN ===== */
/* V12: #/admin (guard 'admin'; the adapter ALSO checks the role on every call). Tabs: Reports (open / actioned / dismissed), Listings (search any listing,
   filter by status), Moderation log. Every action (hide, remove, restore, dismiss, mark actioned) asks for a note of 5 to 300 characters and writes a log entry.
   A listing with 3 or more open reports gets a "Flagged" chip. Nothing is hidden automatically. */
(function () {
  const ui = SZ.ui, esc = SZ.pure.esc, timeAgo = SZ.pure.timeAgo, fmtZAR = SZ.pure.fmtZAR, PAGE = SZ.config.PAGE_SIZE;
  const REASONS = {}; SZ.config.REPORT_REASONS.forEach(function (r) { REASONS[r.slug] = r.label; });
  const STATUS = { active: 'Active', sold: 'Sold', hidden: 'Hidden', removed: 'Removed' };
  const LOGLABEL = { hide: 'Hid a listing', remove: 'Removed a listing', restore: 'Restored a listing', dismiss_report: 'Dismissed a report', action_report: 'Marked a report as actioned' };
  const cap = function (t) { return t.charAt(0).toUpperCase() + t.slice(1); };

  const KINDS = {

    remove: { title: 'Remove this listing?', text: 'It disappears for the public and the seller cannot edit or delete it. You can restore it later.', btn: 'Remove listing', hint: 'The seller will see this note.', danger: true, run: setStatus('removed'), done: 'Listing removed.' },
    restore: { title: 'Restore this listing?', text: 'It becomes public again (a listing that was sold stays sold).', btn: 'Restore listing', hint: 'Saved in the moderation log.', run: setStatus('active'), done: 'Listing restored.' },
    dismiss: { title: 'Dismiss this report?', text: 'Use this when the listing is fine. The listing stays as it is.', btn: 'Dismiss report', hint: 'Saved in the moderation log.', run: function (id, n) { return SZ.data.resolveReport(id, 'dismissed', n); }, done: 'Report dismissed.' },
    actioned: { title: 'Mark this report as actioned?', text: 'Use this after you have dealt with the problem.', btn: 'Mark actioned', hint: 'Saved in the moderation log.', run: function (id, n) { return SZ.data.resolveReport(id, 'actioned', n); }, done: 'Report marked as actioned.' },
  };
  let st = null;   // { tab, rs, reports, log, lq, ls, lItems, lTotal, lPage }
  const root = function () { return document.getElementById('adm-root'); };
  const act = function (kind, id, label, cls) { return '<button type="button" class="btn ' + (cls || 'btn--secondary') + '" data-action="adm-act" data-kind="' + kind + '" data-id="' + esc(id) + '">' + esc(label) + '</button>'; };
  const listingActs = function (id, status) {
    return (status === 'active' || status === 'sold' ? act('hide', id, 'Hide listing') + act('remove', id, 'Remove listing', 'btn--danger') : '') +
      (status === 'hidden' ? act('remove', id, 'Remove listing', 'btn--danger') : '') + (status === 'hidden' || status === 'removed' ? act('restore', id, 'Restore listing') : '');
  };
  const statusBadge = function (status, demo) { return (status && status !== 'active' ? ' <span class="badge ' + (status === 'sold' ? 'badge--sold' : 'badge--demo') + '">' + esc(STATUS[status] || status) + '</span>' : '') + (demo ? ' <span class="badge badge--demo">Demo</span>' : ''); };
  const link = function (id, title) { return '<a href="' + esc('#/listing/' + encodeURIComponent(id)) + '">' + esc(title) + '</a>'; };

  function reportItem(r) {
    const L = r.listing;
    return '<li class="adm__item"><div class="adm__head"><strong>' + esc(REASONS[r.reason] || r.reason) + '</strong>' +
      (r.flagged && r.status === 'open' ? ' <span class="chip chip--flag">Flagged: ' + r.openOnListing + ' open reports</span>' : '') + (L.exists ? statusBadge(L.status, L.isDemo) : '') + '</div>' +
      '<p class="adm__title">' + (L.exists ? link(L.id, L.title) : '<span class="muted">This listing no longer exists.</span>') + '</p>' +
      '<p class="muted">Reported by ' + esc(r.reporterName) + ' ' + esc(timeAgo(r.createdAt)) + (L.exists ? ' · Seller: ' + esc(L.sellerName) : '') + '</p>' +
      (r.details ? '<p class="adm__details">' + esc(r.details) + '</p>' : '<p class="muted">No details given.</p>') +
      (r.status !== 'open' ? '<p class="muted">' + cap(r.status) + ' by ' + esc(r.resolvedByName) + ' ' + esc(timeAgo(r.resolvedAt)) + '. Note: ' + esc(r.resolutionNote) + '</p>' :
        '<div class="adm__acts">' + act('dismiss', r.id, 'Dismiss') + act('actioned', r.id, 'Mark actioned') + (L.exists ? listingActs(L.id, L.status) : '') + '</div>') + '</li>';
  }
  function reportsHtml() {
    const counts = { open: 0, actioned: 0, dismissed: 0 };
    st.reports.forEach(function (r) { counts[r.status] += 1; });
    const list = st.reports.filter(function (r) { return r.status === st.rs; });
    return '<p class="muted adm__label" id="adm-rs-h">Show reports that are</p><div class="dash__tabs adm__rs" role="group" aria-labelledby="adm-rs-h">' + ['open', 'actioned', 'dismissed'].map(function (k) {
      return '<button type="button" class="dash__tab" aria-pressed="' + (st.rs === k) + '" data-action="adm-rs" data-rs="' + k + '">' + cap(k) + ' (' + counts[k] + ')</button>'; }).join('') + '</div>' +
      (list.length ? '<ul class="adm__list">' + list.map(reportItem).join('') + '</ul>' :
        ui.emptyState({ icon: 'search', title: 'No ' + st.rs + ' reports', text: st.rs === 'open' ? 'When someone reports a listing it will show up here.' : 'Nothing here yet.' }));
  }
  function listingRow(l) {
    return '<li class="adm__item"><div class="adm__head">' + link(l.id, l.title) + statusBadge(l.status, l.isDemo) + (l.flagged ? ' <span class="chip chip--flag">Flagged: ' + l.openReports + ' open reports</span>' : '') + '</div>' +
      '<p class="muted">' + esc(fmtZAR(l.priceZAR)) + ' · Seller: ' + esc(l.sellerName) + ' · listed ' + esc(timeAgo(l.createdAt)) + (l.openReports && !l.flagged ? ' · ' + l.openReports + ' open report' + (l.openReports === 1 ? '' : 's') : '') + '</p>' +
      '<p class="muted adm__id">ID ' + esc(l.id) + '</p>' + (l.moderationNote ? '<p>Note: ' + esc(l.moderationNote) + '</p>' : '') + '<div class="adm__acts">' + listingActs(l.id, l.status) + '</div></li>';
  }
  function resultsHtml() {
    return '<p class="muted" id="adm-count" tabindex="-1" role="status">' + st.lTotal + (st.lTotal === 1 ? ' listing' : ' listings') + '</p>' +
      (st.lItems.length ? '<ul class="adm__list">' + st.lItems.map(listingRow).join('') + '</ul>' +
        (st.lItems.length < st.lTotal ? '<div class="more"><p class="muted">Showing ' + st.lItems.length + ' of ' + st.lTotal + '</p><button type="button" class="btn btn--secondary" data-action="adm-more">Load more</button></div>' : '') :
        ui.emptyState({ icon: 'search', title: 'No listings found', text: 'Try a different search or status.' }));
  }
  function listingsHtml() {
    return '<form class="adm__filters" data-form="adm-listings" role="search"><div><label class="flabel" for="adm-q">Search</label><input class="field" id="adm-q" name="q" type="search" maxlength="80" autocomplete="off" placeholder="Title, seller or listing ID" value="' + esc(st.lq) + '"></div>' +
      '<div><label class="flabel" for="adm-status">Status</label><select class="field" id="adm-status" name="status">' + ['all', 'active', 'sold', 'hidden', 'removed'].map(function (k) {
        return '<option value="' + k + '"' + (st.ls === k ? ' selected' : '') + '>' + (k === 'all' ? 'All statuses' : STATUS[k]) + '</option>'; }).join('') + '</select></div>' +
      '<button class="btn btn--primary" type="submit">Search</button></form><div id="adm-results">' + resultsHtml() + '</div>';
  }
  function logHtml() {
    return st.log.length ? '<ul class="adm__list">' + st.log.map(function (m) {
      return '<li class="adm__item"><div class="adm__head"><strong>' + esc(LOGLABEL[m.action] || m.action) + '</strong></div>' +
        '<p>' + (m.listingExists ? link(m.listingId, m.listingTitle) : '<span class="muted">' + (m.listingId ? 'The listing no longer exists.' : 'No listing.') + '</span>') + '</p>' +
        '<p class="muted">By ' + esc(m.adminName) + ' · <time datetime="' + esc(m.createdAt) + '">' + esc(timeAgo(m.createdAt)) + '</time></p><p>Note: ' + esc(m.note) + '</p></li>'; }).join('') + '</ul>' :
      ui.emptyState({ icon: 'search', title: 'Nothing logged yet', text: 'Every admin action will be listed here.' });
  }
  function bodyHtml() {
    const open = st.reports.filter(function (r) { return r.status === 'open'; }).length;
    const tabs = [['reports', 'Reports (' + open + ' open)'], ['listings', 'Listings'], ['log', 'Moderation log']];
    return '<div class="dash__tabs" role="tablist" aria-label="Admin sections">' + tabs.map(function (t) {
      return '<button type="button" role="tab" class="dash__tab" id="adm-tab-' + t[0] + '" aria-selected="' + (st.tab === t[0]) + '" aria-controls="adm-panel" data-action="adm-tab" data-tab="' + t[0] + '">' + esc(t[1]) + '</button>'; }).join('') + '</div>' +
      '<div id="adm-panel" role="tabpanel" tabindex="-1" aria-labelledby="adm-tab-' + st.tab + '">' + (st.tab === 'reports' ? reportsHtml() : st.tab === 'listings' ? listingsHtml() : logHtml()) + '</div>';
  }
  const draw = function () { const r = root(); if (r && st) r.innerHTML = bodyHtml(); };
  async function loadListings(page) {
    const res = await SZ.data.adminListListings({ q: st.lq, status: st.ls, page: page, pageSize: PAGE });
    st.lTotal = res.total; st.lPage = page; st.lItems = page === 1 ? res.items : st.lItems.concat(res.items);
  }
  const reloadAll = async function () { const r = await Promise.all([SZ.data.listReports({}), SZ.data.listModerationLog(), loadListings(1)]); st.reports = r[0]; st.log = r[1]; };

  ui.actions['adm-tab'] = function (el) { if (!st) return; st.tab = el.getAttribute('data-tab'); draw(); const t = document.getElementById('adm-tab-' + st.tab); if (t) t.focus(); };
  ui.actions['adm-rs'] = function (el) { if (!st) return; st.rs = el.getAttribute('data-rs'); draw(); const b = document.querySelector('[data-rs="' + st.rs + '"]'); if (b) b.focus(); };
  ui.actions['adm-more'] = async function (btn) {

  };
  ui.forms['adm-listings'] = async function (form) {
    if (!st) return;
    st.lq = String(form.elements.q.value || '').slice(0, 80); st.ls = form.elements.status.value;
    try { await loadListings(1); } catch (e) { ui.toast(friendly(e), { type: 'error' }); return; }

  };
  ui.actions['adm-act'] = function (el) {
    const kind = el.getAttribute('data-kind'), k = KINDS[kind], id = el.getAttribute('data-id');
    if (!k) return;
    ui.modal.open({ title: k.title, bodyHtml: '<p>' + esc(k.text) + '</p><form class="sell__form" data-form="adm-note" data-kind="' + esc(kind) + '" data-id="' + esc(id) + '" novalidate><div class="errsum" role="alert" tabindex="-1" hidden></div>' +
      '<div><label class="flabel" for="adm-note">Note (required)</label><textarea class="field field--area" id="adm-note" name="note" rows="3" maxlength="300" aria-describedby="adm-note-e adm-note-h"></textarea>' +
      '<p class="fhint muted" id="adm-note-h">' + esc(k.hint) + ' 5 to 300 characters.</p><p class="ferror" id="adm-note-e" hidden></p></div>' +
      '<div class="sell__actions"><button type="submit" class="btn ' + (k.danger ? 'btn--danger' : 'btn--primary') + '">' + esc(k.btn) + '</button><button type="button" class="btn btn--secondary" data-action="close-modal">Cancel</button></div></form>' });
    const ta = document.getElementById('adm-note'); if (ta) ta.focus();
  };
  ui.forms['adm-note'] = async function (form) {
    if (!st || form.getAttribute('data-busy')) return;
    const k = KINDS[form.getAttribute('data-kind')], id = form.getAttribute('data-id'), ta = form.elements.note, er = form.querySelector('#adm-note-e'), sum = form.querySelector('.errsum'), btn = form.querySelector('button[type=submit]');
    const show = function (msg, general) {
      if (msg) ta.setAttribute('aria-invalid', 'true'); else ta.removeAttribute('aria-invalid');

      sum.textContent = general || ''; sum.hidden = !general; if (general) sum.focus(); else if (msg) ta.focus();
    };
    const bad = SZ.validate.modNote(ta.value);
    if (!k || bad) { show(bad || 'Something went wrong.'); return; }
    form.setAttribute('data-busy', '1'); btn.disabled = true;

      await k.run(id, ta.value);
      await reloadAll();

  };

  SZ.router.routes.push({
    path: '/admin', nav: 'account', guard: 'admin', title: 'Admin',
    render: async function (ctx) {
      const q = (ctx && ctx.query) || {};
      st = { tab: ['reports', 'listings', 'log'].indexOf(q.tab) !== -1 ? q.tab : 'reports', rs: 'open', reports: [], log: [], lq: String(q.q || '').slice(0, 80), ls: 'all', lItems: [], lTotal: 0, lPage: 1 };
      const r = await Promise.all([SZ.data.listReports({}), SZ.data.listModerationLog(), loadListings(1)]);
      st.reports = r[0]; st.log = r[1];
      return '<section class="container page"><h1>Admin</h1><p class="muted">Moderation tools. In this prototype the admin role is stored on this device, so it is not real security.</p><div id="adm-root">' + bodyHtml() + '</div></section>';
    },
  });
})();


/* ===== SZ:VIEW-PAGES ===== */
/* V13: static trust pages at #/page/:slug (safety, how-it-works, about, prohibited, terms, privacy, contact) and the footer links.
   All text lives in SZ.pages below and is written to be TRUE of this build (MASTERPLAN 8.3 and 9): no "verified", "guaranteed", "secure payment",
   no invented users, reviews or sales. Terms and Privacy are draft placeholders with a visible banner. When Spawnza goes online (V18 onward) the
   "where your data is stored" wording on About and Privacy MUST be updated. Section = { h, p: [paragraphs], ul: [items], ol: [steps], html: ready-made escaped HTML }. */
(function () {
  const ui = SZ.ui, esc = SZ.pure.esc, LIM = SZ.config.LIMITS;
  const DRAFT = '<div class="banner banner--demo" role="note"><strong>Draft \u2014 not legal advice.</strong> Have it reviewed before launch (POPIA).</div>';
  const link = function (slug, text) { return '<a href="#/page/' + slug + '">' + esc(text) + '</a>'; };
  const validEmail = function (e) { return typeof e === 'string' && /^[^\s@<>"'`]+@[^\s@<>"'`]+\.[^\s@<>"'`]+$/.test(e) && e.length <= 120; };

  const PAGES = {
    safety: {
      title: 'Safety tips',
      lead: 'Spawnza helps people find each other. We do not check items or sellers, we do not handle payments and we do not deliver. These tips help you stay safe.',
      top: function () { return ui.buyerWarning(); },
      sections: [
        { h: 'Before you meet', ul: ['Ask questions in the chat first. Ask for extra photos, or a short video that shows the item working.',
          'Look at the seller\'s page, but remember that anyone can create an account and the Business label is chosen by the seller.',
          'Be careful if the price looks too good to be true.'] },
        { h: 'Meeting up', ul: ['Meet in a busy public place, in daylight, such as a shopping centre.', 'Bring a friend if you can, and tell someone where you are going.',

  SZ.pages = PAGES;
  const has = function (slug) { return Object.prototype.hasOwnProperty.call(PAGES, slug); };

  function sectionHtml(s) {
    return '<h2>' + esc(s.h) + '</h2>' + (s.p || []).map(function (t) { return '<p>' + esc(t) + '</p>'; }).join('') +
      (s.ul ? '<ul>' + s.ul.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' : '') +
      (s.ol ? '<ol>' + s.ol.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ol>' : '') + (s.html || '');
  }
  SZ.router.routes.push({
    path: '/page/:slug', nav: null,
    title: function (ctx) { return has(ctx.params.slug) ? PAGES[ctx.params.slug].title : 'Page not found'; },
    render: function (ctx) {
      const slug = ctx.params.slug;
      if (!has(slug)) {
        return '<section class="container page"><div class="empty"><span class="empty__icon">' + ui.icon('search') + '</span><h1>Page not found</h1><p class="muted">That page does not exist.</p>' +
          '<div class="empty__actions"><a class="btn btn--primary" href="#/">Back to home</a></div></div></section>';
      }
      const p = PAGES[slug];
      const body = p.sections.map(sectionHtml).join('');
      return '<section class="container page"><article class="prose"><h1>' + esc(p.title) + '</h1>' + (p.draft ? DRAFT : '') + '<p class="muted prose__lead">' + esc(p.lead) + '</p>' +
        (p.top ? p.top() : '') + body + (p.after ? p.after() : '') + '</article></section>';
    },
  });
})();

/* ===== SZ:VIEW-DEV ===== */
/* Dev-only (CONFIG.DEV): all demo cards plus a reset button. V15 hides dev routes; V26 sets DEV=false. */
if (SZ.config.DEV) {
  SZ.router.routes.push({
    path: '/dev', nav: null, title: 'Dev: demo data',
    render: async function () {
      const all = await SZ.data.devAllListings();
      const pub = await SZ.data.listListings({ pageSize: 100 });
      const sold = await SZ.data.listListings({ status: 'sold', pageSize: 100 });
      const feats = await SZ.data.getActiveFeatures();
      const featured = {};
      feats.forEach(function (f) { featured[f.listingId] = true; });
      const cards = all.map(function (l) { return '<li>' + SZ.ui.listingCard(l, { featured: !!featured[l.id] }) + '</li>'; }).join('');
      return '<section class="container page"><h1>Dev: demo data</h1>' +
        '<p class="muted">' + all.length + ' records · ' + pub.total + ' in public results · ' + sold.total + ' sold (public) · ' + feats.length + ' active features. Only shown while CONFIG.DEV is true.</p>' +
        '<div class="dev-bar"><button type="button" class="btn btn--secondary" data-action="dev-reset-demo">Reset demo data</button></div>' +
        '<ul class="card-grid">' + cards + '</ul></section>';
    },
  });
  SZ.ui.actions['dev-reset-demo'] = async function () {
    try {
      await SZ.data.devResetDemo();
      SZ.ui.toast('Demo data reset.');
      await SZ.router.render();
    } catch (err) {
      SZ.ui.toast('Could not reset the demo data.');
    }
  };
}

/* ===== SZ:BOOT ===== */
SZ.store.migrate();
SZ.ui.renderShell();
SZ.auth.refresh().then(function () { SZ.router.start(); }, function () { SZ.router.start(); });

})();
