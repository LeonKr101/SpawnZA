      '<div class="card__body">' + (badges ? '<div class="card__badges">' + badges + '</div>' : '') +
      '<h3 class="card__title">' + esc(l.title) + '</h3>' +
      '<p class="card__price price">' + esc(fmtZAR(l.priceZAR)) + '</p>' +
      '<span class="chip">' + esc(cond ? cond.label : '') + '</span>' +
      '<p class="card__meta">' + esc(l.city + ', ' + l.province) + '</p>' +
      '<p class="card__meta">Listed ' + esc(timeAgo(l.createdAt)) + '</p></div></a>';
  };

  /* Skeleton placeholders for loading grids (a decorative shimmer, hidden from screen readers). */
  ui.skeletonCards = function (n) {
    let items = '';
    for (let i = 0; i < n; i++) {
      items += '<li><div class="card"><div class="card__media skel"></div><div class="card__body">' +
        '<span class="skel skel--line skel--short"></span><span class="skel skel--line"></span><span class="skel skel--line skel--short"></span></div></div></li>';
    }
    return '<ul class="card-grid" aria-hidden="true">' + items + '</ul>';
  };

  /* EmptyState (3.3): icon, title (h2), text, and a row of action buttons. actionsHtml is caller-built, already-escaped HTML. */
  ui.emptyState = function (o) {
    return '<div class="empty">' + (o.icon ? '<span class="empty__icon">' + ui.icon(o.icon) + '</span>' : '') +
      '<h2>' + esc(o.title) + '</h2>' + (o.text ? '<p class="muted">' + esc(o.text) + '</p>' : '') +
      (o.actionsHtml ? '<div class="empty__actions">' + o.actionsHtml + '</div>' : '') + '</div>';
  };

  /* BuyerWarning (V13): the ONE place the 8.1 wording is rendered (Home, Listing, Contact dialog, Safety page). opts.cls adds a class;
     opts.moreLink adds a link to the Safety page. */
  ui.buyerWarning = function (o) {
    const w = SZ.config.BUYER_WARNING, x = o || {};
    return '<div class="note' + (x.cls ? ' ' + esc(x.cls) : '') + '" role="note"><p><strong>' + esc(w.lead) + '</strong> ' + esc(w.body) + '</p>' +
      (x.moreLink ? '<p><a href="#/page/safety">Read our safety tips</a></p>' : '') + '</div>';
  };
  /* SellerTips (V13): shown on the Sell form. Its links open in a new tab so nobody loses what they have typed. */
  ui.sellerTips = function () {
    return '<aside class="banner" aria-label="Seller tips"><strong>Seller tips.</strong> Use clear photos of the actual item, describe faults honestly and meet buyers in a busy public place. ' +
      'Never accept overpayment or \u201Crefund\u201D tricks, and never share OTPs or banking logins.' +
      '<br><strong>Not allowed:</strong> stolen goods, counterfeits, pirated games, blacklisted devices, weapons and listings that hide serious faults. ' +
      '<a href="#/page/prohibited" target="_blank" rel="noopener noreferrer">See all prohibited items</a> \u00B7 <a href="#/page/safety" target="_blank" rel="noopener noreferrer">Safety tips</a></aside>';
  };

  /* Breadcrumbs (3.3): items are {label, href?}; the last one is the current page (no link). */
  ui.breadcrumbs = function (items) {
    return '<nav class="breadcrumbs" aria-label="Breadcrumb"><ol>' + items.map(function (it, i) {
      const last = i === items.length - 1;
      return '<li>' + (it.href && !last ? '<a href="' + esc(it.href) + '">' + esc(it.label) + '</a>'
        : '<span' + (last ? ' aria-current="page"' : '') + '>' + esc(it.label) + '</span>') + '</li>';
    }).join('') + '</ol></nav>';
  };

  /* Views that are not built yet use this (replaced by the real view in the version noted). */
  ui.comingSoon = function (name, plannedVersion) {
    return '<section class="container page"><div class="empty">' +
      '<span class="empty__icon">' + ui.icon('clock') + '</span>' +
      '<h1>' + esc(name) + '</h1>' +
      '<p class="muted">Coming soon. This part of Spawnza is still being built (planned for ' + esc(plannedVersion) + ').</p>' +
      '<a class="btn btn--secondary" href="#/">Back to home</a></div></section>';
  };

  /* Delegated events. Shell controls, <main> content and dialogs all use data-action / data-form. */
  document.addEventListener('click', function (e) {
    const t = e.target.closest ? e.target.closest('[data-action]') : null;
    if (!t) return;
    const fn = ui.actions[t.getAttribute('data-action')];
    if (typeof fn === 'function') fn(t, e);
  });
  document.addEventListener('submit', function (e) {
    const f = e.target.closest ? e.target.closest('[data-form]') : null;
    if (!f) return;
    const fn = ui.forms[f.getAttribute('data-form')];
    if (typeof fn === 'function') { e.preventDefault(); fn(f, e); }
  });
  document.addEventListener('keydown', function (e) {
    if (activeModal) {
      if (e.key === 'Escape' && activeModal.dismissible) { e.preventDefault(); ui.modal.close(); return; }
      if (e.key === 'Tab') {
        const items = focusables(activeModal.dialog);
        if (!items.length) { e.preventDefault(); activeModal.dialog.focus(); return; }
        const first = items[0];
        const last = items[items.length - 1];
        const cur = document.activeElement;
        if (e.shiftKey && (cur === first || cur === activeModal.dialog)) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && cur === last) { e.preventDefault(); first.focus(); }
      }
      return;
    }
    if (e.key === 'Escape') {
      const search = $('#sz-search');
      if (search && search.classList.contains('is-open') && search.contains(document.activeElement)) { closeSearch(); const b = $('[data-action="toggle-search"]'); if (b) b.focus(); }
    }
  });

  function closeSearch() {
    const search = $('#sz-search');
    const btn = $('[data-action="toggle-search"]');
    if (search) search.classList.remove('is-open');
    if (btn) btn.setAttribute('aria-expanded', 'false');
  }

  ui.actions['skip-to-content'] = function (_el, e) {
    e.preventDefault();               // "#main" would otherwise change the route hash
    const main = $('#main');
    if (main) main.focus();
  };
  ui.actions['toggle-search'] = function (btn) {
    const search = $('#sz-search');
    const open = !search.classList.contains('is-open');
    search.classList.toggle('is-open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) $('#sz-search-input').focus();
  };
  ui.actions['open-menu'] = function () {
    const items = ui.navItems().map(function (n) {
      return '<li><a class="menu-link" href="' + esc(n.href) + '" data-nav="' + esc(n.id) + '">' + ui.icon(n.icon) + '<span>' + esc(n.label) + '</span></a></li>';
    }).join('');
    ui.modal.open({ title: 'Menu', bodyHtml: '<ul class="menu-list">' + items + (SZ.auth && SZ.auth.user ? '<li><button type="button" class="menu-link" data-action="logout">' + ui.icon('user') + '<span>Log out</span></button></li>' : '<li><a class="menu-link" href="#/register">' + ui.icon('user') + '<span>Create account</span></a></li>') + (SZ.config.DEV ? '<li><a class="menu-link" href="#/dev"><span>Dev tools</span></a></li>' : '') + '</ul><p class="muted">Prototype ' + esc(SZ.config.VERSION) + ' · demo data</p>' });
    const current = $('#sz-tabbar [aria-current="page"]');
    if (current) { const id = current.getAttribute('data-nav'); const link = $('.modal .menu-link[data-nav="' + id + '"]'); if (link) link.setAttribute('aria-current', 'page'); }
  };
  ui.actions['close-modal'] = function () { ui.modal.close(); };

  ui.forms.search = function (form) {
    const q = String(form.elements.q.value || '').replace(/\s+/g, ' ').trim();
    closeSearch();
    window.location.hash = buildHashQuery('/browse', { q: q });
  };

  SZ.store.onModeChange(function () { ui.syncBanner(); });
  return ui;
})();

/* ===== SZ:ROUTER ===== */
/* Hash router: #/path?query. Routes are an additive registry:
   SZ.router.routes.push({ path:'/listing/:id', nav:'browse', title:'Listing' | function (ctx), render: function (ctx) -> html string or Promise }) */
SZ.router = (function () {
  const routes = [];
  let token = 0;
  let firstRender = true;
  const notFoundRoute = {
    path: '*', nav: null, title: 'Page not found',
    render: function () {
      return '<section class="container page"><div class="empty">' +
        '<span class="empty__icon">' + SZ.ui.icon('search') + '</span>' +
        '<h1>Page not found</h1>' +
        "<p class=\"muted\">We couldn't find that page. The link may be wrong, or the page may have moved.</p>" +
        '<a class="btn btn--primary" href="#/">Back to home</a></div></section>';
    },
  };
  const errorRoute = {
    path: '*', nav: null, title: 'Something went wrong',
    render: function () {
      return '<section class="container page"><div class="empty">' +
        '<span class="empty__icon">' + SZ.ui.icon('close') + '</span>' +
        '<h1>Something went wrong</h1>' +
        '<p class="muted">This page could not load. Please try again.</p>' +
        '<a class="btn btn--primary" href="#/">Back to home</a></div></section>';
    },
  };

  function match(segments) {
    for (let r = 0; r < routes.length; r++) {
      const pat = routes[r].path.split('/').filter(Boolean);
      if (pat.length !== segments.length) continue;
      const params = {};
      let ok = true;
      for (let i = 0; i < pat.length; i++) {
        if (pat[i].charAt(0) === ':') params[pat[i].slice(1)] = segments[i];
        else if (pat[i] !== segments[i]) { ok = false; break; }
      }
      if (ok) return { route: routes[r], params: params };
    }
    return null;
  }

  async function render() {
    const mine = ++token;
    const main = document.getElementById('main');
    const parsed = parseHashQuery(window.location.hash);
    const found = match(parsed.segments);
    const ctx = { path: parsed.path, segments: parsed.segments, query: parsed.query, params: found ? found.params : {} };
    let view = found ? found.route : notFoundRoute;
    if (view.guard && SZ.auth) {           // V06: route guard ('user' | 'admin')
      const verdict = await SZ.auth.check(view.guard);
      if (mine !== token) return;
      if (verdict === 'login') { SZ.auth.toLogin(); return; }
      if (verdict === 'forbidden') view = SZ.auth.forbiddenRoute;
    }
    SZ.ui.modal.close({ restoreFocus: false });
    let html;
    try {
      html = await view.render(ctx);
    } catch (err) {
      console.error('[Spawnza] view failed to render', err && err.message);
      view = errorRoute;
      html = errorRoute.render(ctx);
    }
    if (mine !== token) return;            // a newer navigation won
    main.innerHTML = html;
    const title = typeof view.title === 'function' ? view.title(ctx) : view.title;
    document.title = title ? title + ' — Spawnza' : 'Spawnza — Your gear. Your game.';
    SZ.ui.setActiveNav(view.nav || null);
    window.scrollTo(0, 0);
    if (!firstRender) {                    // not on first load, so the skip link stays first in the Tab order
      const h1 = main.querySelector('h1');
      if (h1) { h1.setAttribute('tabindex', '-1'); h1.focus({ preventScroll: true }); }
    }
    firstRender = false;
    if (typeof view.after === 'function') view.after(ctx);
  }

  return {
    routes: routes,
    render: render,
    start: function () { window.addEventListener('hashchange', render); return render(); },
    go: function (path, query) { window.location.hash = buildHashQuery(path, query); },
    href: buildHashQuery,
  };
})();

/* ===== SZ:VIEW-HOME ===== */
/* V03 homepage. The hero, "How it works", safety strip and sell band are static HTML. Everything that comes from the
   adapter (category counts, Featured, Just listed, category rows) loads into #home-data after the first paint:
   skeletons while loading, an empty state when nothing is for sale, and an error state with Try again. */
(function () {
  const ROW_COUNT = 4;
  const QUICK_SEARCHES = ['PS5', 'Switch', 'RTX', 'Xbox', 'controller'];
  const listingsText = function (n) { return n + (n === 1 ? ' listing' : ' listings'); };

  function section(id, title, bodyHtml, headExtra, note) {
    return '<section class="container section" aria-labelledby="' + id + '">' +
      '<div class="section__head"><h2 id="' + id + '">' + esc(title) + '</h2>' + (headExtra || '') + '</div>' +
      bodyHtml + (note ? '<p class="muted section__note">' + esc(note) + '</p>' : '') + '</section>';
  }
  function seeAll(href, label) {
    return '<a class="link" href="' + esc(href) + '">' + esc(label) + '</a>';
  }
  function cardGrid(items, featuredIds) {
    return '<ul class="card-grid">' + items.map(function (l) {
      return '<li>' + SZ.ui.listingCard(l, { featured: !!featuredIds[l.id] }) + '</li>';
    }).join('') + '</ul>';
  }

  function skeletonHtml() {
    const tiles = new Array(5).join('<li><div class="skel skel--tile"></div></li>') + '<li><div class="skel skel--tile"></div></li>';
    return '<p class="sr-only" role="status">Loading listings…</p>' +
      '<section class="container section" aria-hidden="true"><div class="skel skel--title"></div><ul class="cat-grid">' + tiles + '</ul></section>' +
      '<section class="container section" aria-hidden="true"><div class="skel skel--title"></div>' + SZ.ui.skeletonCards(4) + '</section>';
  }
  function emptyHtml() {
    return '<section class="container section"><div class="empty">' +
      '<span class="empty__icon">' + SZ.ui.icon('search') + '</span>' +
      '<h2>No listings yet</h2><p class="muted">Nothing is for sale right now. Be the first to list an item.</p>' +
      '<a class="btn btn--primary" href="#/sell">Sell an item</a></div></section>';
  }
  function errorHtml() {
    return '<section class="container section"><div class="empty">' +
      '<span class="empty__icon">' + SZ.ui.icon('close') + '</span>' +
      '<h2>Listings did not load</h2><p class="muted">Something went wrong while loading the listings. Please try again.</p>' +
      '<button type="button" class="btn btn--secondary" data-action="home-retry">Try again</button></div></section>';
  }

  async function buildData() {
    const cats = SZ.config.CATEGORIES.filter(function (c) { return c.enabled; });
    const loaded = await Promise.all([
      SZ.data.listListings({ pageSize: 1 }),
      SZ.data.getActiveFeatures(),
      SZ.data.listListings({ sort: 'newest', pageSize: SZ.config.PAGE_SIZE }),
      Promise.all(cats.map(function (c) { return SZ.data.listListings({ category: c.slug, pageSize: ROW_COUNT }); })),
    ]);
    const overall = loaded[0], refs = loaded[1], latest = loaded[2], perCat = loaded[3];
    if (overall.total === 0) return emptyHtml();

    const featuredIds = {};
    refs.forEach(function (f) { featuredIds[f.listingId] = true; });
    const featured = (await Promise.all(refs.map(function (f) {
      return SZ.data.getListing(f.listingId).catch(function () { return null; });
    }))).filter(Boolean);

    const tiles = cats.map(function (c, i) {
      return '<li><a class="cat" href="' + esc(buildHashQuery('/browse', { cat: c.slug })) + '">' +
        '<span class="cat__icon" aria-hidden="true">' + esc(c.icon) + '</span>' +
        '<span class="cat__label">' + esc(c.label) + '</span>' +
        '<span class="cat__hint">' + esc(c.hint) + '</span>' +
        '<span class="cat__count">' + esc(listingsText(perCat[i].total)) + '</span></a></li>';
    }).join('');
    let html = section('h-cats', 'Shop by category', '<ul class="cat-grid">' + tiles + '</ul>');

    if (featured.length) {
      const cards = featured.map(function (l) { return '<li>' + SZ.ui.listingCard(l, { featured: true }) + '</li>'; }).join('');
      html += section('h-featured', 'Featured',
        '<div class="card-row" role="region" aria-label="Featured listings" tabindex="0"><ul class="card-row__list">' + cards + '</ul></div>', '',
        featured.some(function (l) { return l.isDemo; }) ? 'Demo featured listings. Nobody paid for these.' : '');
    }

    html += section('h-latest', 'Just listed', cardGrid(latest.items, featuredIds), seeAll('#/browse', 'See all'));

    cats.map(function (c, i) { return { cat: c, res: perCat[i] }; })
      .filter(function (x) { return x.res.total > 0; })
      .sort(function (a, b) { return b.res.total - a.res.total; })
      .slice(0, 3)
      .forEach(function (x) {
        html += section('h-cat-' + x.cat.slug, x.cat.label, cardGrid(x.res.items, featuredIds),
          seeAll(buildHashQuery('/browse', { cat: x.cat.slug }), 'See all (' + x.res.total + ')'));
      });
    return html;
  }

  async function loadHome() {
    const box = document.getElementById('home-data');
    if (!box) return;
    box.setAttribute('aria-busy', 'true');
    box.innerHTML = skeletonHtml();
    let html;
    try { html = await buildData(); }
    catch (err) { console.error('[Spawnza] home data failed', err && err.message); html = errorHtml(); }
    if (document.getElementById('home-data') !== box) return;   // the person left the page while this loaded
    box.innerHTML = html;
    box.removeAttribute('aria-busy');
  }
  SZ.ui.actions['home-retry'] = function () { loadHome(); };

  function steps(items) {
    return '<ol class="steps">' + items.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ol>';
  }

  SZ.router.routes.push({
    path: '/', nav: 'home', title: null,
    render: function () {
      const chips = QUICK_SEARCHES.map(function (q) {
        return '<li><a class="chip chip--link" href="' + esc(buildHashQuery('/browse', { q: q })) + '">' + esc(q) + '</a></li>';
      }).join('');
      return '<section class="container"><div class="hero">' +
          '<svg class="hero__mark" width="64" height="64" aria-hidden="true" focusable="false"><use href="#sz-logo"/></svg>' +
          '<p class="eyebrow">South Africa\'s gaming &amp; tech marketplace</p>' +
          '<h1>Your gear.<br><span class="accent">Your game.</span></h1>' +
          '<p class="lead">Buy and sell second-hand games, consoles and tech across South Africa.</p>' +
          '<form class="hero-search" role="search" aria-label="Search listings" data-form="search" novalidate>' +
            '<label class="sr-only" for="home-q">Search Spawnza</label>' +
            '<input class="field field--lg" id="home-q" type="search" name="q" placeholder="Search games, consoles…" autocomplete="off" enterkeyhint="search" maxlength="80">' +
            '<button class="btn btn--secondary btn--lg" type="submit">Search</button>' +
          '</form>' +
          '<ul class="qchips" aria-label="Popular searches">' + chips + '</ul>' +
          '<a class="btn btn--primary btn--lg" href="#/sell">Sell an item</a>' +
        '</div></section>' +
        '<div id="home-data" aria-busy="true">' + skeletonHtml() + '</div>' +
        '<section class="container section" aria-labelledby="h-how"><h2 id="h-how">How it works</h2><div class="how">' +
          '<div class="how__col"><h3>Buying</h3>' + steps(['Search or browse for what you need.', 'Contact the seller.', 'Inspect the item and pay in person.']) + '</div>' +
          '<div class="how__col"><h3>Selling</h3>' + steps(['Post your item with photos and a price.', 'Buyers get in touch with you.', 'Mark it as sold.']) + '</div>' +
        '</div></section>' +
        '<section class="container section">' + SZ.ui.buyerWarning({ moreLink: true }) + '</section>' +
        '<section class="container section"><div class="cta"><div><h2>Got gear you don\'t use?</h2>' +
          '<p class="muted">Post a listing in a few minutes and let buyers contact you.</p></div>' +
          '<a class="btn btn--primary btn--lg" href="#/sell">Sell an item</a></div></section>';
    },
    after: function () { loadHome(); },
  });
})();

/* ===== SZ:VIEW-BROWSE ===== */
/* V04 Browse. ALL state lives in the URL hash: #/browse?q=&cat=&prov=&city=&min=&max=&sort=&page=
   Changes made on this page are written with history.pushState/replaceState (no full re-render, so the search box keeps
   focus while typing); Back/Forward and links from other pages go through the router, which re-reads the URL.
   Typing in the search box replaces the current history entry; filters and sort add one. */
(function () {
  const PAGE = SZ.config.PAGE_SIZE;
  const MAX_PAGES = 50;
  const SORTS = [['newest', 'Newest'], ['price-asc', 'Price: low to high'], ['price-desc', 'Price: high to low']];
  const $ = function (sel, root) { return (root || document).querySelector(sel); };
  let current = null;       // the state last applied to the page
  let loadToken = 0;
  let typeTimer = 0;

  const has = function (o, k) { return Object.prototype.hasOwnProperty.call(o, k); };
  const clean = function (v, max) { return String(v === undefined || v === null ? '' : v).replace(/\s+/g, ' ').trim().slice(0, max); };
  const digits = function (v) { const s = String(v === undefined || v === null ? '' : v); return /^\d{1,7}$/.test(s) ? String(parseInt(s, 10)) : ''; };
  const listingsText = function (n) { return n + (n === 1 ? ' listing' : ' listings'); };
  const enabledCats = function () { return SZ.config.CATEGORIES.filter(function (c) { return c.enabled; }); };
  const catLabel = function (slug) { const c = enabledCats().find(function (x) { return x.slug === slug; }); return c ? c.label : ''; };

  /* URL -> state. Anything invalid is quietly ignored, so a hand-edited or shared link can never break the page. */
  function readState(query) {
    const q = query || {};
    const cat = enabledCats().some(function (c) { return c.slug === q.cat; }) ? q.cat : '';
    const prov = typeof q.prov === 'string' && has(SZ.config.PROVINCES, q.prov) ? q.prov : '';
    let min = digits(q.min), max = digits(q.max);
    if (min && max && Number(min) > Number(max)) { min = ''; max = ''; }
    const page = Math.min(MAX_PAGES, Math.max(1, parseInt(q.page, 10) || 1));
    return {
      q: clean(q.q, 80), cat: cat, prov: prov, city: prov ? clean(q.city, 60) : '', min: min, max: max,
      sort: SORTS.some(function (s) { return s[0] === q.sort; }) ? q.sort : 'newest', page: page,
    };
  }
  function hashOf(s) {
    return buildHashQuery('/browse', {
      q: s.q, cat: s.cat, prov: s.prov, city: s.city, min: s.min, max: s.max,
      sort: s.sort === 'newest' ? '' : s.sort, page: s.page > 1 ? s.page : '',
    });
  }
  const stateFromUrl = function () { return readState(parseHashQuery(window.location.hash).query); };
  function filterCount(s) { return (s.cat ? 1 : 0) + (s.prov ? 1 : 0) + (s.city ? 1 : 0) + (s.min || s.max ? 1 : 0); }
  function priceText(s) {
    if (s.min && s.max) return fmtZAR(Number(s.min)) + ' to ' + fmtZAR(Number(s.max));
    if (s.min) return 'from ' + fmtZAR(Number(s.min));
    if (s.max) return 'up to ' + fmtZAR(Number(s.max));
    return '';
  }
  function describe(s) {
    const parts = [];
    if (s.cat) parts.push(catLabel(s.cat));
    if (s.city) parts.push(s.city + ', ' + s.prov); else if (s.prov) parts.push(s.prov);
    if (s.min || s.max) parts.push(priceText(s));
    if (s.q) parts.push('matching \u201C' + s.q + '\u201D');
    return parts.join(' \u00B7 ');
  }

  /* ---------- markup ---------- */
  function options(list, value, firstLabel) {
    return '<option value="">' + esc(firstLabel) + '</option>' + list.map(function (o) {
      return '<option value="' + esc(o[0]) + '"' + (o[0] === value ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
    }).join('');
  }
  function cityOptions(prov, city) {
    if (!prov) return '<option value="">Choose a province first</option>';
    const list = SZ.config.PROVINCES[prov].slice();
    if (city && list.indexOf(city) === -1) list.push(city);          // a shared link may name a city we do not list
    return options(list.map(function (c) { return [c, c]; }), city, 'All cities');
  }
  function filtersHtml(s, p) {
    const catOpts = options(enabledCats().map(function (c) { return [c.slug, c.label]; }), s.cat, 'All categories');
    const provOpts = options(Object.keys(SZ.config.PROVINCES).map(function (n) { return [n, n]; }), s.prov, 'All provinces');
    return '<form class="filters" data-form="browse-filters" novalidate>' +
      '<div><label class="flabel" for="' + p + '-cat">Category</label><select class="field" id="' + p + '-cat" name="cat">' + catOpts + '</select></div>' +
      '<div><label class="flabel" for="' + p + '-prov">Province</label><select class="field" id="' + p + '-prov" name="prov">' + provOpts + '</select></div>' +
      '<div><label class="flabel" for="' + p + '-city">City</label><select class="field" id="' + p + '-city" name="city"' + (s.prov ? '' : ' disabled') + '>' + cityOptions(s.prov, s.city) + '</select></div>' +
      '<div class="filters__row2">' +
        '<div><label class="flabel" for="' + p + '-min">Min price (R)</label><input class="field" id="' + p + '-min" name="min" type="text" inputmode="numeric" autocomplete="off" maxlength="9" placeholder="0" value="' + esc(s.min) + '"><p class="ferror" id="' + p + '-min-err" hidden></p></div>' +
        '<div><label class="flabel" for="' + p + '-max">Max price (R)</label><input class="field" id="' + p + '-max" name="max" type="text" inputmode="numeric" autocomplete="off" maxlength="9" placeholder="No limit" value="' + esc(s.max) + '"><p class="ferror" id="' + p + '-max-err" hidden></p></div>' +
      '</div>' +
      '<div class="filters__actions"><button class="btn btn--primary" type="submit">Apply filters</button>' +
      '<button class="btn btn--secondary" type="button" data-action="browse-clear">Clear all</button></div></form>';
  }
  function chipsHtml(s) {
    const chips = [];
    const add = function (key, text) {
      chips.push('<li><button type="button" class="chip chip--removable" data-action="browse-remove" data-key="' + key + '" aria-label="Remove filter: ' + esc(text) + '"><span>' + esc(text) + '</span>' + SZ.ui.icon('close', 'icon--sm') + '</button></li>');
    };
    if (s.q) add('q', '\u201C' + s.q + '\u201D');
    if (s.cat) add('cat', catLabel(s.cat));
    if (s.prov) add('prov', s.prov);
    if (s.city) add('city', s.city);
    if (s.min || s.max) add('price', priceText(s).replace(/^./, function (c) { return c.toUpperCase(); }));
    if (!chips.length) return '';
    return chips.join('') + '<li><button type="button" class="link link--btn" data-action="browse-clear">Clear all</button></li>';
  }
  const filtersLabel = function (s) { const n = filterCount(s); return n ? 'Filters (' + n + ')' : 'Filters'; };

  /* ---------- keeping the controls in step with the URL ---------- */
  function fillForm(form, s) {
    if (!form) return;
    form.elements.cat.value = s.cat;
    form.elements.prov.value = s.prov;
    form.elements.city.innerHTML = cityOptions(s.prov, s.city);
    form.elements.city.value = s.city;
    form.elements.city.disabled = !s.prov;
    form.elements.min.value = s.min;
    form.elements.max.value = s.max;
    showErrors(form, {});
  }
  function syncControls(s) {
    const input = $('#b-q');
    if (input && document.activeElement !== input) input.value = s.q;
    const sort = $('#b-sort');
    if (sort) sort.value = s.sort;
    const fb = $('[data-action="browse-open-filters"]');
    if (fb) fb.textContent = filtersLabel(s);
    const chips = $('#browse-chips');
    if (chips) chips.innerHTML = chipsHtml(s);
    fillForm($('#browse-root .filters'), s);
  }
  function showErrors(form, errors) {
    ['min', 'max'].forEach(function (k) {
      const input = form.elements[k];
      const msg = form.querySelector('#' + input.id + '-err');
      if (!msg) return;
      msg.textContent = errors[k] || '';
      msg.hidden = !errors[k];
      if (errors[k]) { input.setAttribute('aria-invalid', 'true'); input.setAttribute('aria-describedby', msg.id); }
      else { input.removeAttribute('aria-invalid'); input.removeAttribute('aria-describedby'); }
    });
  }

  /* ---------- changing state ---------- */
  function commit(patch, mode) {
    const base = stateFromUrl();
    const next = readState(Object.assign({}, base, patch, { page: 1 }));
    const hash = hashOf(next);
    if (hash !== (window.location.hash || '#/browse')) {
      window.history[mode === 'replace' ? 'replaceState' : 'pushState'](null, '', hash);
    }
    refresh();
  }
  function refresh() {
    if (!$('#browse-root')) return;                      // the person left the page
    current = stateFromUrl();
    syncControls(current);
    load(current);
  }

  /* ---------- loading results ---------- */
  function cardItems(items, featuredIds) {
    return items.map(function (l) { return '<li>' + SZ.ui.listingCard(l, { featured: !!featuredIds[l.id] }) + '</li>'; }).join('');
  }
  function emptyHtml(s) {
    const filtered = !!(s.q || filterCount(s));
    return SZ.ui.emptyState({
      icon: 'search',
      title: filtered ? 'No listings match your search' : 'No listings yet',
      text: filtered ? 'Try fewer filters or a different word.' : 'Nothing is for sale right now. Be the first to list an item.',
      actionsHtml: (filtered ? '<button type="button" class="btn btn--secondary" data-action="browse-clear">Clear filters</button>' : '') +
        '<a class="btn btn--primary" href="#/sell">List yours</a>',
    });
  }
  function moreHtml(shown, total) {
    if (shown >= total) return '';
    return '<div class="more"><p class="muted" id="browse-more-note">Showing ' + shown + ' of ' + total + '</p>' +
      '<button type="button" class="btn btn--secondary" data-action="browse-load-more">Load more</button></div>';
  }
  const filtersOf = function (s) {
    return { q: s.q, category: s.cat, province: s.prov, city: s.city, minPrice: s.min, maxPrice: s.max, sort: s.sort };
  };

  async function load(s) {
    const box = $('#browse-results');
    if (!box) return;
    const mine = ++loadToken;
    box.setAttribute('aria-busy', 'true');
    const skeletonTimer = window.setTimeout(function () {       // only flash a skeleton if loading is not instant
      if (mine === loadToken && $('#browse-results') === box) box.innerHTML = SZ.ui.skeletonCards(6);
    }, 120);
    let html, countText, status = null;
    try {
      const base = filtersOf(s);
      const first = await SZ.data.listListings(Object.assign({}, base, { page: 1, pageSize: PAGE }));
      const pages = Math.min(s.page, Math.max(1, Math.ceil(first.total / PAGE)));
      let items = first.items;
      if (pages > 1) {
        const rest = await Promise.all(Array.from({ length: pages - 1 }, function (_, i) {
          return SZ.data.listListings(Object.assign({}, base, { page: i + 2, pageSize: PAGE }));
        }));
        rest.forEach(function (r) { items = items.concat(r.items); });
      }
      const featuredIds = {};
      (await SZ.data.getActiveFeatures()).forEach(function (f) { featuredIds[f.listingId] = true; });
      status = { total: first.total, pages: pages };
      html = first.total === 0 ? emptyHtml(s)
        : '<ul class="card-grid" id="browse-grid">' + cardItems(items, featuredIds) + '</ul>' + moreHtml(items.length, first.total);
      const d = describe(s);
      countText = '<strong>' + esc(listingsText(first.total)) + '</strong>' + (d ? ' <span class="muted">\u00B7 ' + esc(d) + '</span>' : '');
    } catch (err) {
      console.error('[Spawnza] browse failed', err && err.message);
      html = SZ.ui.emptyState({
        icon: 'close', title: 'Listings did not load', text: 'Something went wrong while loading the listings. Please try again.',
        actionsHtml: '<button type="button" class="btn btn--secondary" data-action="browse-retry">Try again</button>',
      });
      countText = '';
    }
    window.clearTimeout(skeletonTimer);
    if (mine !== loadToken || $('#browse-results') !== box) return;     // a newer load or navigation won
    box.innerHTML = html;
    box.removeAttribute('aria-busy');
    const count = $('#browse-count');
    if (count) count.innerHTML = countText;
    if (status && status.pages !== s.page) window.history.replaceState(null, '', hashOf(Object.assign({}, s, { page: status.pages })));
  }

  async function loadMore() {
    const s = stateFromUrl();
    const box = $('#browse-results'), grid = $('#browse-grid');
    if (!box || !grid) return;
    const mine = ++loadToken;
    const next = s.page + 1;
    const btn = $('[data-action="browse-load-more"]', box);
    if (btn) btn.disabled = true;
    try {
      const res = await SZ.data.listListings(Object.assign(filtersOf(s), { page: next, pageSize: PAGE }));
      const featuredIds = {};
      (await SZ.data.getActiveFeatures()).forEach(function (f) { featuredIds[f.listingId] = true; });
      if (mine !== loadToken || $('#browse-grid') !== grid) return;
      const before = grid.children.length;
      grid.insertAdjacentHTML('beforeend', cardItems(res.items, featuredIds));
      window.history.replaceState(null, '', hashOf(Object.assign({}, s, { page: next })));
      current = stateFromUrl();
      const more = $('.more', box);
      if (more) more.outerHTML = moreHtml(grid.children.length, res.total);
      else if (grid.children.length < res.total) box.insertAdjacentHTML('beforeend', moreHtml(grid.children.length, res.total));
      const firstNew = grid.children[before] && grid.children[before].querySelector('a.card');
      if (firstNew) firstNew.focus();
    } catch (err) {
      console.error('[Spawnza] browse load more failed', err && err.message);
      if (btn) btn.disabled = false;
      SZ.ui.toast('Could not load more listings. Please try again.', { type: 'error' });
    }
  }

  /* ---------- the filter form (sidebar on desktop, bottom sheet on phones) ---------- */
  function readForm(form) {
    const v = function (n) { return String(form.elements[n].value || '').replace(/[\s\u00A0]/g, ''); };
    const min = v('min'), max = v('max'), errors = {};
    if (min && !/^\d{1,7}$/.test(min)) errors.min = 'Use digits only, for example 2000.';
    if (max && !/^\d{1,7}$/.test(max)) errors.max = 'Use digits only, for example 5000.';
    if (!errors.min && !errors.max && min && max && Number(min) > Number(max)) errors.max = 'The maximum must be the same as or more than the minimum.';
    return {
      errors: errors,
      values: { cat: form.elements.cat.value, prov: form.elements.prov.value, city: form.elements.prov.value ? form.elements.city.value : '', min: min, max: max },
    };
  }
  SZ.ui.forms['browse-filters'] = function (form) {
    const r = readForm(form);
    showErrors(form, r.errors);
    const bad = ['min', 'max'].filter(function (k) { return r.errors[k]; })[0];
    if (bad) { form.elements[bad].focus(); return; }          // invalid input: do not run the search
    SZ.ui.modal.close();
    commit(r.values, 'push');
  };
  SZ.ui.forms['browse-search'] = function (form) {
    window.clearTimeout(typeTimer);
    commit({ q: clean(form.elements.q.value, 80) }, 'replace');
  };

  SZ.ui.actions['browse-open-filters'] = function () {
    SZ.ui.modal.open({ title: 'Filters', bodyHtml: filtersHtml(current || stateFromUrl(), 'bm') });
  };
  SZ.ui.actions['browse-clear'] = function () {
    SZ.ui.modal.close();
    commit({ q: '', cat: '', prov: '', city: '', min: '', max: '' }, 'push');
    const c = $('#browse-count'); if (c) c.focus();
  };
  SZ.ui.actions['browse-remove'] = function (btn) {
    const key = btn.getAttribute('data-key');
    const patch = key === 'price' ? { min: '', max: '' } : key === 'prov' ? { prov: '', city: '' } : { [key]: '' };
    commit(patch, 'push');
    const next = $('#browse-chips button'), c = $('#browse-count');
    if (next) next.focus(); else if (c) c.focus();
  };
  SZ.ui.actions['browse-load-more'] = function () { loadMore(); };
  SZ.ui.actions['browse-retry'] = function () { refresh(); };

  /* Delegated field events (added once). */
  document.addEventListener('change', function (e) {
    const t = e.target;
    if (!t || !t.closest) return;
    if (t.id === 'b-sort') { commit({ sort: t.value }, 'push'); return; }
    const form = t.closest('.filters');
    if (form && t.name === 'prov') {                          // province decides the city list; changing it clears the city
      form.elements.city.innerHTML = cityOptions(t.value, '');
      form.elements.city.disabled = !t.value;
    }
  });
  document.addEventListener('input', function (e) {
    if (!e.target || e.target.id !== 'b-q') return;
    window.clearTimeout(typeTimer);
    const value = e.target.value;
    typeTimer = window.setTimeout(function () {                 // 250 ms debounce; Enter submits straight away
      if (!$('#browse-root')) return;
      commit({ q: clean(value, 80) }, 'replace');
    }, 250);
  });
  window.addEventListener('popstate', function () {             // Back/Forward between states made on this page
    if (parseHashQuery(window.location.hash).path === '/browse') refresh();
  });

  SZ.router.routes.push({
    path: '/browse', nav: 'browse', title: 'Browse',
    render: function (ctx) {
      const s = readState(ctx.query);
      const sortOpts = SORTS.map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === s.sort ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('');
      return '<section class="container page" id="browse-root"><h1>Browse</h1>' +
        '<div class="browse__layout">' +
          '<aside class="browse__side" aria-label="Filters"><h2 class="browse__side-title">Filters</h2>' + filtersHtml(s, 'bs') + '</aside>' +
          '<div class="browse__main">' +
            '<div class="browse__bar">' +
              '<form class="browse-search" role="search" aria-label="Search listings" data-form="browse-search" novalidate>' +
                '<label class="sr-only" for="b-q">Search listings</label>' +
                '<input class="field" id="b-q" type="search" name="q" placeholder="Search listings\u2026" autocomplete="off" enterkeyhint="search" maxlength="80" value="' + esc(s.q) + '">' +
                '<button class="btn btn--secondary" type="submit">Search</button></form>' +
              '<div class="browse__tools">' +
                '<button type="button" class="btn btn--secondary" data-action="browse-open-filters">' + esc(filtersLabel(s)) + '</button>' +
                '<div class="sortbox"><label class="flabel" for="b-sort">Sort by</label><select class="field" id="b-sort">' + sortOpts + '</select></div>' +
              '</div></div>' +
            '<ul class="fchips" id="browse-chips" aria-label="Active filters">' + chipsHtml(s) + '</ul>' +
            '<p class="results-head" id="browse-count" role="status" tabindex="-1"></p>' +
            '<div id="browse-results" aria-busy="true">' + SZ.ui.skeletonCards(6) + '</div>' +
          '</div></div></section>';
    },
    after: function () { refresh(); },
  });
})();

/* ===== SZ:VIEW-LISTING ===== */
/* V05: listing detail page (#/listing/:id), the on-device saved list (SZ.saved) and the Saved page.
   D6 default applied: the Saved page is built here because the heart toggle is useless without it.
   Contact seller and Report are stubs until V11 / V12. Seller profile link goes to #/seller/:id (V15). */
SZ.saved = (function () {
  const KEY = 'saved', MAX = 200;      // ids of listings saved on THIS device only, newest first (stored through SZ.store)
  const read = function () {
    const v = SZ.store.get(KEY, []);
    return Array.isArray(v) ? v.filter(function (x) { return typeof x === 'string'; }) : [];
  };
  return {
    ids: read,
    has: function (id) { return read().indexOf(id) !== -1; },
    toggle: function (id) {                       // returns true when the listing is now saved
      const list = read();
      const at = list.indexOf(id);
      if (at !== -1) list.splice(at, 1); else list.unshift(id);
      SZ.store.set(KEY, list.slice(0, MAX));
      return at === -1;
    },
  };
})();

(function () {
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const viewed = new Set();            // listing ids already counted this session (a session = this page load)
  const titles = new Map();            // id -> title, so the router can set document.title
  let currentListing = null;
  let gal = null;                      // gallery state for the page on screen
  let lb = null;                       // lightbox state while it is open
  const $ = function (sel, root) { return (root || document).querySelector(sel); };
  const reduced = function () { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); };

  function fmtDate(iso) { const d = new Date(iso); return isNaN(d.getTime()) ? '' : d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
  function monthYear(iso) { const d = new Date(iso); return isNaN(d.getTime()) ? '' : MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
  const plural = function (n, one, many) { return n + ' ' + (n === 1 ? one : many); };

  /* Until real photos exist (V08) every listing shows 3 labelled placeholder images, so the gallery can be used and tested. */
  function galleryImages(l) {
    if (!l.isDemo && l.photoIds && l.photoIds.length) return l.photoIds.map(function (id, i, a) {
      return { src: SZ.media.cached(id) || SZ.art(l.category, id, 'Loading photo'), photo: id, alt: 'Photo ' + (i + 1) + ' of ' + a.length + ': ' + l.title };
    });
    if (!l.isDemo) return [{ src: SZ.art(l.category, l.id, 'No photo yet'), alt: 'No photo yet. The seller has not added photos.' }];
    return [1, 2, 3].map(function (n) {
      return { src: SZ.art(l.category, l.id + ':' + n, 'Demo photo ' + n), alt: 'Demo photo ' + n + ' of 3' };
    });
  }

  function galleryHtml(l, imgs) {
    const n = imgs.length;
    const slides = imgs.map(function (im, i) {
      return '<li class="gallery__slide" role="group" aria-roledescription="slide" aria-label="Photo ' + (i + 1) + ' of ' + n + '">' +
        '<button type="button" class="gallery__zoom" data-action="gallery-zoom" data-index="' + i + '" aria-label="Enlarge photo ' + (i + 1) + ' of ' + n + '">' +
        '<img src="' + esc(im.src) + '" alt="' + esc(im.alt) + '"' + (im.photo ? ' data-photo="' + esc(im.photo) + '"' : '') + ' width="400" height="300"' + (i === 0 ? ' fetchpriority="high"' : ' loading="lazy"') + ' decoding="async"></button></li>';
    }).join('');
    const thumbs = n < 2 ? '' : '<div class="gallery__thumbs" role="group" aria-label="Choose a photo">' + imgs.map(function (im, i) {
      return '<button type="button" class="gallery__thumb" data-action="gallery-go" data-index="' + i + '" aria-label="Show photo ' + (i + 1) + ' of ' + n + '"' + (i === 0 ? ' aria-current="true"' : '') + '>' +
        '<img src="' + esc(im.src) + '" alt=""' + (im.photo ? ' data-photo="' + esc(im.photo) + '"' : '') + ' width="64" height="48" loading="lazy" decoding="async"></button>';
    }).join('') + '</div>';
    return '<div class="gallery" role="region" aria-roledescription="carousel" aria-label="Photos of ' + esc(l.title) + '">' +
      '<ul class="gallery__track" tabindex="0" aria-label="Photos. Use the left and right arrow keys to move between them.">' + slides + '</ul>' +
      (n > 1 ? '<span class="gallery__count" aria-hidden="true">1 / ' + n + '</span>' : '') + thumbs + '</div>';
  }

  /* ---------- gallery behaviour (swipe = native scroll-snap; thumbnails and arrow keys scroll the same strip) ---------- */
  function setIndex(i) {
    if (!gal) return;
    gal.index = i;
    const count = $('.gallery__count');
    if (count) count.textContent = (i + 1) + ' / ' + gal.n;
    Array.prototype.forEach.call(document.querySelectorAll('.gallery__thumb'), function (t, k) {
      if (k === i) t.setAttribute('aria-current', 'true'); else t.removeAttribute('aria-current');
    });
  }
  function goTo(i) {
    const track = $('.gallery__track');
    if (!gal || !track) return;
    const next = Math.max(0, Math.min(gal.n - 1, i));
    track.scrollTo({ left: next * track.clientWidth, behavior: reduced() ? 'auto' : 'smooth' });
    setIndex(next);
  }
  function wireGallery() {
    const track = $('.gallery__track');
    if (!track || !gal) return;
    let raf = 0;
    track.addEventListener('scroll', function () {
      window.cancelAnimationFrame(raf);
      raf = window.requestAnimationFrame(function () {
        const i = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
        if (i !== gal.index && i >= 0 && i < gal.n) setIndex(i);
      });
    }, { passive: true });
    track.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        e.preventDefault();
        goTo(gal.index + (e.key === 'ArrowRight' ? 1 : -1));
      }
    });
  }

  function showLightbox(i) {
    if (!lb) return;
    lb.index = (i + lb.n) % lb.n;
    const img = $('#lb-img'), count = $('#lb-count');
    if (img) { img.src = lb.images[lb.index].src; img.alt = lb.images[lb.index].alt; }
    if (count) count.textContent = 'Photo ' + (lb.index + 1) + ' of ' + lb.n;
  }
  /* V11: the five Contact states. sold: nothing; demo: note; signed out: login link; own listing: note; otherwise the button. */
  function contactHtml(l, sold) {
    if (sold) return '';
    if (l.isDemo) return '<p class="muted listing__nocontact">Demo listing \u2014 there is no real seller.</p>';
    const me = SZ.auth && SZ.auth.user;
    if (!me) return '<a class="btn btn--primary btn--lg" href="' + esc(buildHashQuery('/login', { next: window.location.hash.replace(/^#/, '') })) + '">Log in to contact seller</a>';
    if (me.id === l.sellerId) return '<p class="muted listing__nocontact">This is your listing.</p>';
    return '<button type="button" class="btn btn--primary btn--lg" data-action="listing-contact">Contact seller</button>';
  }
  function openLightbox(start) {
    if (!gal) return;
    lb = { images: gal.images, n: gal.images.length, index: start };
    const dlg = SZ.ui.modal.open({
      title: 'Photos',
      bodyHtml: '<div class="lightbox"><img class="lightbox__img" id="lb-img" src="" alt="" width="400" height="300">' +
        '<div class="lightbox__bar"><button type="button" class="btn btn--secondary" data-action="lb-prev" aria-label="Previous photo">\u2039</button>' +
        '<span id="lb-count" role="status" aria-live="polite"></span>' +
        '<button type="button" class="btn btn--secondary" data-action="lb-next" aria-label="Next photo">\u203A</button></div></div>',
      onClose: function () { const at = lb ? lb.index : 0; lb = null; goTo(at); },
    });
    showLightbox(start);
    dlg.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); showLightbox(lb.index + (e.key === 'ArrowRight' ? 1 : -1)); }
    });
  }

  /* ---------- actions ---------- */
  const A = SZ.ui.actions;
  A['gallery-go'] = function (el) { goTo(Number(el.getAttribute('data-index'))); };
  A['gallery-zoom'] = function (el) { openLightbox(Number(el.getAttribute('data-index'))); };
  A['lb-prev'] = function () { showLightbox(lb.index - 1); };
