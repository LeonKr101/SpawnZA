<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spawnza — Your gear. Your game.</title>
<meta name="description" content="Buy and sell second-hand games, consoles and tech across South Africa.">
<meta name="theme-color" content="#0E1013">
<meta name="color-scheme" content="dark">
<!-- Keep the prototype out of search results until launch (MASTERPLAN V28: remove this line then). -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%232DFF81'/%3E%3Cg fill='%2304150B'%3E%3Crect x='12.5' y='7.5' width='20' height='5'/%3E%3Crect x='7.5' y='12.5' width='5' height='5'/%3E%3Crect x='12.5' y='17.5' width='15' height='5'/%3E%3Crect x='27.5' y='22.5' width='5' height='5'/%3E%3Crect x='7.5' y='27.5' width='20' height='5'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* ===== SZ:CSS-TOKENS ===== */
:root{
  color-scheme: dark;
  --bg:#0E1013; --surface:#161A1F; --surface-2:#1E242B; --border:#2B323B;
  --text:#EAEEF2; --muted:#A0AAB5;
  --accent:#2DFF81; --accent-ink:#04150B; --accent-dim:#1FBF62;
  --danger:#FF5C6C; --warn:#FFB020; --info:#4CC9F0;
  --radius-sm:8px; --radius:14px; --radius-lg:20px;
  --shadow:0 6px 24px rgba(0,0,0,.35);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --maxw:1200px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px; --space-7:48px; --space-8:64px;
}
/* Layout sizes used by the shell (kept apart from the design tokens above) */
:root{ --header-h:56px; --tabbar-h:64px; --gutter:16px; }
@media (min-width:640px){ :root{ --gutter:24px; } }

/* ===== SZ:CSS-BASE ===== */
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
body{ margin:0; background:var(--bg); color:var(--text); font:400 1rem/1.5 var(--font); }
[hidden]{ display:none !important; }
h1,h2,h3,p{ margin:0; }
h1{ font-size:clamp(1.75rem,5vw,2.75rem); line-height:1.1; letter-spacing:-.02em; }
h2{ font-size:clamp(1.35rem,3.5vw,1.9rem); line-height:1.2; letter-spacing:-.01em; }
h3{ font-size:1.15rem; line-height:1.3; }
a{ color:inherit; text-decoration:none; }
ul{ list-style:none; margin:0; padding:0; }
button,input{ font:inherit; color:inherit; }
button{ cursor:pointer; }
svg{ flex:none; }
.icon{ width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.muted{ color:var(--muted); }
.accent{ color:var(--accent); }
.sr-only{ position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
.container{ width:100%; max-width:var(--maxw); margin-inline:auto; padding-inline:var(--gutter); }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
[tabindex="-1"]:focus{ outline:none; }
.skip-link{ position:absolute; left:var(--space-4); top:-120px; z-index:100; padding:var(--space-3) var(--space-4); background:var(--accent); color:var(--accent-ink); font-weight:700; border-radius:var(--radius-sm); }
.skip-link:focus{ top:var(--space-3); }
.sprite{ position:absolute; width:0; height:0; overflow:hidden; }
html.modal-open{ overflow:hidden; }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
}

/* ===== SZ:CSS-COMPONENTS ===== */
/* Button */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:var(--space-2); min-height:44px; padding:0 var(--space-5); border:1px solid transparent; border-radius:var(--radius-sm); font-weight:700; line-height:1.2; text-align:center; transition:background-color .15s,border-color .15s,color .15s; }
.btn--primary{ background:var(--accent); color:var(--accent-ink); }
.btn--primary:hover{ background:var(--accent-dim); }
.btn--secondary{ background:transparent; color:var(--text); border-color:var(--border); }
.btn--secondary:hover{ border-color:var(--accent); }
.btn--ghost{ background:transparent; color:var(--text); }
.btn--ghost:hover{ background:var(--surface-2); }
.btn--danger{ background:var(--danger); color:#1A0508; }
.btn--danger:hover{ filter:brightness(.92); }
.btn--lg{ min-height:52px; padding:0 var(--space-6); font-size:1.0625rem; }
.btn[disabled],.btn[aria-disabled="true"]{ opacity:.5; cursor:not-allowed; }
.icon-btn{ display:inline-grid; place-items:center; width:44px; height:44px; padding:0; border:0; border-radius:var(--radius-sm); background:transparent; color:var(--text); transition:background-color .15s; }
.icon-btn:hover{ background:var(--surface-2); }
/* Text field (search uses it now; forms reuse it from V07) */
.field{ width:100%; min-width:0; min-height:44px; padding:0 var(--space-4); border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); color:var(--text); }
.field::placeholder{ color:var(--muted); opacity:1; }
.field:focus-visible{ outline-offset:0; border-color:var(--accent); }
/* Badge: DEMO, SOLD, FEATURED, NEW, BUSINESS (self-declared) */
.badge{ display:inline-flex; align-items:center; padding:2px var(--space-2); border:1px solid var(--border); border-radius:999px; background:var(--surface-2); color:var(--text); font-size:.75rem; font-weight:700; letter-spacing:.04em; line-height:1.4; text-transform:uppercase; white-space:nowrap; }
.badge--demo{ color:var(--warn); border-color:rgba(255,176,32,.45); background:rgba(255,176,32,.1); }
.badge--sold{ color:var(--danger); border-color:rgba(255,92,108,.45); background:rgba(255,92,108,.1); }
.badge--featured{ color:var(--accent); border-color:rgba(45,255,129,.45); background:rgba(45,255,129,.1); }
.badge--new{ color:var(--info); border-color:rgba(76,201,240,.45); background:rgba(76,201,240,.1); }
.badge--business{ color:var(--text); }
/* Banner (Preview mode) */
.banner{ padding:var(--space-2) var(--space-4); background:rgba(255,176,32,.12); border-bottom:1px solid rgba(255,176,32,.5); font-size:.875rem; text-align:center; }
/* Toast */
.toasts{ position:fixed; left:50%; bottom:calc(var(--tabbar-h) + var(--space-4) + env(safe-area-inset-bottom,0px)); z-index:90; display:flex; flex-direction:column; gap:var(--space-2); width:min(92vw,420px); transform:translateX(-50%); pointer-events:none; }
.toast{ pointer-events:auto; padding:var(--space-3) var(--space-4); border:1px solid var(--border); border-left:4px solid var(--info); border-radius:var(--radius-sm); background:var(--surface-2); box-shadow:var(--shadow); opacity:0; transform:translateY(8px); transition:opacity .2s,transform .2s; }
.toast.is-in{ opacity:1; transform:none; }
.toast--success{ border-left-color:var(--accent); }
.toast--error{ border-left-color:var(--danger); }
.toast--warn{ border-left-color:var(--warn); }
/* Modal / sheet */
.modal-backdrop{ position:fixed; inset:0; z-index:80; display:flex; align-items:flex-end; justify-content:center; background:rgba(0,0,0,.6); opacity:0; transition:opacity .2s; }
.modal-backdrop.is-in{ opacity:1; }
.modal{ width:100%; max-height:85vh; max-height:85dvh; overflow:auto; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg) var(--radius-lg) 0 0; box-shadow:var(--shadow); padding:var(--space-4) var(--gutter) calc(var(--space-5) + env(safe-area-inset-bottom,0px)); transform:translateY(16px); transition:transform .2s; }
.modal-backdrop.is-in .modal{ transform:none; }
.modal__head{ display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); margin-bottom:var(--space-3); }
.modal__title{ font-size:1.25rem; }
@media (min-width:640px){
  .modal-backdrop{ align-items:center; padding:var(--space-5); }
  .modal{ max-width:480px; border-radius:var(--radius-lg); padding-bottom:var(--space-5); }
}

/* ===== SZ:CSS-VIEWS ===== */
/* Shell: header */
#app{ display:flex; flex-direction:column; min-height:100vh; min-height:100dvh; padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px)); }
.site-header{ position:sticky; top:0; z-index:40; background:var(--bg); border-bottom:1px solid var(--border); }
.site-header__bar{ display:grid; grid-template-columns:1fr auto; grid-template-areas:"logo actions" "search search"; align-items:center; column-gap:var(--space-3); min-height:var(--header-h); }
.logo{ grid-area:logo; display:inline-flex; align-items:center; gap:var(--space-2); justify-self:start; min-height:44px; }
.logo__word{ font-size:1.375rem; font-weight:800; letter-spacing:-.03em; }
.logo__za{ color:var(--accent); }
.header-actions{ grid-area:actions; display:flex; align-items:center; gap:var(--space-1); }
.search{ grid-area:search; display:none; gap:var(--space-2); padding-bottom:var(--space-3); }
.search.is-open{ display:flex; }
.nav-desktop{ grid-area:nav; display:none; }
.nav-link{ display:inline-flex; align-items:center; min-height:44px; padding:0 var(--space-3); border-radius:var(--radius-sm); color:var(--muted); font-weight:600; transition:background-color .15s,color .15s; }
.nav-link:hover{ color:var(--text); background:var(--surface-2); }
.nav-link[aria-current="page"]{ color:var(--text); background:var(--surface-2); }
.btn[aria-current="page"]{ box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent); }
/* Shell: bottom tab bar (mobile) */
.tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:50; padding-bottom:env(safe-area-inset-bottom,0px); background:var(--surface); box-shadow:0 -1px 0 var(--border); }
.tabbar ul{ display:grid; grid-template-columns:repeat(5,1fr); height:var(--tabbar-h); max-width:560px; margin-inline:auto; }
.tabbar a{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; height:100%; min-width:44px; color:var(--muted); font-size:.75rem; font-weight:600; transition:color .15s; }
.tabbar a:hover{ color:var(--text); }
.tabbar a[aria-current="page"]{ color:var(--accent); }
.tabbar__sell .sell-bubble{ display:grid; place-items:center; width:52px; height:52px; margin-top:-26px; border-radius:18px; background:var(--accent); color:var(--accent-ink); box-shadow:var(--shadow),0 0 0 4px var(--surface); }
.tabbar__sell a{ color:var(--text); }
/* Shell: footer */
.site-footer{ margin-top:var(--space-7); padding-block:var(--space-6); border-top:1px solid var(--border); color:var(--muted); font-size:.875rem; }
.site-footer__inner{ display:flex; flex-direction:column; gap:var(--space-1); }
main{ flex:1 0 auto; }
/* Pages */
.page{ padding-block:var(--space-5) 0; }
.section{ margin-top:var(--space-7); }
.section > h2{ margin-bottom:var(--space-3); }
.hero{ display:flex; flex-direction:column; align-items:flex-start; gap:var(--space-4); padding-top:var(--space-6); max-width:720px; }
.hero__mark{ width:64px; height:64px; border-radius:16px; }
.eyebrow{ color:var(--accent); font-size:.8125rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
.lead{ color:var(--muted); font-size:1.125rem; max-width:34em; }
.cat-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--space-3); }
.cat{ display:flex; flex-direction:column; gap:var(--space-1); height:100%; min-height:44px; padding:var(--space-4); border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); transition:border-color .15s,background-color .15s; }
.cat:hover{ border-color:var(--accent); background:var(--surface-2); }
.cat__icon{ font-size:1.75rem; line-height:1.2; }
.cat__label{ font-weight:700; }
.cat__hint{ color:var(--muted); font-size:.8125rem; }
.card-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--space-3); }
.card{ height:100%; overflow:hidden; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); }
.card__media{ display:grid; place-items:center; aspect-ratio:4/3; background:linear-gradient(135deg,var(--surface-2),var(--surface)); font-size:3rem; }
.card__body{ display:flex; flex-direction:column; align-items:flex-start; gap:var(--space-1); padding:var(--space-3); }
.card__title{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere; }
.price{ font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
.card__price{ color:var(--accent); font-size:1.15rem; }
.card__meta{ color:var(--muted); font-size:.8125rem; }
.card--link{ display:block; color:inherit; text-decoration:none; transition:border-color .15s; }
.card--link:hover{ border-color:var(--accent); }
.card__media img{ display:block; width:100%; height:100%; object-fit:cover; }
.card__badges{ display:flex; flex-wrap:wrap; gap:var(--space-1); }
.chip{ display:inline-flex; align-items:center; padding:2px var(--space-2); border:1px solid var(--border); border-radius:999px; color:var(--muted); font-size:.75rem; line-height:1.4; white-space:nowrap; }
.dev-bar{ display:flex; flex-wrap:wrap; align-items:center; gap:var(--space-3); margin-block:var(--space-4); }
.card--link .card__title{ font-size:.9375rem; line-height:1.3; }
.skel{ background:linear-gradient(90deg,var(--surface-2) 0%,var(--border) 50%,var(--surface-2) 100%); background-size:200% 100%; animation:sz-shimmer 1.4s linear infinite; }
@keyframes sz-shimmer{ from{ background-position:200% 0; } to{ background-position:-200% 0; } }
.skel--line{ display:block; width:100%; height:14px; border-radius:6px; }
.skel--short{ width:55%; }
.skel--title{ width:45%; max-width:260px; height:28px; margin-bottom:var(--space-3); border-radius:8px; }
.skel--tile{ height:104px; border-radius:var(--radius); }
@media (prefers-reduced-motion:reduce){ .skel{ animation:none; } }
/* Homepage */
.field--lg{ min-height:52px; font-size:1.0625rem; }
.hero-search{ display:flex; gap:var(--space-2); width:100%; max-width:560px; }
.hero-search .btn{ padding-inline:var(--space-4); }
.qchips{ display:flex; flex-wrap:wrap; gap:var(--space-2); }
.chip--link{ min-height:44px; padding:0 var(--space-4); color:var(--text); font-size:.9375rem; transition:border-color .15s,background-color .15s; }
.chip--link:hover{ border-color:var(--accent); background:var(--surface-2); }
.section__head{ display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); margin-bottom:var(--space-3); }
.section__note{ margin-top:var(--space-3); font-size:.875rem; }
.link{ display:inline-flex; align-items:center; min-height:44px; color:var(--accent); font-weight:700; white-space:nowrap; }
.link:hover{ text-decoration:underline; }
.cat__count{ margin-top:auto; padding-top:var(--space-2); color:var(--accent); font-size:.8125rem; font-weight:700; }
.card-row{ overflow-x:auto; padding-bottom:var(--space-2); scroll-snap-type:x proximity; }
.card-row__list{ display:flex; gap:var(--space-3); }
.card-row__list > li{ flex:0 0 min(70%,250px); scroll-snap-align:start; }
.how{ display:grid; grid-template-columns:1fr; gap:var(--space-5); }
.how__col h3{ margin-bottom:var(--space-3); }
.steps{ display:flex; flex-direction:column; gap:var(--space-3); counter-reset:step; }
.steps li{ display:flex; align-items:flex-start; gap:var(--space-3); counter-increment:step; }
.steps li::before{ content:counter(step); flex:none; display:grid; place-items:center; width:28px; height:28px; border-radius:50%; background:var(--surface-2); border:1px solid var(--border); color:var(--accent); font-size:.875rem; font-weight:800; }
.cta{ display:flex; flex-direction:column; gap:var(--space-4); padding:var(--space-5); border:1px solid var(--border); border-radius:var(--radius-lg); background:linear-gradient(135deg,var(--surface-2),var(--surface)); }
.cta .btn{ align-self:flex-start; }
@media (min-width:640px){
  .how{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  .cta{ flex-direction:row; align-items:center; justify-content:space-between; }
}
@media (min-width:1024px){
  .card-row{ overflow:visible; }
  .card-row__list{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); }
}
/* Browse */
.icon--sm{ width:16px; height:16px; }
select{ font:inherit; }
.empty__actions{ display:flex; flex-wrap:wrap; gap:var(--space-3); }
#browse-root > h1{ margin-bottom:var(--space-4); }
.browse__layout{ display:block; }
.browse__side{ display:none; }
.browse__bar{ display:flex; flex-direction:column; gap:var(--space-3); }
.browse-search{ display:flex; gap:var(--space-2); }
.browse-search .btn{ padding-inline:var(--space-4); }
.browse__tools{ display:flex; align-items:flex-end; justify-content:space-between; gap:var(--space-3); }
.sortbox{ display:flex; flex-direction:column; gap:var(--space-1); flex:1 1 auto; min-width:0; max-width:240px; }
.flabel{ display:block; margin-bottom:var(--space-1); font-size:.875rem; font-weight:600; }
.sortbox .flabel{ margin-bottom:0; color:var(--muted); font-size:.8125rem; }
.ferror{ margin-top:var(--space-1); color:var(--danger); font-size:.8125rem; }
.field[aria-invalid="true"]{ border-color:var(--danger); }
.fchips{ display:flex; flex-wrap:wrap; align-items:center; gap:var(--space-2); margin-top:var(--space-3); }
.fchips:empty{ display:none; }
.chip--removable{ gap:var(--space-2); min-height:44px; padding:0 var(--space-3); background:var(--surface); color:var(--text); font:inherit; font-size:.875rem; cursor:pointer; transition:border-color .15s; }
.chip--removable:hover{ border-color:var(--accent); }
.link--btn{ padding:0 var(--space-2); border:0; background:none; font:inherit; font-weight:700; cursor:pointer; }
.results-head{ min-height:1.5em; margin-block:var(--space-4) var(--space-3); }
.filters{ display:flex; flex-direction:column; gap:var(--space-4); }
.filters__row2{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--space-3); }
.filters__actions{ display:flex; flex-wrap:wrap; gap:var(--space-3); }
.more{ display:flex; flex-direction:column; align-items:center; gap:var(--space-3); margin-top:var(--space-5); }
@media (min-width:1024px){
  .browse__layout{ display:grid; grid-template-columns:260px minmax(0,1fr); gap:var(--space-6); align-items:start; }
  .browse__side{ display:block; position:sticky; top:calc(var(--header-h) + var(--space-4)); padding:var(--space-4); border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); }
  .browse__side-title{ margin-bottom:var(--space-4); font-size:1.15rem; }
  [data-action="browse-open-filters"]{ display:none; }
  .browse__bar{ flex-direction:row; align-items:flex-end; }
  .browse-search{ flex:1; }
  .browse__tools{ flex:none; }
  .browse__main .card-grid{ grid-template-columns:repeat(3,minmax(0,1fr)); }
}
/* Listing page */
ol{ list-style:none; margin:0; padding:0; }
.listing{ padding-top:0; }
.breadcrumbs ol{ display:flex; flex-wrap:wrap; align-items:center; gap:0 var(--space-2); }
.breadcrumbs li{ display:flex; align-items:center; min-width:0; font-size:.875rem; }
.breadcrumbs li + li::before{ content:"\203A"; margin-right:var(--space-2); color:var(--muted); }
.breadcrumbs a{ display:inline-flex; align-items:center; min-height:44px; padding-inline:var(--space-2); color:var(--muted); }
.breadcrumbs a:hover{ color:var(--text); text-decoration:underline; }
.breadcrumbs [aria-current]{ max-width:60vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); }
.banner{ margin-bottom:var(--space-3); padding:var(--space-3) var(--space-4); border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); }
.banner--demo{ border-color:rgba(255,176,32,.45); background:rgba(255,176,32,.08); }
.banner--sold{ border-color:rgba(255,92,108,.45); background:rgba(255,92,108,.08); }
.listing__grid{ display:grid; grid-template-columns:minmax(0,1fr); gap:var(--space-5); margin-top:var(--space-2); }
.listing__summary{ display:flex; flex-direction:column; align-items:flex-start; gap:var(--space-3); min-width:0; }
.listing__summary h1{ font-size:clamp(1.5rem,5vw,2.1rem); }
.listing__price{ color:var(--accent); font-size:clamp(1.6rem,5vw,2.25rem); line-height:1.15; }
.listing__chips{ display:flex; flex-wrap:wrap; gap:var(--space-2); }
.listing__meta{ overflow-wrap:anywhere; }
.listing__actions{ display:flex; flex-wrap:wrap; gap:var(--space-3); width:100%; }
.listing__actions .btn--primary{ flex:1 1 100%; }
.btn[aria-pressed="true"] .icon{ fill:currentColor; color:var(--accent); }
.desc{ white-space:pre-line; overflow-wrap:anywhere; }
.listing__desc h2, .listing__seller h2{ margin-bottom:var(--space-3); }
.seller-card{ display:flex; flex-direction:column; align-items:flex-start; gap:var(--space-3); padding:var(--space-4); border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); }
.seller-card h2{ margin-bottom:0; font-size:1.15rem; }
.seller-card__row{ display:flex; align-items:center; gap:var(--space-3); }

<script>
(function () {
'use strict';

/* ===== SZ:CONFIG ===== */
const SZ_VERSION = 'V07';
const SZ = { config: {}, pure: {}, store: null, data: null, ui: {}, router: {} };
window.SZ = SZ;

SZ.config = {
  VERSION: SZ_VERSION,
  // Bump when a stored data shape changes, and add a step to SZ.store.migrations (migrations[n] upgrades n -> n+1).
  // 1 = V02 (demo data stored under the single key "db").
  DATA_SCHEMA_VERSION: 1,
  CATEGORIES: [
    { slug:'consoles',          label:'Consoles',                  icon:'🎮', enabled:true,  hint:'PlayStation, Xbox, Nintendo, retro' },
    { slug:'games',             label:'Games',                     icon:'💿', enabled:true,  hint:'Disc and cartridge games' },
    { slug:'accessories',       label:'Controllers & accessories', icon:'🎧', enabled:true,  hint:'Controllers, headsets, chargers' },
    { slug:'pc-gaming',         label:'Gaming PCs & parts',        icon:'🖥️', enabled:true,  hint:'PCs, laptops, graphics cards, components' },
    { slug:'phones',            label:'Phones',                    icon:'📱', enabled:false, hint:'Samsung, iPhone and more' },

    { slug:'good', label:'Good' }, { slug:'fair', label:'Fair (visible wear)' },

  ],
  PROVINCES: {

    'Free State':    ['Bloemfontein','Welkom','Bethlehem','Kroonstad'],
    'Gauteng':       ['Johannesburg','Pretoria','Sandton','Soweto','Centurion','Midrand','Roodepoort','Benoni','Boksburg','Germiston','Krugersdorp','Vereeniging'],
    'KwaZulu-Natal': ['Durban','Pietermaritzburg','Umhlanga','Pinetown','Richards Bay','Newcastle','Ladysmith'],
    'Limpopo':       ['Polokwane','Tzaneen','Mokopane','Thohoyandou','Musina'],

    'North West':    ['Rustenburg','Potchefstroom','Klerksdorp','Mahikeng','Brits'],
    'Northern Cape': ['Kimberley','Upington','Springbok','Kuruman'],
    'Western Cape':  ['Cape Town','Bellville','Stellenbosch','Paarl','George','Somerset West','Worcester'],
  },   // every city dropdown also offers "Other…" (free text, 2–60 chars)
  REPORT_REASONS: [
    { slug:'scam', label:'Looks like a scam' }, { slug:'stolen', label:'Possibly stolen' },
    { slug:'prohibited', label:'Prohibited item' }, { slug:'fake_or_misleading', label:'Fake or misleading' },
    { slug:'spam', label:'Spam or duplicate' }, { slug:'wrong_category', label:'Wrong category' },
    { slug:'other', label:'Something else' },
  ],
  // MASTERPLAN 5.2 — identical in client, adapter and database. [min, max] pairs are inclusive.
  LIMITS: {
    TITLE: [5, 80], DESCRIPTION: [20, 2000], PRICE_ZAR: [1, 1000000], CITY: [2, 60], PHOTOS: [1, 4], PHOTO_MAX_KB: 500,
    DISPLAY_NAME: [2, 40], BIO_MAX: 300, REPORT_DETAILS_MAX: 500, PASSWORD_MIN: 8, LISTINGS_PER_24H: 10,
  },
  PAGE_SIZE: 12,
  // Feature flags. DEV shows the #/dev tools; V15 hides dev routes and V26 sets it to false.
  DEV: true,
  DEMO_ADMIN_EMAIL: 'admin@spawnza.test',
  ADS_ENABLED: false,
};

/* ===== SZ:PURE-START ===== */
/* Pure helpers: no DOM, no storage. Tested in node (MASTERPLAN 11.1).
   Expected results:
   esc('<b title="x">&\'')               -> '&lt;b title=&quot;x&quot;&gt;&amp;&#39;'
   esc(null) / esc(undefined)            -> ''
   fmtZAR(1299)                          -> 'R 1 299'   (shown as R 1 299; thousands use a non-breaking space)
   fmtZAR(1000000)                       -> 'R 1 000 000'
   fmtZAR(7000) / fmtZAR(850) / fmtZAR(0)-> 'R 7 000' / 'R 850' / 'R 0'
   fmtZAR('abc') / fmtZAR(null)          -> ''
   timeAgo(now - 30 s)                   -> 'just now'
   timeAgo(now - 5 min)                  -> '5 minutes ago'      (1 -> '1 minute ago')
   timeAgo(now - 3 h)                    -> '3 hours ago'
   timeAgo(now - 3 days)                 -> '3 days ago'
   timeAgo(now - 14 days)                -> '2 weeks ago'
   timeAgo(now - 90 days)                -> '3 months ago'
   timeAgo(now - 800 days)               -> '2 years ago'
   timeAgo(future date) / bad input      -> 'just now' / ''
   normalizeText('  Gran Turismo® Édition ')  -> '  gran turismo® edition ' (lowercase, diacritics stripped)
   slugify('Mbombela (Nelspruit)')       -> 'mbombela-nelspruit'
   slugify('PS5 Disc  Edition!')         -> 'ps5-disc-edition'
   parseHashQuery('#/browse?q=ps5&cat=consoles')
       -> { path:'/browse', segments:['browse'], query:{ q:'ps5', cat:'consoles' } }
   parseHashQuery('') / parseHashQuery('#') / parseHashQuery('#/')  -> path '/', segments [], query {}
   buildHashQuery('/browse', { q:'ps 5', cat:'', min:null }) -> '#/browse?q=ps%205'
   parseHashQuery(buildHashQuery(p, q)) round-trips path and query. */
const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
function esc(value) {
  return String(value === null || value === undefined ? '' : value).replace(/[&<>"']/g, function (ch) { return ESC_MAP[ch]; });
}

function fmtZAR(amount) {
  if (amount === null || amount === undefined || amount === '') return '';
  const n = Math.round(Number(amount));
  if (!Number.isFinite(n)) return '';
  const digits = String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (n < 0 ? '-' : '') + 'R ' + digits;
}

function timeAgo(when, now) {
  const t = when instanceof Date ? when.getTime() : (typeof when === 'number' ? when : Date.parse(when));
  if (!Number.isFinite(t)) return '';
  const ref = now === undefined ? Date.now() : (now instanceof Date ? now.getTime() : Number(now));
  if (!Number.isFinite(ref)) return '';
  const sec = Math.max(0, Math.floor((ref - t) / 1000));
  const plural = function (n, unit) { return n + ' ' + unit + (n === 1 ? '' : 's') + ' ago'; };
  if (sec < 60) return 'just now';
  const min = Math.floor(sec / 60);
  if (min < 60) return plural(min, 'minute');
  const hours = Math.floor(min / 60);
  if (hours < 24) return plural(hours, 'hour');
  const days = Math.floor(hours / 24);
  if (days < 7) return plural(days, 'day');
  if (days < 35) return plural(Math.floor(days / 7), 'week');
  if (days < 365) return plural(Math.min(11, Math.max(1, Math.floor(days / 30))), 'month');
  return plural(Math.floor(days / 365), 'year');
}

function normalizeText(value) {
  return String(value === null || value === undefined ? '' : value).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
}

function slugify(value) {
  return normalizeText(value).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

function safeDecode(s) {
  try { return decodeURIComponent(s); } catch (e) { return s; }
}

function parseHashQuery(hash) {
  let h = String(hash === null || hash === undefined ? '' : hash);
  if (h.charAt(0) === '#') h = h.slice(1);
  const qi = h.indexOf('?');
  const rawPath = qi === -1 ? h : h.slice(0, qi);
  const rawQuery = qi === -1 ? '' : h.slice(qi + 1);
  const segments = rawPath.split('/').filter(Boolean).map(safeDecode);
  const query = {};
  if (rawQuery) {
    rawQuery.split('&').forEach(function (pair) {
      if (!pair) return;
      const eq = pair.indexOf('=');
      const k = safeDecode((eq === -1 ? pair : pair.slice(0, eq)).replace(/\+/g, ' '));
      const v = safeDecode((eq === -1 ? '' : pair.slice(eq + 1)).replace(/\+/g, ' '));
      if (k && k !== '__proto__') query[k] = v;
    });
  }
  return { path: '/' + segments.join('/'), segments: segments, query: query };
}

function buildHashQuery(path, query) {
  let p = String(path === null || path === undefined ? '/' : path);
  if (p.charAt(0) === '#') p = p.slice(1);
  let out = '#/' + p.split('/').filter(Boolean).map(encodeURIComponent).join('/');
  const parts = [];
  if (query && typeof query === 'object') {
    Object.keys(query).forEach(function (k) {
      const v = query[k];
      if (v === undefined || v === null || v === '') return;
      parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(String(v)));
    });
  }
  if (parts.length) out += '?' + parts.join('&');
  return out;
}
/* ===== SZ:PURE-END ===== */

SZ.pure = { esc: esc, fmtZAR: fmtZAR, timeAgo: timeAgo, normalizeText: normalizeText, slugify: slugify, parseHashQuery: parseHashQuery, buildHashQuery: buildHashQuery };

/* ===== SZ:STORE ===== */
/* Storage wrapper. Keys are prefixed "sz:". Values are JSON. Every read/write is wrapped in try/catch.
   If localStorage is blocked (e.g. Claude's in-chat preview) or a write fails, data lives in memory only
   and mode becomes 'memory' (the shell then shows the Preview-mode banner).
   IndexedDB for photo blobs arrives in V08. */
SZ.store = (function () {
  const PREFIX = 'sz:';
  const mem = new Map();
  const listeners = [];
  const migrations = [];   // migrations[n] upgrades stored data from schema n to n+1: function (store) {}
  let localOk = true;
  let mode = 'local';

  try {
    const probeKey = PREFIX + '__probe';
    window.localStorage.setItem(probeKey, '1');
    window.localStorage.removeItem(probeKey);
  } catch (e) { localOk = false; mode = 'memory'; }

  function setMode(next) {
    if (next === mode) return;
    mode = next;
    listeners.forEach(function (fn) { try { fn(mode); } catch (e) { /* a bad listener must not break storage */ } });
  }
  function readRaw(key) {
    const k = PREFIX + key;
    if (mem.has(k)) return mem.get(k);
    if (!localOk) return null;
    try { return window.localStorage.getItem(k); } catch (e) { return null; }
  }
  function get(key, fallback) {
    const raw = readRaw(key);
    if (raw === null || raw === undefined) return fallback === undefined ? null : fallback;
    try { return JSON.parse(raw); } catch (e) { return fallback === undefined ? null : fallback; }
  }
  function set(key, value) {
    let raw;
    try { raw = JSON.stringify(value); } catch (e) { return false; }
    if (raw === undefined) return false;
    const k = PREFIX + key;
    if (localOk) {
      try { window.localStorage.setItem(k, raw); mem.delete(k); return true; }
      catch (e) { setMode('memory'); }   // quota or blocked: keep this value in memory
    }
    mem.set(k, raw);
    return false;                        // false = not persisted
  }
  function remove(key) {
    const k = PREFIX + key;
    mem.delete(k);
    if (!localOk) return;
    try { window.localStorage.removeItem(k); } catch (e) { /* ignore */ }
  }
  function keys() {
    const found = new Set();
    mem.forEach(function (_v, k) { if (k.indexOf(PREFIX) === 0) found.add(k.slice(PREFIX.length)); });
    if (localOk) {
      try {
        for (let i = 0; i < window.localStorage.length; i++) {
          const k = window.localStorage.key(i);
          if (k && k.indexOf(PREFIX) === 0) found.add(k.slice(PREFIX.length));
        }
      } catch (e) { /* ignore */ }
    }
    return Array.from(found);
  }
  function migrate() {
    const target = SZ.config.DATA_SCHEMA_VERSION;
    const stored = Number(get('schema', 0)) || 0;
    let v = stored;

SZ.data = (function () {

  SZ.store.migrations[0] = function (store) { store.remove('db'); };

  function db() {
    if (cache) return cache;
    cache = SZ.store.get('db', null);
    if (!cache || !Array.isArray(cache.listings) || !Array.isArray(cache.users) || !Array.isArray(cache.features)) {
      cache = SZ.seed.generate(Date.now());      // seeding runs only when the store is empty (or on "Reset demo data")
      SZ.store.set('db', cache);
    }

  }
  const clone = function (o) { return JSON.parse(JSON.stringify(o)); };

    const c = SZ.config.CATEGORIES.find(function (x) { return x.slug === slug; });
    return !!(c && c.enabled);
  };

    if (v === undefined || v === null || v === '') return null;

  };

  const api = {};

  // listListings({q,category,province,city,minPrice,maxPrice,sort,page,pageSize,sellerId,status}) -> { items, total }
  // Keyword rule: normalizeText the query, split into tokens, EVERY token must appear in title or description.
  // Without `status`, only active listings. Listings in a disabled category never appear in public results.
  api.listListings = async function (opts) {
    const o = opts || {};
    const status = o.status || 'active';
    const tokens = normalizeText(o.q).split(/\s+/).filter(Boolean);
    const min = numOrNull(o.minPrice);
    const max = numOrNull(o.maxPrice);
    const prov = o.province ? normalizeText(o.province) : '';
    const city = o.city ? normalizeText(o.city) : '';
    const items = db().listings.filter(function (l) {
      if (l.status !== status || !categoryOn(l.category)) return false;
      if (o.category && l.category !== o.category) return false;
      if (o.sellerId && l.sellerId !== o.sellerId) return false;
      if (prov && normalizeText(l.province) !== prov) return false;
      if (city && normalizeText(l.city) !== city) return false;
      if (min !== null && l.priceZAR < min) return false;
      if (max !== null && l.priceZAR > max) return false;
      if (tokens.length) {
        const hay = normalizeText(l.title + ' ' + l.description);
        if (!tokens.every(function (t) { return hay.indexOf(t) !== -1; })) return false;
      }
      return true;
    });
    const newest = function (a, b) { return created(b) - created(a) || (a.id < b.id ? -1 : 1); };
    const sorters = {
      'price-asc': function (a, b) { return a.priceZAR - b.priceZAR || newest(a, b); },
      'price-desc': function (a, b) { return b.priceZAR - a.priceZAR || newest(a, b); },
    };

    const size = Math.min(100, Math.max(1, Math.floor(Number(o.pageSize)) || SZ.config.PAGE_SIZE));
    const page = Math.max(1, Math.floor(Number(o.page)) || 1);

  };

  api.getListing = async function (id) {

  // Public fields only. Never email, role or any contact detail.

        sellerType: 'individual', role: 'user', createdAt: iso(now - s[3] * DAY), isDemo: true,
      };
    });
    const listings = ROWS.map(function (r, i) {
      const at = now - r[8] * DAY - ((i * 7) % 20) * 3600000;   // spread through the day
      const sold = r[10] === 'sold';
      return {
        id: 'demo-' + String(i + 1).padStart(2, '0'), sellerId: users[r[9]].id, title: r[2], description: r[3],
        category: CAT[r[0]], condition: COND[r[1]], priceZAR: r[4], negotiable: !!r[5], province: PROV[r[6]], city: r[7],
        photoIds: [], status: sold ? 'sold' : 'active', isDemo: true, createdAt: iso(at),
        updatedAt: iso(sold ? at + 3 * DAY : at), soldAt: sold ? iso(at + 3 * DAY) : null, views: 12 + (i * 37) % 140,
      };
    });
    const features = FEATURED.map(function (id, i) {
      return {
        id: 'demo-feature-' + (i + 1), listingId: id, startsAt: iso(now - 2 * DAY), endsAt: iso(now + 60 * DAY),
        verifiedBy: 'demo-admin', note: 'Demo feature. No payment involved.', isDemo: true,
      };
    });
    return { users: users, listings: listings, features: features, seededAt: iso(now) };
  }
  return { generate: generate };
})();

/* ===== SZ:ART ===== */
/* Procedural placeholder artwork: art(categorySlug, seed, label) -> SVG data URI. Deterministic from the seed. */
SZ.art = (function () {
  const COLOURS = {
    'consoles': ['#1c3d63', '#0d1b2e'], 'games': ['#46245f', '#1b0f27'], 'accessories': ['#1f5a45', '#0d2a20'],
    'pc-gaming': ['#5c4220', '#2a1d0d'], 'phones': ['#5c2046', '#2a0d20'], 'other-electronics': ['#20485c', '#0d222a'],
  };
  function hash(s) {
    let h = 2166136261;
    s = String(s);
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  return function art(categorySlug, seed, label) {
    const cat = SZ.config.CATEGORIES.find(function (c) { return c.slug === categorySlug; });
    const col = COLOURS[categorySlug] || ['#2b323b', '#161a1f'];
    const h = hash(categorySlug + '|' + seed);
    const angle = h % 360;
    const cx = 40 + (h >>> 3) % 320;
    const cy = 30 + (h >>> 7) % 240;
    const r = 60 + (h >>> 11) % 90;
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">' +
      '<defs><linearGradient id="g" gradientTransform="rotate(' + angle + ' .5 .5)"><stop offset="0" stop-color="' + col[0] + '"/><stop offset="1" stop-color="' + col[1] + '"/></linearGradient></defs>' +
      '<rect width="400" height="300" fill="url(#g)"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#ffffff" fill-opacity=".05"/>' +
      '<text x="200" y="170" font-size="96" text-anchor="middle">' + esc(cat ? cat.icon : '📦') + '</text>' +
      '<text x="200" y="278" font-size="14" font-weight="700" letter-spacing="3" text-anchor="middle" fill="#ffffff" fill-opacity=".35" font-family="sans-serif">' + esc(String(label || 'Demo photo').toUpperCase()) + '</text></svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  };
})();

/* ===== SZ:UI ===== */
SZ.ui = (function () {
  const ui = { actions: {}, forms: {} };   // additive registries: later versions add their own entries
  const $ = function (sel, root) { return (root || document).querySelector(sel); };
  const $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

  ui.icon = function (name, extraClass) {
    return '<svg class="icon' + (extraClass ? ' ' + esc(extraClass) : '') + '" aria-hidden="true" focusable="false"><use href="#i-' + esc(name) + '"/></svg>';
  };

  /* Shell: navigation is rendered from SZ.config.NAV so the three menus never drift apart. */
  /* V06: the Account item follows the session: "Log in" (-> #/login) when signed out, "Account" (-> #/account) when signed in. */
  ui.navItems = function () {
    const signedIn = !!(SZ.auth && SZ.auth.user);
    return SZ.config.NAV.map(function (n) {
      return n.id === 'account' ? Object.assign({}, n, signedIn ? { label: 'Account', href: '#/account' } : { label: 'Log in', href: '#/login' }) : n;
    });
  };
  ui.syncAuth = function () { ui.renderShell(); ui.setActiveNav(ui.activeNav || null); };
  ui.renderShell = function () {
    const nav = ui.navItems();
    $('#sz-nav-desktop').innerHTML = nav.filter(function (n) { return n.desktop; }).map(function (n) {
      const cls = n.desktop === 'button' ? 'btn btn--primary' : 'nav-link';
      return '<li><a class="' + cls + '" href="' + esc(n.href) + '" data-nav="' + esc(n.id) + '">' + esc(n.label) + '</a></li>';
    }).join('');
    $('#sz-tabbar').innerHTML = nav.filter(function (n) { return n.tab; }).map(function (n) {
      if (n.id === 'sell') {
        return '<li class="tabbar__sell"><a href="' + esc(n.href) + '" data-nav="sell"><span class="sell-bubble">' + ui.icon('plus') + '</span><span>' + esc(n.label) + '</span></a></li>';
      }
      return '<li><a href="' + esc(n.href) + '" data-nav="' + esc(n.id) + '">' + ui.icon(n.icon) + '<span>' + esc(n.label) + '</span></a></li>';
    }).join('');
    $('#sz-stamp').textContent = 'Prototype ' + SZ.config.VERSION + ' · demo data';
    ui.syncBanner();
  };

  ui.setActiveNav = function (id) {
    ui.activeNav = id;
    $$('[data-nav]').forEach(function (a) {
      if (id && a.getAttribute('data-nav') === id) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
  };

  ui.syncBanner = function () {
    const el = $('#sz-banner');
    if (!el) return;
    if (SZ.store.mode === 'memory') {
      el.textContent = "Preview mode — changes won't be saved. Open the downloaded file in Chrome to test saving.";
      el.hidden = false;
    } else {
      el.textContent = '';
      el.hidden = true;
    }
  };

  /* Toast: plain text only (textContent), announced through the aria-live region. */
  ui.toast = function (message, opts) {
    const o = Object.assign({ type: 'info', duration: 4000 }, opts || {});
    const host = $('#sz-toasts');
    if (!host) return null;
    const el = document.createElement('div');
    el.className = 'toast toast--' + o.type;
    el.textContent = String(message);
    host.appendChild(el);
    while (host.children.length > 3) host.removeChild(host.firstChild);
    window.requestAnimationFrame(function () { el.classList.add('is-in'); });
    const remove = function () {
      el.classList.remove('is-in');
      window.setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 220);
    };
    window.setTimeout(remove, o.type === 'error' ? Math.max(o.duration, 6000) : o.duration);
    return el;
  };

  /* Modal / sheet. bodyHtml is inserted as HTML, so callers must pass any user text through esc() first. */
  let activeModal = null;
  const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
  function focusables(root) {
    return $$(FOCUSABLE, root).filter(function (el) { return el.offsetParent !== null || el === document.activeElement; });
  }
  ui.modal = {
    open: function (opts) {
      const o = Object.assign({ title: '', bodyHtml: '', dismissible: true, onClose: null }, opts || {});
      const opener = activeModal ? activeModal.opener : document.activeElement;
      if (activeModal) ui.modal.close({ restoreFocus: false });
      const root = document.createElement('div');
      root.className = 'modal-backdrop';
      root.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="sz-modal-title" tabindex="-1">' +
        '<div class="modal__head"><h2 class="modal__title" id="sz-modal-title">' + esc(o.title) + '</h2>' +
        '<button type="button" class="icon-btn" data-action="close-modal" aria-label="Close">' + ui.icon('close') + '</button></div>' +
        '<div class="modal__body">' + o.bodyHtml + '</div></div>';
      document.body.appendChild(root);
      const app = $('#app');
      if (app) app.setAttribute('inert', '');
      document.documentElement.classList.add('modal-open');
      const dialog = $('.modal', root);
      root.addEventListener('click', function (e) {
        if (e.target === root && o.dismissible) ui.modal.close();
        else if (e.target.closest && e.target.closest('a[href]')) ui.modal.close();   // navigating away closes it
      });
      activeModal = { root: root, dialog: dialog, opener: opener, onClose: o.onClose, dismissible: o.dismissible };
      window.requestAnimationFrame(function () { root.classList.add('is-in'); });
      dialog.focus();
      return dialog;
    },
    close: function (opts) {
      if (!activeModal) return;
      const m = activeModal;
      activeModal = null;
      if (m.root.parentNode) m.root.parentNode.removeChild(m.root);
      const app = $('#app');
      if (app) app.removeAttribute('inert');
      document.documentElement.classList.remove('modal-open');
      if (!opts || opts.restoreFocus !== false) {
        if (m.opener && m.opener.focus && document.contains(m.opener)) m.opener.focus();
      }
      if (typeof m.onClose === 'function') { try { m.onClose(); } catch (e) { /* ignore */ } }
    },
    isOpen: function () { return !!activeModal; },
  };

  /* ListingCard (MASTERPLAN 3.3): the whole card is one link; every user value goes through esc().
     opts.featured adds the FEATURED badge (callers decide using SZ.data.getActiveFeatures). V08 swaps in real photos. */
  ui.listingCard = function (l, opts) {
    const o = opts || {};
    const cond = SZ.config.CONDITIONS.find(function (c) { return c.slug === l.condition; });

    return '<a class="card card--link" href="' + esc('#/listing/' + encodeURIComponent(l.id)) + '">' +
      '<div class="card__media"><img src="' + esc(SZ.art(l.category, l.id, l.isDemo ? 'Demo photo' : 'No photo yet')) + '" alt="' + (l.isDemo ? 'Demo photo' : 'No photo yet') + '" width="400" height="300" loading="lazy" decoding="async"></div>' +
      '<div class="card__body">' + (badges ? '<div class="card__badges">' + badges + '</div>' : '') +
      '<h3 class="card__title">' + esc(l.title) + '</h3>' +
      '<p class="card__price price">' + esc(fmtZAR(l.priceZAR)) + '</p>' +
      '<span class="chip">' + esc(cond ? cond.label : '') + '</span>' +
      '<p class="card__meta">' + esc(l.city + ', ' + l.province) + '</p>' +
      '<p class="card__meta">Listed ' + esc(timeAgo(l.createdAt)) + '</p></div></a>';
  };

  /* Skeleton placeholders for loading grids (a decorative shimmer, hidden from screen readers). */
  ui.skeletonCards = function (n) {
    let items = '';
    for (let i = 0; i < n; i++) {
      items += '<li><div class="card"><div class="card__media skel"></div><div class="card__body">' +
        '<span class="skel skel--line skel--short"></span><span class="skel skel--line"></span><span class="skel skel--line skel--short"></span></div></div></li>';
    }
    return '<ul class="card-grid" aria-hidden="true">' + items + '</ul>';
  };

  /* EmptyState (3.3): icon, title (h2), text, and a row of action buttons. actionsHtml is caller-built, already-escaped HTML. */
  ui.emptyState = function (o) {
    return '<div class="empty">' + (o.icon ? '<span class="empty__icon">' + ui.icon(o.icon) + '</span>' : '') +
      '<h2>' + esc(o.title) + '</h2>' + (o.text ? '<p class="muted">' + esc(o.text) + '</p>' : '') +
      (o.actionsHtml ? '<div class="empty__actions">' + o.actionsHtml + '</div>' : '') + '</div>';
  };

  /* Breadcrumbs (3.3): items are {label, href?}; the last one is the current page (no link). */
  ui.breadcrumbs = function (items) {
    return '<nav class="breadcrumbs" aria-label="Breadcrumb"><ol>' + items.map(function (it, i) {
      const last = i === items.length - 1;
      return '<li>' + (it.href && !last ? '<a href="' + esc(it.href) + '">' + esc(it.label) + '</a>'
        : '<span' + (last ? ' aria-current="page"' : '') + '>' + esc(it.label) + '</span>') + '</li>';
    }).join('') + '</ol></nav>';
  };

  /* Views that are not built yet use this (replaced by the real view in the version noted). */
  ui.comingSoon = function (name, plannedVersion) {
    return '<section class="container page"><div class="empty">' +
      '<span class="empty__icon">' + ui.icon('clock') + '</span>' +
      '<h1>' + esc(name) + '</h1>' +
      '<p class="muted">Coming soon. This part of Spawnza is still being built (planned for ' + esc(plannedVersion) + ').</p>' +
      '<a class="btn btn--secondary" href="#/">Back to home</a></div></section>';
  };

  /* Delegated events. Shell controls, <main> content and dialogs all use data-action / data-form. */
  document.addEventListener('click', function (e) {
    const t = e.target.closest ? e.target.closest('[data-action]') : null;
    if (!t) return;
    const fn = ui.actions[t.getAttribute('data-action')];
    if (typeof fn === 'function') fn(t, e);
  });
  document.addEventListener('submit', function (e) {
    const f = e.target.closest ? e.target.closest('[data-form]') : null;
    if (!f) return;
    const fn = ui.forms[f.getAttribute('data-form')];
    if (typeof fn === 'function') { e.preventDefault(); fn(f, e); }
  });
  document.addEventListener('keydown', function (e) {
    if (activeModal) {
      if (e.key === 'Escape' && activeModal.dismissible) { e.preventDefault(); ui.modal.close(); return; }
      if (e.key === 'Tab') {
        const items = focusables(activeModal.dialog);
        if (!items.length) { e.preventDefault(); activeModal.dialog.focus(); return; }
        const first = items[0];
        const last = items[items.length - 1];
        const cur = document.activeElement;
        if (e.shiftKey && (cur === first || cur === activeModal.dialog)) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && cur === last) { e.preventDefault(); first.focus(); }
      }
      return;
    }
    if (e.key === 'Escape') {
      const search = $('#sz-search');
      if (search && search.classList.contains('is-open') && search.contains(document.activeElement)) { closeSearch(); const b = $('[data-action="toggle-search"]'); if (b) b.focus(); }
    }
  });

  function closeSearch() {

    if (btn) btn.setAttribute('aria-expanded', 'false');

  ui.actions['skip-to-content'] = function (_el, e) {
    e.preventDefault();               // "#main" would otherwise change the route hash
    const main = $('#main');
    if (main) main.focus();
  };
  ui.actions['toggle-search'] = function (btn) {
    const search = $('#sz-search');
    const open = !search.classList.contains('is-open');
    search.classList.toggle('is-open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) $('#sz-search-input').focus();

  ui.actions['open-menu'] = function () {
